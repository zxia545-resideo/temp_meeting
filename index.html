message_schema_validation.py::TestMessageSchemaValidation::test_volume_schema_validation", "file": "cloud/test_message_schema_validation.py", "title": "Microphone Volume Configuration Message Schema Validation", "desc": "BDD Scenario: Volume Configuration Message Schema Validation\n\nGIVEN a device is online and responsive\nWHEN I configure microphone volume to MEDIUM level\nTHEN the system should return a valid transaction ID\nAND the Set.Volume.Config event should be logged in ElasticSearch\nAND the volume configuration message should comply with JSON schema\nAND a Set.Volume.Config.Ack message should be received\nAND the ACK message should comply with JSON schema", "cls": "automated", "labels": ["FWTC_Microphone", "FWTC_CloudEvent"], "primary": "FWTC_Microphone", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Validates the microphone volume config request and ack messages against JSON schema; microphone level configuration contract only, no functional outcome.", "unknown": []}, {"key": "UNI-34983", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_adjacent_non_overlapping_zones", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Adjacent Non-Overlapping Zones", "desc": "Feature: Motion Zone Configuration - Adjacent Zones\nScenario: Configure zones placed side-by-side without overlap\n    Given a camera is registered and online\n    When I configure Zone_1 at (0,0) with size 500x2160\n    And I configure Zone_2 at (500,0) with size 500x2160\n    And I configure Zone_3 at (1000,0) with size 500x2160\n    And I configure Zone_4 at (1500,0) with size 500x2160\n    Then x1 + width1 should equal x2 (adjacent)\n    And all zones should be accepted and positioned correctly", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone configuration of adjacent non-overlapping zones is acked and read back as expected.", "unknown": []}, {"key": "UNI-34977", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_all_four_zones_enabled", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure All 4 Zones Enabled", "desc": "Feature: Motion Zone Configuration - All Zones Enabled\nScenario: Configure all four zones with enabled=True\n    Given a camera is registered and online\n    When I configure 4 zones with enabled=True\n    Then each zone shall have enabled set to True\n    And all zones should be active", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone configuration with all four zones enabled is acked and read back as expected.", "unknown": []}, {"key": "UNI-34986", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_all_zones_min_and_max_values", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: All 4 Zones at Minimum then Maximum Valid Values", "desc": "Feature: Motion Zone Configuration - Min/Max Values\nScenario: Configure all zones at minimum values\n    Given a camera is registered and online\n    When I configure all zones at minimum values (x=0, y=0, w=1, h=1, wscale=1, hscale=1, threshold=80)\n    Then all zones should be created successfully\n    And the minimum values should be accepted\nScenario: Configure all zones at maximum values\n    Given a camera is registered and online\n    When I configure all zones at maximum values (x=0, y=0, w=4000, h=4000, wscale=4000, hscale=4000, threshold=1000)\n    Then all zones should be created successfully\n    And the maximum values should be accepted", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone min and max value configuration for all four zones is acked and read back as expected.", "unknown": []}, {"key": "UNI-34970", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_events_disabled_except_zone1", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure All Events Disabled Except Zone 1", "desc": "Feature: Motion Zone Configuration - Selective Event Disabling\nScenario: Configure 4 zones with all events disabled except Zone 1\n    Given a camera is registered and online\n    When I configure zones where Zone_1 has all events True and zones 2-4 have all events False\n    Then Zone_1 events are all True\n    And zones 2-4 events are all False\n    And Zone 1 remains enabled per requirement", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts zone 1 reads back all event flags true and zones 2-4 all false.", "unknown": []}, {"key": "UNI-34968", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_four_zones_all_corners", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure 4 Motion Zones at All Corners", "desc": "Feature: Motion Zone Configuration - Four Corners\nScenario: Configure 4 Motion Zones at All Corners\n    Given a camera is registered and online\n    When I configure motion zones at all four corners with zone_size=500 and wscale/hscale=1\n    Then all four zones shall exist after the ACK\n    And each zone x/y position shall be within ±1 pixel of the expected corner coordinates\n    And each zone width/height shall be within ±1 pixel of the sent size (500)\n    Note: Firmware normalises coordinates as uint16_t(value*scale)/kRealWidth.\n          Values such as 500 do not divide 3840 evenly, so a ±1 rounding loss is expected.", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone configuration of four zones at all corners is acked and read back as expected.", "unknown": []}, {"key": "UNI-34969", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_four_zones_all_events_enabled", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure All Events Enabled for All Zones", "desc": "Feature: Motion Zone Configuration - All Events Enabled\nScenario: Configure 4 zones with all event types enabled\n    Given a camera is registered and online\n    When I configure 4 zones with person/animal/package/vehicle/motion all True\n    Then each zone shall have all event types set to True\n    And the configuration should be persisted correctly", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts four zones with all event-type flags true are read back with correct flags, geometry and threshold.", "unknown": []}, {"key": "UNI-35648", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_invalid_motion_threshold[threshold-above-max]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Invalid motionThreshold values (-1, 1001) [threshold-above-max]", "desc": "Feature: Motion Zone Configuration - Invalid Threshold Validation\n    Scenario: Configure zone with invalid motionThreshold values\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to invalid values (-1, 1001)\n        Then the system shall reject it synchronously or asynchronously\n        Or persist only a value clamped to the supported 0..1000 range\n\n\nParameter ID: threshold-above-max\nParameter values: {\"desc\": \"above maximum (> 1000)\", \"threshold\": 1001}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts invalid zone motionThreshold values (-1, 1001) are handled per firmware rules.", "unknown": []}, {"key": "UNI-34981", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_invalid_motion_threshold[threshold-below-min]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Invalid motionThreshold values (-1, 1001) [threshold-below-min]", "desc": "Feature: Motion Zone Configuration - Invalid Threshold Validation\n    Scenario: Configure zone with invalid motionThreshold values\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to invalid values (-1, 1001)\n        Then the system shall reject it synchronously or asynchronously\n        Or persist only a value clamped to the supported 0..1000 range\n\n\nParameter ID: threshold-below-min\nParameter values: {\"desc\": \"below minimum (< 0)\", \"threshold\": -1}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts invalid zone motionThreshold values (-1, 1001) are handled per firmware rules.", "unknown": []}, {"key": "UNI-34985", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_mixed_enabled_disabled_zones", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Mixed Enabled and Disabled Zones", "desc": "Feature: Motion Zone Configuration - Mixed Enabled States\nScenario: Configure zones with mixed enabled and disabled states\n    Given a camera is registered and online\n    When I configure Zone_1 with enabled=True\n    And I configure Zone_2 with enabled=False\n    And I configure Zone_3 with enabled=True\n    And I configure Zone_4 with enabled=False\n    Then each zone should have the correct enabled state", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone mixed enabled/disabled zone configuration is acked and read back as expected.", "unknown": []}, {"key": "UNI-34971", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_mixed_event_combinations", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure Mixed Event Combinations", "desc": "Feature: Motion Zone Configuration - Mixed Event Combinations\nScenario: Configure zones with different event combinations\n    Given a camera is registered and online\n    When I configure Zone_1 with person+motion\n    And I configure Zone_2 with animal+motion\n    And I configure Zone_3 with package+motion\n    And I configure Zone_4 with vehicle+motion\n    Then each zone should have the correct unique event combination", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each of four zones reads back its unique event-flag combination.", "unknown": []}, {"key": "UNI-35649", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_nack_defaults_to_1000[nack-threshold-1001]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: NACK Threshold - Unsupported motionThreshold values default to 0,1000 [nack-threshold-1001]", "desc": "Feature: Motion Zone Configuration - Unsupported Threshold Handling\n    Scenario: Configure zone with unsupported motionThreshold values (0, 500)\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to unsupported values (0, 500)\n        Then the firmware should ACK the configuration\n        And the motionThreshold should default to 1000\n        And no crashes or undefined behavior should occur\n\n\nParameter ID: nack-threshold-1001\nParameter values: {\"desc\": \"threshold-500-not-valid-step\", \"threshold\": 1001}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an unsupported zone motionThreshold is acked but defaults to 1000.", "unknown": []}, {"key": "UNI-34973", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_nack_defaults_to_1000[nack-threshold-500]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: NACK Threshold - Unsupported motionThreshold values default to 0,1000 [nack-threshold-500]", "desc": "Feature: Motion Zone Configuration - Unsupported Threshold Handling\n    Scenario: Configure zone with unsupported motionThreshold values (0, 500)\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to unsupported values (0, 500)\n        Then the firmware should ACK the configuration\n        And the motionThreshold should default to 1000\n        And no crashes or undefined behavior should occur\n\n\nParameter ID: nack-threshold-500\nParameter values: {\"desc\": \"threshold-500-not-valid-step\", \"threshold\": 500}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an unsupported zone motionThreshold is acked but defaults to 1000.", "unknown": []}, {"key": "UNI-34974", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_negative_rejected", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: NACK Threshold - Negative motionThreshold (-1) rejected, config unchanged", "desc": "Feature: Motion Zone Configuration - Negative Threshold Rejection\nScenario: Configure zone with negative motionThreshold value\n    Given a camera is registered and online\n    When I configure a zone with motionThreshold=-1\n    Then the firmware should reject the configuration via NACK\n    And the Set.Zone.Config.Ack should never be received\n    And the previous/default zone configuration should remain unchanged\n    And existing zones should still have motionThreshold defaulted to 1000", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a negative zone motionThreshold is rejected and the previous config remains.", "unknown": []}, {"key": "UNI-35597", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_valid_values[threshold-1000-high]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Motion Threshold Valid Values (80, 250, 1000) [threshold-1000-high]", "desc": "Feature: Motion Zone Configuration - Motion Threshold Validation\n    Scenario: Configure zone with valid motionThreshold values\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to valid values (80, 250, 1000)\n        Then the zone should be created successfully\n        And the motionThreshold should be set to the configured value\n\n\nParameter ID: threshold-1000-high\nParameter values: {\"threshold\": 1000}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a zone motionThreshold of the parameterized valid value is read back unchanged.", "unknown": []}, {"key": "UNI-35596", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_valid_values[threshold-250-mid]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Motion Threshold Valid Values (80, 250, 1000) [threshold-250-mid]", "desc": "Feature: Motion Zone Configuration - Motion Threshold Validation\n    Scenario: Configure zone with valid motionThreshold values\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to valid values (80, 250, 1000)\n        Then the zone should be created successfully\n        And the motionThreshold should be set to the configured value\n\n\nParameter ID: threshold-250-mid\nParameter values: {\"threshold\": 250}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a zone motionThreshold of the parameterized valid value is read back unchanged.", "unknown": []}, {"key": "UNI-34972", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_threshold_valid_values[threshold-80-low]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Motion Threshold Valid Values (80, 250, 1000) [threshold-80-low]", "desc": "Feature: Motion Zone Configuration - Motion Threshold Validation\n    Scenario: Configure zone with valid motionThreshold values\n        Given a camera is registered and online\n        When I configure a zone with motionThreshold set to valid values (80, 250, 1000)\n        Then the zone should be created successfully\n        And the motionThreshold should be set to the configured value\n\n\nParameter ID: threshold-80-low\nParameter values: {\"threshold\": 80}", "cls": "automated", "labels": ["FWTC_MotionDetection", "FWTC_CloudEvent", "FWTC_DetectionAreas"], "primary": "FWTC_MotionDetection", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a zone motionThreshold of the parameterized valid value is read back unchanged.", "unknown": []}, {"key": "UNI-34967", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_corner_positions", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Corner and Edge Position Validation", "desc": "Feature: Motion Zone Configuration - Corner and Edge Positions\nScenario: Validate firmware handling of zones positioned at frame corners and edges\n    Given the camera supports 3840x2160 resolution\n    When I configure zones at each corner and edge of the frame\n    Then all zones should be accepted and positioned correctly\n\nZone Positions:\n- Top-left corner (0, 0)\n- Top-right corner (3340, 0) - 500x500 zone\n- Bottom-left corner (0, 1660) - 500x500 zone\n- Bottom-right corner (3340, 1660) - 500x500 zone", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone corner and edge position geometry is acked and read back as expected.", "unknown": []}, {"key": "UNI-35652", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_multiple_shapes[full-frame-3840x2160]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "test_motion_zone_multiple_shapes [full-frame-3840x2160]", "desc": "Parameter ID: full-frame-3840x2160\nParameter values: {\"animal\": true, \"height\": 2160, \"motion\": true, \"package\": true, \"person\": true, \"threshold\": 250, \"vehicle\": true, \"width\": 3840, \"x\": 0, \"y\": 0, \"zone_id\": \"Zone_FullFrame\"}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone geometry for the parameterized size/position is acked and read back as expected.", "unknown": []}, {"key": "UNI-35651", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_multiple_shapes[large-1920x1080-bottom-right]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "test_motion_zone_multiple_shapes [large-1920x1080-bottom-right]", "desc": "Parameter ID: large-1920x1080-bottom-right\nParameter values: {\"animal\": true, \"height\": 1080, \"motion\": true, \"package\": false, \"person\": true, \"threshold\": 250, \"vehicle\": true, \"width\": 1920, \"x\": 1920, \"y\": 1080, \"zone_id\": \"Zone_Large_BottomRight\"}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone geometry for the parameterized size/position is acked and read back as expected.", "unknown": []}, {"key": "UNI-35650", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_multiple_shapes[medium-1000x1000-center]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "test_motion_zone_multiple_shapes [medium-1000x1000-center]", "desc": "Parameter ID: medium-1000x1000-center\nParameter values: {\"animal\": true, \"height\": 1000, \"motion\": true, \"package\": false, \"person\": true, \"threshold\": 250, \"vehicle\": false, \"width\": 1000, \"x\": 1420, \"y\": 580, \"zone_id\": \"Zone_Medium_Center\"}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone geometry for the parameterized size/position is acked and read back as expected.", "unknown": []}, {"key": "UNI-34966", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_multiple_shapes[small-500x500-top-left]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "test_motion_zone_multiple_shapes [small-500x500-top-left]", "desc": "Parameter ID: small-500x500-top-left\nParameter values: {\"animal\": false, \"height\": 500, \"motion\": true, \"package\": false, \"person\": true, \"threshold\": 250, \"vehicle\": false, \"width\": 500, \"x\": 0, \"y\": 0, \"zone_id\": \"Zone_Small_TopLeft\"}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone geometry for the parameterized size/position is acked and read back as expected.", "unknown": []}, {"key": "UNI-34965", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_negative_width_height", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Negative Width/Height Value Handling", "desc": "Feature: Motion Zone Configuration - Negative Width/Height\nScenario: Validate firmware rejection of negative dimension values\n    Given the camera requires positive dimensions\n    When I configure a motion zone with negative width (-500) and height (-300)\n    Then the firmware should reject or convert to positive values\n    And maintain configuration consistency", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone negative width/height handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-34964", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_negative_x_y", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Negative Coordinate Value Handling", "desc": "Feature: Motion Zone Configuration - Negative Values\nScenario: Validate firmware rejection of negative coordinate values\n    Given the camera requires non-negative coordinates\n    When I configure a motion zone with negative x (-100) and y (-200)\n    Then the firmware should reject or clamp the values to 0\n    And maintain configuration consistency", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone negative X/Y handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-34960", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_out_of_bound_width_height", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Out of Bound Width/Height Clamping", "desc": "Feature: Motion Zone Configuration - Out of Bound Values\nScenario: Validate firmware handling of coordinates exceeding camera resolution\n    Given the camera supports resolution of 3840x2160\n    When I configure a motion zone with width exceeding max (width=5000)\n    Then the firmware should EITHER clamp the value to max resolution (3840)\n    OR reject the request with HTTP 400 (\"X, Y, Width and Height should be between 0 and 4000\")\n    And no crashes or undefined behavior should occur\n\nExpected Behavior (either outcome is acceptable):\nAPI rejects the request with HTTP 400 InvalidInput error", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone out-of-bound width/height clamping is acked and read back as expected.", "unknown": []}, {"key": "UNI-34961", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_out_of_bound_width_height_midrange", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Midrange Out of Bound Width/Height Clamping (3900)", "desc": "Feature: Motion Zone Configuration - Midrange Out of Bound Values (3840 < value < 4000)\nScenario: Validate firmware clamping of values in the 3840-4000 range\n    Given the camera supports resolution of 3840x2160\n    And the API accepts values between 0 and 4000\n    When I configure a motion zone with width=3900 and height=3900\n    And I wait for the Set.Zone.Config.Ack message\n    And I wait 5 seconds for the firmware to apply the configuration\n    And I request the current motion zone configuration via QoS -> Camera.CheckIn\n    Then the firmware should have clamped width to 3840 and height to 2160\n    And no crashes or undefined behavior should occur\n\nKey Insight:\nValues between 3840 and 4000 pass API validation (API allows 0-4000) but exceed\nthe actual camera resolution (3840x2160). The firmware must gracefully clamp these\nvalues to the max resolution bounds instead of crashing.\n\nPASS condition:\nFirmware clamps width to <= 3840 and height to <= 2160", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone midrange out-of-bound width/height clamping is acked and read back as expected.", "unknown": []}, {"key": "UNI-34962", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_out_of_bound_x_y", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Out of Bound X/Y Coordinate Clamping", "desc": "Feature: Motion Zone Configuration - Out of Bound X/Y Coordinates\nScenario: Validate firmware handling of X/Y coordinates exceeding camera resolution\n    Given the camera supports resolution of 3840x2160\n    When I configure a motion zone with x=5000 and y=3000 (beyond resolution)\n    Then the firmware should EITHER clamp the values appropriately\n    OR reject the request with HTTP 400 (\"X, Y, Width and Height should be between 0 and 4000\")\n    And maintain stable configuration state", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone out-of-bound X/Y clamping is acked and read back as expected.", "unknown": []}, {"key": "UNI-34963", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_motion_zone_out_of_bound_x_y_midrange", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Midrange Out of Bound X/Y Coordinate Clamping (3900)", "desc": "Feature: Motion Zone Configuration - Midrange Out of Bound X/Y Coordinates (3840 < value < 4000)\nScenario: Validate firmware clamping of X/Y values in the 3840-4000 range\n    Given the camera supports resolution of 3840x2160\n    And the API accepts values between 0 and 4000\n    When I configure a motion zone with x=3900 and y=3900\n    And I wait for the Set.Zone.Config.Ack message\n    And I wait 5 seconds for the firmware to apply the configuration\n    And I request the current motion zone configuration via QoS -> Camera.CheckIn\n    Then the firmware should have clamped x to 3840 and y to 2160\n    And no crashes or undefined behavior should occur\n\nKey Insight:\nValues between 3840 and 4000 pass API validation (API allows 0-4000) but exceed\nthe actual camera resolution (3840x2160). The firmware must gracefully clamp these\nvalues to the max resolution bounds instead of crashing.\n\nPASS condition:\nFirmware clamps x to <= 3840 and y to <= 2160", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone midrange out-of-bound X/Y clamping is acked and read back as expected.", "unknown": []}, {"key": "UNI-34975", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_overlapping_zones", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure Overlapping Zones", "desc": "Feature: Motion Zone Configuration - Overlapping Zones\nScenario: Configure zones that overlap\n    Given a camera is registered and online\n    When I configure Zone_1 at (0,0) with size 500x500\n    And I configure Zone_2 at (200,200) with size 500x500\n    And I configure Zone_3 at (400,400) with size 500x500\n    And I configure Zone_4 at (600,600) with size 500x500\n    Then all zones should coexist\n    And each zone should be positioned correctly", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone configuration of overlapping zones is acked and read back as expected.", "unknown": []}, {"key": "UNI-34980", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_wscale_hscale_below_min", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: WScale and HScale Below Minimum (-1)", "desc": "Feature: Motion Zone Configuration - Negative Scale Factor Validation\nScenario: Configure zone with negative wscale and hscale\n    Given a camera is registered and online\n    When I configure a zone with wscale=-1 and hscale=-1 (below minimum 0)\n    Then the system shall reject the configuration with HTTP 400\n    Or the firmware should clamp the values to minimum 0", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone wscale/hscale below minimum handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-34979", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_wscale_hscale_exceed_max", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: WScale and HScale Exceed Maximum (4001)", "desc": "Feature: Motion Zone Configuration - Scale Factor Validation\nScenario: Configure zone with wscale and hscale exceeding maximum\n    Given a camera is registered and online\n    When I configure a zone with wscale=4001 and hscale=4001 (both exceed max 4000)\n    Then the system shall reject the configuration with HTTP 400\n    Or the firmware should clamp the values to maximum 4000", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone wscale/hscale above maximum handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-34984", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zero_scale_factors", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zones with Zero Scale Factors (wscale=0, hscale=0)", "desc": "Feature: Motion Zone Configuration - Zero Scale Factors\nScenario: Configure zone with zero scale factors (wscale=0, hscale=0)\n    Given a camera is registered and online\n    When I configure a zone with wscale=0 and hscale=0 and width=500, height=500\n    Then the firmware normalises coordinates as uint16_t(value*scale)/kRealWidth\n    And with scale=0 the normalised width/height evaluates to 0\n    And this produces x1 >= x2 which the firmware rejects as invalid ROI coordinates\n    Then EITHER the API rejects with HTTP 400\n    Or the firmware silently rejects (zone not persisted)\n    And the system should not crash", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone zero scale factor handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-35653", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_exceeds_boundary[clamp-height]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure Zone Exceeding Camera Boundary (Clamping Expected) [clamp-height]", "desc": "Feature: Motion Zone Configuration - Boundary Exceeding Handling\n    Scenario: Configure zone that exceeds camera boundary\n        Given a camera supports resolution of 3840x2160\n        When I configure a zone with x=3500, y=0, width=1000, height=500 (x+width exceeds 3840)\n        Then the firmware should accept the configuration\n        And the firmware should clamp width to 3840\n        And the firmware should clamp height to 500\n        And no crashes or undefined behavior should occur\n\n\n    Scenario: Configure zone with x=0, y=3500, width=500, height=1000 (y+height exceeds 2160)\n        Then the firmware should accept the configuration\n        And the firmware should clamp width to 500\n        And the firmware should clamp height to 2160\n        And no crashes or undefined behavior should occur\n\n\nParameter ID: clamp-height\nParameter values: {\"desc\": \"y+height exceeds MAX_HEIGHT :--:  FW clamps height\", \"expected_height\": 2160, \"expected_width\": 500, \"height\": 1000, \"id\": \"clamp-height\", \"width\": 500, \"x\": 0, \"y\": 3500}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone boundary clamping for the parameterized dimension is acked and read back as expected.", "unknown": []}, {"key": "UNI-34978", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_exceeds_boundary[clamp-width]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Configure Zone Exceeding Camera Boundary (Clamping Expected) [clamp-width]", "desc": "Feature: Motion Zone Configuration - Boundary Exceeding Handling\n    Scenario: Configure zone that exceeds camera boundary\n        Given a camera supports resolution of 3840x2160\n        When I configure a zone with x=3500, y=0, width=1000, height=500 (x+width exceeds 3840)\n        Then the firmware should accept the configuration\n        And the firmware should clamp width to 3840\n        And the firmware should clamp height to 500\n        And no crashes or undefined behavior should occur\n\n\n    Scenario: Configure zone with x=0, y=3500, width=500, height=1000 (y+height exceeds 2160)\n        Then the firmware should accept the configuration\n        And the firmware should clamp width to 500\n        And the firmware should clamp height to 2160\n        And no crashes or undefined behavior should occur\n\n\nParameter ID: clamp-width\nParameter values: {\"desc\": \"x+width exceeds MAX_WIDTH :--: FW clamps width\", \"expected_height\": 500, \"expected_width\": 3840, \"height\": 500, \"id\": \"clamp-width\", \"width\": 1000, \"x\": 3500, \"y\": 0}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone boundary clamping for the parameterized dimension is acked and read back as expected.", "unknown": []}, {"key": "UNI-35654", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_sizes[max-size-4000x4000-expects-rejection]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zone Size Validation (min, max, standard, zero) [max-size-4000x4000-expects-rejection]", "desc": "Feature: Motion Zone Configuration - Zone Size Validation\n    Scenario: Configure zones with various sizes (min, max, standard, zero)\n        Given a camera is registered and online\n        When I configure a zone with width and height set to various values (1, 100, 4000, 0)\n        Then the firmware normalises coordinates as uint16_t(value*scale)/kRealWidth\n        And if the resulting x2 > 1.0 the firmware rejects the zone\n        And for accepted zones width/height round-trip within ±1 pixel of sent values\n        Note: width=4000 with wscale=1 gives 4000/3840 = 1.041… → x2 > 1.0 → rejected by firmware\n              width=0 and height=0 may be rejected or coerced to minimum size by firmware\n\n\nParameter ID: max-size-4000x4000-expects-rejection\nParameter values: {\"expect_rejection\": true, \"height\": 4000, \"width\": 4000}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone size validation for the parameterized width/height is acked and read back as expected.", "unknown": []}, {"key": "UNI-34976", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_sizes[min-size-1x1]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zone Size Validation (min, max, standard, zero) [min-size-1x1]", "desc": "Feature: Motion Zone Configuration - Zone Size Validation\n    Scenario: Configure zones with various sizes (min, max, standard, zero)\n        Given a camera is registered and online\n        When I configure a zone with width and height set to various values (1, 100, 4000, 0)\n        Then the firmware normalises coordinates as uint16_t(value*scale)/kRealWidth\n        And if the resulting x2 > 1.0 the firmware rejects the zone\n        And for accepted zones width/height round-trip within ±1 pixel of sent values\n        Note: width=4000 with wscale=1 gives 4000/3840 = 1.041… → x2 > 1.0 → rejected by firmware\n              width=0 and height=0 may be rejected or coerced to minimum size by firmware\n\n\nParameter ID: min-size-1x1\nParameter values: {\"expect_rejection\": false, \"height\": 1, \"width\": 1}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone size validation for the parameterized width/height is acked and read back as expected.", "unknown": []}, {"key": "UNI-35656", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_sizes[origin-0x0-indeterminate]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zone Size Validation (min, max, standard, zero) [origin-0x0-indeterminate]", "desc": "Feature: Motion Zone Configuration - Zone Size Validation\n    Scenario: Configure zones with various sizes (min, max, standard, zero)\n        Given a camera is registered and online\n        When I configure a zone with width and height set to various values (1, 100, 4000, 0)\n        Then the firmware normalises coordinates as uint16_t(value*scale)/kRealWidth\n        And if the resulting x2 > 1.0 the firmware rejects the zone\n        And for accepted zones width/height round-trip within ±1 pixel of sent values\n        Note: width=4000 with wscale=1 gives 4000/3840 = 1.041… → x2 > 1.0 → rejected by firmware\n              width=0 and height=0 may be rejected or coerced to minimum size by firmware\n\n\nParameter ID: origin-0x0-indeterminate\nParameter values: {\"expect_rejection\": true, \"height\": 0, \"width\": 0}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone size validation for the parameterized width/height is acked and read back as expected.", "unknown": []}, {"key": "UNI-35655", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_sizes[origin-100x100]", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zone Size Validation (min, max, standard, zero) [origin-100x100]", "desc": "Feature: Motion Zone Configuration - Zone Size Validation\n    Scenario: Configure zones with various sizes (min, max, standard, zero)\n        Given a camera is registered and online\n        When I configure a zone with width and height set to various values (1, 100, 4000, 0)\n        Then the firmware normalises coordinates as uint16_t(value*scale)/kRealWidth\n        And if the resulting x2 > 1.0 the firmware rejects the zone\n        And for accepted zones width/height round-trip within ±1 pixel of sent values\n        Note: width=4000 with wscale=1 gives 4000/3840 = 1.041… → x2 > 1.0 → rejected by firmware\n              width=0 and height=0 may be rejected or coerced to minimum size by firmware\n\n\nParameter ID: origin-100x100\nParameter values: {\"expect_rejection\": false, \"height\": 100, \"width\": 100}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone size validation for the parameterized width/height is acked and read back as expected.", "unknown": []}, {"key": "UNI-34982", "uid": "fenix-tests/cloud/test_motion_zone_edge_cases.py::TestMotionZoneEdgeCases::test_zone_zero_width_height", "file": "cloud/test_motion_zone_edge_cases.py", "title": "Motion Zone: Zone with Zero Width and Height", "desc": "Feature: Motion Zone Configuration - Zero Size Handling\nScenario: Configure zone with zero width and height (wscale=hscale=1)\n    Given a camera is registered and online\n    When I configure a zone with width=0 and height=0\n    Then the firmware minimum-size protection coerces 0 to max(1/kRealWidth, 0) = 1/3840\n    And the de-normalised round-trip returns width=1, height=1\n    Then EITHER the API rejects with HTTP 400\n    Or the firmware accepts it with width=1 and height=1 (minimum coercion)\n    And the system should not crash in either case", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts motion zone zero width/height handling is acked and read back as expected.", "unknown": []}, {"key": "UNI-35489", "uid": "fenix-tests/cloud/test_overlay_config.py::TestOverlayConfig::test_invalid_time_format_is_rejected", "file": "cloud/test_overlay_config.py", "title": "Invalid Overlay Time Format Is Rejected", "desc": "BDD Scenario: Invalid Overlay Time Format Is Rejected\n\nGIVEN a device is online with a known overlay configuration applied\nWHEN I send an overlay configuration with a time format outside the 12h/24h enum\nTHEN the request should be rejected by the cloud or by the camera (Nack or Ack with a non-zero error)\nAND cameraSettings.overlayConfig should still report the previous configuration", "cls": "automated", "labels": ["FWTC_Timestamp", "FWTC_CloudEvent"], "primary": "FWTC_Timestamp", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an out-of-enum time format (48h) is rejected and overlayConfig stays unchanged.", "unknown": []}, {"key": "UNI-35657", "uid": "fenix-tests/cloud/test_overlay_config.py::TestOverlayConfig::test_overlay_config_applied_and_read_back[time_12h_logo_on]", "file": "cloud/test_overlay_config.py", "title": "Overlay Configuration Is Applied And Reported Back [time_12h_logo_on]", "desc": "BDD Scenario: Overlay Configuration Is Applied And Reported Back\n\n    GIVEN a device is online and responsive\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    THEN a Set.Overlay.Config.Ack message should be received\n    AND GET camera/state should expose cameraSettings.overlayConfig\n    AND the reported overlay configuration should match the configuration I sent\n\n\nParameter ID: time_12h_logo_on\nParameter values: {\"case_name\": \"time_12h_logo_on\", \"logo_enabled\": true, \"time_enabled\": true, \"time_format\": \"12h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_CloudEvent", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": [" on should match the configuration I sent\n\n\nParameter ID: time_24h_logo_on\nParameter values: {\"case_name\": \"time_24h_logo_on\", \"logo_enabled\": true, \"time_enabled\": true, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_CloudEvent", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the overlay config is acked and camera state reports the sent logo and time enabled/format values.", "unknown": []}, {"key": "UNI-35660", "uid": "fenix-tests/cloud/test_overlay_config.py::TestOverlayConfig::test_overlay_config_applied_and_read_back[time_off_logo_off]", "file": "cloud/test_overlay_config.py", "title": "Overlay Configuration Is Applied And Reported Back [time_off_logo_off]", "desc": "BDD Scenario: Overlay Configuration Is Applied And Reported Back\n\n    GIVEN a device is online and responsive\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    THEN a Set.Overlay.Config.Ack message should be received\n    AND GET camera/state should expose cameraSettings.overlayConfig\n    AND the reported overlay configuration should match the configuration I sent\n\n\nParameter ID: time_off_logo_off\nParameter values: {\"case_name\": \"time_off_logo_off\", \"logo_enabled\": false, \"time_enabled\": false, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_CloudEvent", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the overlay config is acked and camera state reports the sent logo and time enabled/format values.", "unknown": []}, {"key": "UNI-35658", "uid": "fenix-tests/cloud/test_overlay_config.py::TestOverlayConfig::test_overlay_config_applied_and_read_back[time_off_logo_on]", "file": "cloud/test_overlay_config.py", "title": "Overlay Configuration Is Applied And Reported Back [time_off_logo_on]", "desc": "BDD Scenario: Overlay Configuration Is Applied And Reported Back\n\n    GIVEN a device is online and responsive\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    THEN a Set.Overlay.Config.Ack message should be received\n    AND GET camera/state should expose cameraSettings.overlayConfig\n    AND the reported overlay configuration should match the configuration I sent\n\n\nParameter ID: time_off_logo_on\nParameter values: {\"case_name\": \"time_off_logo_on\", \"logo_enabled\": true, \"time_enabled\": false, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_CloudEvent", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the overlay config is acked and camera state reports the sent logo and time enabled/format values.", "unknown": []}, {"key": "UNI-35856", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_anticlockwise_point_order_rendered", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Anticlockwise point order is rendered", "desc": "Feature: Privacy zone rendering\nScenario: Polygon points listed anticlockwise\n    Given one convex zone whose points are listed anticlockwise\n    When I send it with a mask colour\n    Then the ack reports error 0\n    And one mask is rendered at the zone's bounding box", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the cloud-set privacy zone config is acked and the mask(s) for an anticlockwise polygon render on live frames.", "unknown": []}, {"key": "UNI-35867", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_clip_is_masked", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Cloud clip is masked", "desc": "Feature: Privacy zones in recorded media\nScenario: Record a manual clip while two zones are configured\n    Given two zones are rendered on the live stream\n    When I start a 10-second manual clip through the Unicorn API\n    And the MediaUpload.Event for the clip arrives\n    Then every sampled frame of the downloaded clip shows both masks at the expected positions", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_OnDemandClip"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts every sampled frame of a manual cloud clip shows both masks.", "unknown": []}, {"key": "UNI-35852", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_color_mask_change_rerenders_zones", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Changing the colour mask re-renders zones in the new colour", "desc": "Feature: Privacy zone rendering\nScenario: Change colorMask for an existing set of zones\n    Given two zones are rendered in colour A\n    When I resend the same zones with colour B\n    Then the ack reports error 0\n    And both masks are rendered in colour B\n    And no mask in colour A remains on two consecutive frames", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts resending zones with a new colorMask re-renders them in the new colour only.", "unknown": []}, {"key": "UNI-35851", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_concave_polygon_rendered", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Concave polygon is rendered", "desc": "Feature: Privacy zone rendering\nScenario: Concave polygon zone\n    Given a six-point concave (L-shaped) zone outside the OSD band\n    When I send it with a mask colour\n    Then the ack reports error 0\n    And one mask matching the zone's bounding box is rendered", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the cloud-set privacy zone config is acked and the mask(s) for a concave L-shaped zone render on live frames.", "unknown": []}, {"key": "UNI-35860", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_duplicate_points_rejected", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Polygon with duplicate points is rejected", "desc": "Feature: Privacy zone validation\nScenario: Send a polygon containing a repeated point\n    Given a valid baseline zone is rendered\n    When I send a zone with two identical consecutive points in another colour\n    Then the request is rejected\n    And the baseline zone is still rendered in its colour\n\nExpected failure: fw 1.10.1 accepts the duplicate-point polygon (ack error 0). Dev confirmed this is by design\nbecause the app does not let users create such zones, so the case is kept as a non-strict xfail.", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a zone with duplicate points is rejected and the baseline mask stays (non-strict xfail: accepted by design).", "unknown": []}, {"key": "UNI-35855", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_empty_zone_list_clears_masks", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Empty zone list clears all masks", "desc": "Feature: Privacy zone rendering\nScenario: Clear zones with an empty list\n    Given two zones are rendered\n    When I send privacyZones: [] without colorMask\n    Then the ack reports error 0\n    And no mask is rendered on two consecutive frames", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts an empty privacyZones list is acked and clears all rendered masks.", "unknown": []}, {"key": "UNI-35854", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_full_screen_mask_persists_after_reboot", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Full-screen mask persists after reboot", "desc": "Feature: Privacy zone persistence\nScenario: Full-screen zone survives a reboot\n    Given a zone covering the whole frame (0,0)-(1,1)\n    When I send it with a mask colour\n    Then one mask covering at least 90% of the frame is rendered\n    When the camera is rebooted through the Unicorn API\n    Then the full-screen mask is rendered again", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_Reboot", "FWTC_SettingsRetain"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a full-screen mask covers at least 90% of the frame before and after a cloud reboot.", "unknown": []}, {"key": "UNI-35853", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_masks_redrawn_after_rotate_180", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Masks stay at the configured position after rotating video 180 degrees", "desc": "Feature: Privacy zone rendering\nScenario: Rotate the video 180 degrees with a zone configured\n    Given an asymmetric zone in the left half of the image is rendered\n    When I toggle video rotation by 180 degrees through the cloud video configuration\n    Then the camera state reports the new rotation\n    And the mask is still rendered at the configured normalized position in the output image\n    And the scene is rotated (supporting evidence, skipped for low-texture scenes)\n    And the original rotation is restored afterwards", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_RotateVideo"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the mask stays at its configured position after a 180-degree rotation via legacy video config.", "unknown": []}, {"key": "UNI-35896", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_masks_remain_after_privacy_mode_toggle", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Masks remain after turning privacy mode on and off", "desc": "Feature: Privacy zones and privacy mode\nScenario: Toggle privacy mode with privacy zones configured\n    Given two zones are rendered on the live stream\n    When I turn privacy mode on and wait for Set.PrivacyMode.Config.Ack\n    And I turn privacy mode off and wait for Set.PrivacyMode.Config.Ack\n    Then both masks are rendered again on the resumed live stream\n    And every sampled frame of a newly recorded cloud clip shows both masks\n\nKnown issue UNI-35895 (fw 1.10.1): the existing masks disappear after privacy mode is turned off.", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_OnDemandClip", "FWTC_PrivacyMode"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts masks reappear on live video and in a new on-demand clip after privacy mode is turned on and off.", "unknown": []}, {"key": "UNI-35897", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_masks_stay_after_advanced_video_rotate_180", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Masks stay at the configured position after rotating 180 degrees via advanced video config", "desc": "Feature: Privacy zone rendering\nScenario: Rotate the video 180 degrees through Set.AdvancedVideo.Config with a zone configured\n    Given advanced video rotate is false\n    And an asymmetric zone in the left half of the image is rendered\n    When I set rotate=true through the advanced video configuration, keeping the rest of the current profile\n    Then the camera state reports advancedVideoConfig.rotate=true\n    And the mask is still rendered at the configured normalized position, as with the legacy rotation\n    And the scene is rotated (supporting evidence, skipped for low-texture scenes)\n    And the original advanced video configuration is restored afterwards\n\nKnown issue UNI-35894 (fw 1.10.1): the mask is mirrored vertically (y -> 1 - y) instead of staying in place.", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_RotateVideo"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the mask stays at its configured position after rotate=true via advanced video config.", "unknown": []}, {"key": "UNI-35862", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_missing_color_mask_rejected", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zones without colorMask are rejected", "desc": "Feature: Privacy zone validation\nScenario: Send non-empty zones without colorMask\n    Given a valid baseline zone is rendered\n    When I send a zone without the colorMask field\n    Then the request is rejected\n    And the baseline zone is still rendered in its colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts zones without colorMask are rejected and the baseline mask stays rendered.", "unknown": []}, {"key": "UNI-35847", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_mixed_shape_zones_enabled_one_by_one", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Mixed-shape zones enabled one by one up to the cloud limit of two are rendered", "desc": "Feature: Privacy zone rendering\nScenario: Enable zones of different shapes cumulatively up to the cloud limit of two\n    Given two non-overlapping zones with 5 and 8 vertices outside the OSD band\n    When I send the first N zones (N = 1..2) with one mask colour\n    Then every Set.PrivacyZones.Config.Ack reports error 0\n    And exactly N masks are rendered at the expected positions after each step", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the cloud-set privacy zone config is acked and the mask(s) render cumulatively (1 then 2 zones) on live frames.", "unknown": []}, {"key": "UNI-35865", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_mixed_valid_and_invalid_zones_rejected_atomically", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Mixed valid and invalid zones are rejected atomically", "desc": "Feature: Privacy zone validation\nScenario: One invalid zone in a request with a valid zone\n    Given a valid baseline zone is rendered in colour A\n    When I send a new valid zone plus a decagon zone in colour B\n    Then the request is rejected\n    And only the baseline zone is rendered in colour A\n    And the new valid zone is not rendered in colour B on two consecutive frames", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a request mixing a valid and an invalid zone is rejected atomically, keeping only the baseline mask.", "unknown": []}, {"key": "UNI-35861", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_more_than_eight_points_rejected", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: More than eight points are rejected", "desc": "Feature: Privacy zone validation\nScenario: Send a ten-point polygon\n    Given a valid baseline zone is rendered\n    When I send a decagon zone in another colour\n    Then the request is rejected\n    And the baseline zone is still rendered in its colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a ten-point zone is rejected and the baseline mask stays rendered.", "unknown": []}, {"key": "UNI-35859", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_more_than_two_zones_rejected_by_cloud", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: More than two zones are rejected by the cloud", "desc": "Feature: Privacy zone validation\nScenario: Send three zones through the cloud API\n    Given a valid baseline zone is rendered\n    When I send three valid zones in another colour\n    Then the Unicorn API answers HTTP 400 \"A maximum of 2 privacy zones are allowed for this device type.\"\n    And the baseline zone is still rendered in its colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts three zones are rejected by the cloud API and the baseline mask stays rendered.", "unknown": []}, {"key": "UNI-35850", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_non_standard_point_order_rendered", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Non-standard point order is rendered", "desc": "Feature: Privacy zone rendering\nScenario: Polygon points start from a non-top-left vertex\n    Given a convex pentagon whose points start from its bottom vertex\n    When I send it with a mask colour\n    Then the ack reports error 0\n    And one mask is rendered at the pentagon's bounding box", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the cloud-set privacy zone config is acked and the mask(s) for a pentagon listed from its bottom vertex render on live frames.", "unknown": []}, {"key": "UNI-35863", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_out_of_range_coordinates_rejected", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Out-of-range coordinates are rejected", "desc": "Feature: Privacy zone validation\nScenario: Send a point with x = 1.2\n    Given a valid baseline zone is rendered\n    When I send a zone with a coordinate outside 0..1 in another colour\n    Then the request is rejected\n    And the baseline zone is still rendered in its colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a zone with a coordinate outside 0..1 is rejected and the baseline mask stays rendered.", "unknown": []}, {"key": "UNI-35866", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_self_intersecting_polygon_rejected", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Self-intersecting polygon is rejected", "desc": "Feature: Privacy zone validation\nScenario: Send a self-intersecting (bowtie) polygon\n    Given a valid baseline zone is rendered\n    When I send a bowtie zone in another colour\n    Then the request is rejected\n    And the baseline zone is still rendered in its colour\n\nExpected failure: fw 1.10.1 accepts the bowtie (ack error 0). Dev confirmed this is by design because the app\ndoes not let users draw self-intersecting zones, so the case is kept as a non-strict xfail.", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a bowtie zone is rejected and the baseline mask stays (non-strict xfail: accepted by design).", "unknown": []}, {"key": "UNI-35869", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_snapshot_is_masked", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Cloud snapshot is masked", "desc": "Feature: Privacy zones in recorded media\nScenario: Take a snapshot while two zones are configured\n    Given two zones are rendered on the live stream\n    When I request a snapshot through the Unicorn API\n    And the MediaUpload.Event for the snapshot arrives\n    Then the downloaded snapshot shows both masks at the expected positions", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_Snapshot"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a cloud snapshot downloaded after applying two zones shows both masks.", "unknown": []}, {"key": "UNI-35864", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_three_point_zone_rendered", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Three-point zone is rendered", "desc": "Feature: Privacy zone shapes\nScenario: Send a triangle zone (three points is the product minimum)\n    Given no privacy zones are configured\n    When I send a three-point zone with a mask colour\n    Then the device ack reports error 0\n    And one mask is rendered at the triangle's position", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the cloud-set privacy zone config is acked and the mask(s) for a three-point zone render on live frames.", "unknown": []}, {"key": "UNI-35849", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_two_eight_point_zones_rendered", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Two zones with eight points each are rendered and reported", "desc": "Feature: Privacy zone rendering\nScenario: Configure the product maximum of two 8-point zones\n    Given two non-overlapping convex zones with 8 vertices each outside the OSD band\n    When I send both zones with one mask colour\n    Then the ack reports error 0\n    And both masks are rendered completely at the expected positions\n    And Camera.CheckIn privacyZonesConfig reports both zones and the colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts two 8-point zones render and Camera.CheckIn privacyZonesConfig reports both zones and the colour.", "unknown": []}, {"key": "UNI-35848", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_zone_level_enable_disable_two_zones", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zone-level enable/disable controls which of two zones render", "desc": "Feature: Privacy zone rendering\nScenario: Disable one of two configured zones\n    Given two enabled zones are rendered\n    When I resend them with one randomly chosen zone set to enabled=false\n    Then the ack reports error 0\n    And exactly the other zone is rendered", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a zone with enabled=false is not rendered while the other zone stays rendered.", "unknown": []}, {"key": "UNI-35858", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_zones_persist_after_reboot", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zones persist after a soft reboot", "desc": "Feature: Privacy zone persistence\nScenario: Reboot the camera through the cloud with a zone configured\n    Given one zone is rendered\n    When the camera is rebooted through the Unicorn API\n    And the TimeZone event confirms it is back online\n    Then the zone is rendered again at the same position\n    And Camera.CheckIn privacyZonesConfig reports the sent zone and colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CheckIn", "FWTC_CloudEvent", "FWTC_Reboot", "FWTC_SettingsRetain"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a zone is re-rendered after a cloud soft reboot and CheckIn privacyZonesConfig still reports it.", "unknown": []}, {"key": "UNI-35857", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_zones_persist_after_ssh_reboot", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zones persist after an SSH reboot", "desc": "Feature: Privacy zone persistence\nScenario: Reboot the camera from its own shell with a zone configured\n    Given one zone is rendered\n    When the camera is rebooted with the \"reboot\" command over SSH\n    And the TimeZone event confirms it is back online\n    Then the zone is rendered again at the same position\n    And Camera.CheckIn privacyZonesConfig reports the sent zone and colour", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CheckIn", "FWTC_CloudEvent", "FWTC_Reboot", "FWTC_SettingsRetain"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts a zone is re-rendered after an SSH reboot and CheckIn privacyZonesConfig still reports it.", "unknown": []}, {"key": "UNI-35868", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_zones_rendered_on_webrtc_stream[main]", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zones are rendered on the {stream_id} WebRTC stream [main]", "desc": "Feature: Privacy zone rendering per stream\n    Scenario: Two zones on the selected stream\n        Given two zones are configured with a mask colour\n        When I view the selected WebRTC stream (main or sub)\n        Then both masks are rendered at the expected normalized positions for that stream's resolution\n        And the sub stream frame is narrower than the main stream frame (sub only)\n\n\nParameter ID: main\nParameter values: {\"stream_id\": \"main\"}", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_WebRTC"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts two masks render at the expected normalized positions on the main WebRTC stream.", "unknown": []}, {"key": "UNI-35872", "uid": "fenix-tests/cloud/test_privacy_zones.py::TestPrivacyZones::test_zones_rendered_on_webrtc_stream[sub]", "file": "cloud/test_privacy_zones.py", "title": "Privacy Zones: Zones are rendered on the {stream_id} WebRTC stream [sub]", "desc": "Feature: Privacy zone rendering per stream\n    Scenario: Two zones on the selected stream\n        Given two zones are configured with a mask colour\n        When I view the selected WebRTC stream (main or sub)\n        Then both masks are rendered at the expected normalized positions for that stream's resolution\n        And the sub stream frame is narrower than the main stream frame (sub only)\n\n\nParameter ID: sub\nParameter values: {\"stream_id\": \"sub\"}", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_CloudEvent", "FWTC_WebRTC"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts two masks render at the expected normalized positions on the sub WebRTC stream and the sub frame is narrower than main.", "unknown": []}, {"key": "UNI-35332", "uid": "fenix-tests/cloud/test_recording_schedule_kvs_verification.py::TestRecordingScheduleKVSVerification::test_multi_schedule_run_verified_via_get_available_clips", "file": "cloud/test_recording_schedule_kvs_verification.py", "title": "Recording Schedule KVS: Overlap Resolution Verified via Available Clips", "desc": "Feature: Recording Schedule KVS Verification\nScenario: Three overlapping schedules produce phase-specific winners\n    Given the camera's local clock is read via SSH\n    And a baseline OFF cover at priority 10 for the entire 15-min test window\n    And schedule A (continuous=false, priority=50, list[0]) over minutes T+3..T+6\n    And schedule B (continuous=true, priority=50, list[1]) over minutes T+3..T+12\n    And schedule C (continuous=false, priority=80, list[2]) over minutes T+9..T+12\n    When I publish all schedules in one cloud REST PUT\n    And wait for the test window to elapse, then clear overrides and let KVS catch up\n    And start a WebRTC viewer session and query available clips over the whole window\n    Then phase T+3..T+6 (A and B overlap) has no clip (tie-break: list[0]=A_OFF wins)\n    And phase T+6..T+9 (B alone) has a clip (B_ON records)\n    And phase T+9..T+12 (B and C overlap) has no clip (priority=80 C_OFF wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts overlapping schedules resolve by tie-break/priority, verified by recorded-clip coverage per phase.", "unknown": []}, {"key": "UNI-34875", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_cancel_nonexistent_export_fails", "file": "cloud/test_sd_card_export.py", "title": "Reject cancel request when no export in progress", "desc": "BDD Scenario: Attempt to cancel when no export is in progress\n\nGIVEN a device has no export in progress\nWHEN I request to cancel an export\nTHEN the request should fail with HTTP 404 Not Found", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a cancel request with no export in progress is rejected.", "unknown": []}, {"key": "UNI-34874", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_cancel_ongoing_export_success", "file": "cloud/test_sd_card_export.py", "title": "Successfully cancel ongoing export", "desc": "BDD Scenario: Successfully cancel ongoing export\n\nGIVEN a device has an export in progress\nAND the export has been acknowledged (ClipCapture.Start.Ack received)\nAND the export is confirmed still active (not cancelled within 5 seconds of ACK)\nWHEN I request to cancel the export\nTHEN the cancellation should succeed\nAND the export should be stopped (verified by ClipCapture.Cancel.Ack)\n\nEarly Cancellation Guard:\n- After receiving ClipCapture.Start.Ack, Elasticsearch is polled for 5 seconds\n- If the export is already cancelled (isCanceled=true) before the cancel request\n  is sent, the test is marked as xfail — the cancellation flow cannot be validated\n  against an already-cancelled export", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an in-progress export can be cancelled.", "unknown": []}, {"key": "UNI-34869", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_concurrent_export_prevented", "file": "cloud/test_sd_card_export.py", "title": "Prevent concurrent exports on same device", "desc": "BDD Scenario: Prevent concurrent exports on same device\n\nGIVEN a device has an export already in progress\nAND the first export has been acknowledged (ClipCapture.Start.Ack received)\nAND the first export is confirmed still active (not cancelled within 5 seconds of ACK)\nWHEN I attempt to initiate another export on the same device\nTHEN the request should fail with HTTP 409 Conflict\nAND the error message should indicate an export is already in progress\n\nEarly Cancellation Guard:\n- After receiving ClipCapture.Start.Ack, Elasticsearch is polled for 5 seconds\n- If the first export is already cancelled (isCanceled=true) before the second\n  request is sent, the test is marked as xfail — concurrent prevention cannot\n  be validated against a non-active export", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a second concurrent export on the same device is prevented.", "unknown": []}, {"key": "UNI-34868", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_export_duration_above_maximum_fails", "file": "cloud/test_sd_card_export.py", "title": "Reject export with duration > 1800 seconds (30 minutes)", "desc": "BDD Scenario: Reject export with duration above maximum (> 1800 seconds)\n\nGIVEN a device with SD card storage is online\nWHEN I request to export a clip with duration greater than 1800 seconds (30 minutes)\nTHEN the request should fail with HTTP 400 Bad Request\n d\n\nGIVEN a device with SD card storage is online\nWHEN I request to export a 30-second clip from a specific start time\nTHEN the export should be initiated successfully\nAND the response should contain a valid mediaId\nAND the export should complete within the expected timeframe\nAND the clip should be available for download", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a 30 s SD export completes and the downloaded clip has valid video properties.", "unknown": []}, {"key": "UNI-34866", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_export_start_time_too_far_future_fails", "file": "cloud/test_sd_card_export.py", "title": "Verify export cancellation for start time from 1 year in the future", "desc": "BDD Scenario: Reject export with start time too far in the future\n\nGIVEN a device with SD card storage is online\nWHEN I request to export a clip with start time from 1 year in the future\nTHEN the export should be initiated but quickly cancelled\nAND ClipCapture.Start.Ack should contain the clipId\nAND UpdateClipExportStatusRequestReceived should show isCanceled=true for that clipId", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an export with a start time one year in the future is cancelled.", "unknown": []}, {"key": "UNI-34865", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_export_start_time_too_old_fails", "file": "cloud/test_sd_card_export.py", "title": "Reject export from 1 year ago when no SD clips exist", "desc": "BDD Scenario: Reject export with start time too far in the past\n\nGIVEN a device with SD card storage is online\nWHEN I request to export a clip with start time from 1 year ago\nTHEN the export should be initiated but end because no clips ex
