, "FWTC_SDCard_Recording"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD removal ends the active export, recording resumes after reinsertion, and a new export succeeds.", "unknown": []}, {"key": "UNI-34873", "uid": "fenix-tests/cloud/test_sd_card_export.py::TestSDCardExport::test_export_with_various_client_identifiers", "file": "cloud/test_sd_card_export.py", "title": "Validate client identifier in export request", "desc": "BDD Scenario: Validate client identifier requirement\n\nGIVEN a device with SD card storage is online\nWHEN I request export without specifying client identifier\nOR with invalid client identifier\nTHEN the system should handle it appropriately (use default or reject)", "cls": "automated", "labels": ["FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_ClipExport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts export requests validate the client identifier.", "unknown": []}, {"key": "UNI-34496", "uid": "fenix-tests/cloud/test_startup_event.py::TestStartupEventScenarios::test_hard_reboot_startup_events", "file": "cloud/test_startup_event.py", "title": "Hard Reboot: Startup Events Validation", "desc": "Feature: Device Startup Events\nScenario: Validate startup sequence after hard reboot (physical power cycle)\n    Given the device is powered on and operational\n    And standard startup events list is defined\n    When I physically power cycle the device (manual hard reboot)\n    And I begin monitoring event flow timestamped from power restoration\n    Then all standard startup events appear within 10 minutes\n    And no expected event is missing at end of monitoring\n    And event ordering is not enforced, only presence\n    But the PowerOnReset event may be absent (known intermittent issue)\n    And manual action instructions are attached", "cls": "semi-automated", "labels": ["FWTC_Reboot", "FWTC_CheckIn"], "primary": "FWTC_Reboot", "other": const JIRA = "https://resideo.atlassian.net/browse/";
const UNTAGGED = "__untagged__";
const state = { sel: new Set(), mode: "any", q: "", cls: "all", primaryOnly: false };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labelById = Object.fromEntries(DATA.labels.map(l => [l.id, l]));
const counts = {}, primaryCounts = {};
DATA.tests.forEach(t => {
  t.labels.forEach(l => counts[l] = (counts[l] || 0) + 1);
  if (t.primary) primaryCounts[t.primary] = (primaryCounts[t.primary] || 0) + 1;
});
const untagged = DATA.tests.filter(t => !t.labels.length);
const groups = [...new Set(DATA.labels.map(l => l.group))];
const covered = DATA.labels.filter(l => counts[l.id]).length;
const byCls = c => DATA.tests.filter(t => t.cls === c).length;

function renderHeader() {
  document.getElementById("sub").textContent =
    `${DATA.tests.length} Jira Tests from nzqa-fenix-ats (cloud + camera_system). Labels read live from Jira on ${DATA.generated}. Reference: FWTC feature list as of 2026-10-01.`;
  const s = [
    ["Jira Tests", DATA.tests.length, () => select([])],
    ["Labels covered", `${covered} / ${DATA.labels.length}`, () => { select([]); }],
    ["Labels with no test", DATA.labels.length - covered, () => { select([]); setTimeout(() => document.getElementById("gaps")?.scrollIntoView({behavior: "smooth"}), 0); }],
    ["Tests without a label", untagged.length, () => select([UNTAGGED])],
    ["Automated", byCls("automated"), null],
    ["Semi-automated", byCls("semi-automated"), null],
    ["Manual", byCls("manual"), null],
  ];
  const el = document.getElementById("stats");
  el.innerHTML = s.map(([n, v, f], i) => `<div class="stat ${f ? "click" : ""}" data-i="${i}"><b>${v}</b><span>${n}</span></div>`).join("");
  el.querySelectorAll(".stat.click").forEach(d => d.onclick = s[d.dataset.i][2]);
}

function renderSidebar() {
  const q = document.getElementById("labSearch").value.toLowerCase();
  const hideZero = document.getElementById("hideZero").checked;
  let html = `<div class="group"><div class="lab ${state.sel.has(UNTAGGED) ? "on" : ""}" data-id="${UNTAGGED}">
      <div class="nm">No FWTC label<small>Tests no label fits</small></div><span class="cnt">${untagged.length}</span></div></div>`;
  for (const g of groups) {
    const labs = DATA.labels.filter(l => l.group === g)
      .filter(l => !q || (l.id + " " + l.name + " " + l.sub).toLowerCase().includes(q))
      .filter(l => !hideZero || counts[l.id]);
    if (!labs.length) continue;
    const total = labs.reduce((a, l) => a + (counts[l.id] ? 1 : 0), 0);
    html += `<div class="group"><h4><span>${esc(g)}</span><span>${total}/${labs.length}</span></h4>`;
    for (const l of labs) {
      const n = counts[l.id] || 0;
      html += `<div class="lab ${state.sel.has(l.id) ? "on" : ""} ${n ? "" : "zero"}" data-id="${l.id}" title="${esc(l.sub)}">
        <div class="nm">${esc(l.id.replace("FWTC_", ""))}<small>${esc(l.name)}</small></div><span class="cnt">${n}</span></div>`;
    }
    html += `</div>`;
  }
  const el = document.getElementById("labels");
  el.innerHTML = html;
  el.querySelectorAll(".lab").forEach(d => d.onclick = e => toggle(d.dataset.id, e.ctrlKey || e.metaKey || e.shiftKey));
}

function toggle(id, additive) {
  if (additive || state.sel.size > 1) {
    state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id);
  } else {
    state.sel = state.sel.has(id) && state.sel.size === 1 ? new Set() : new Set([id]);
  }
  update();
}
function select(ids) { state.sel = new Set(ids); update(); }

function matches(t) {
  if (state.cls !== "all" && t.cls !== state.cls) return false;
  if (state.q) {
    const hay = (t.key + " " + t.title + " " + t.file + " " + t.labels.join(" ") + " " + t.why).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  if (!state.sel.size) return true;
  const sel = [...state.sel];
  const has = id => id === UNTAGGED ? !t.labels.length : (state.primaryOnly ? t.primary === id : t.labels.includes(id));
  return state.mode === "all" ? sel.every(has) : sel.some(has);
}

function toolbar(n) {
  const clsBtns = ["all", "automated", "semi-automated", "manual"].map(c =>
    `<button data-v="${c}" class="${state.cls === c ? "on" : ""}">${c === "all" ? "All" : c}</button>`).join("");
  const selChips = [...state.sel].map(id =>
    `<span class="chip primary x" data-rm="${id}">${esc(id === UNTAGGED ? "No FWTC label" : id)}</span>`).join(" ");
  return `<div class="toolbar">
      <input type="search" id="q" placeholder="Search Jira key, title, file..." value="${esc(state.q)}">
      <span class="seg" id="cls">${clsBtns}</span>
      <label class="row"><input type="checkbox" id="prim" ${state.primaryOnly ? "checked" : ""}> Primary label only</label>
      ${state.sel.size ? `<button class="linkbtn" id="clear">Clear selection</button>` : ""}
      ${state.sel.size ? `<a class="linkbtn" target="_blank" href="${jql()}">Open in Jira</a>` : ""}
    </div>
    ${selChips ? `<div class="row" style="margin-bottom:10px">Selected: ${selChips} <span class="count-line">- ${n} test(s), match ${state.mode.toUpperCase()}</span></div>` : ""}`;
}

function jql() {
  const ids = [...state.sel].filter(i => i !== UNTAGGED);
  const keys = DATA.tests.filter(matches).map(t => t.key);
  const q = keys.length && keys.length <= 150 ? `key in (${keys.join(",")}) ORDER BY key` :
    `labels ${state.mode === "all" ? "= " + ids.join(" AND labels = ") : "in (" + ids.join(",") + ")"}`;
  return "https://resideo.atlassian.net/issues/?jql=" + encodeURIComponent(q);
}

function labelHeader() {
  if (state.sel.size !== 1) return "";
  const id = [...state.sel][0];
  if (id === UNTAGGED) return `<h2>Tests without an FWTC label</h2><div class="hint">No feature in the FWTC list matched what these tests assert (for example registration flows, schema-only checks, transport-stream structure). Decide: leave unlabelled, or propose a new label.</div>`;
  const l = labelById[id];
  return `<h2>${esc(l.id)} <span style="font-weight:400;color:var(--muted)">- ${esc(l.name)}</span></h2>
    <div class="hint">${esc(l.group)}${l.sub ? " | " + esc(l.sub) : ""} | ${counts[id] || 0} test(s), ${primaryCounts[id] || 0} as primary label</div>`;
}

function card(t) {
  const chips = t.labels.map(l => `<span class="chip ${l === t.primary ? "primary" : ""} ${state.sel.has(l) ? "sel" : ""}" data-lab="${l}" title="${l === t.primary ? "Primary label" : "Click to filter"}">${esc(l.replace("FWTC_", ""))}</span>`).join("");
  return `<div class="card">
    <div class="top"><a class="key" target="_blank" href="${JIRA}${t.key}">${t.key}</a>
      <span class="title">${esc(t.title)}</span><span class="pill ${t.cls}">${t.cls}</span></div>
    <div class="meta">${esc(t.uid)}</div>
    <div class="chips">${chips || '<span class="count-line">No FWTC label</span>'}</div>
    ${t.why ? `<div class="why"><b>Why:</b> ${esc(t.why)}</div>` : ""}
    ${t.desc ? `<details><summary>Allure description (BDD)</summary><pre>${esc(t.desc)}</pre></details>` : ""}
  </div>`;
}

function overview() {
  const gaps = DATA.labels.filter(l => !counts[l.id]);
  let html = `<div class="points">
    <h2 style="margin-top:12px">How to read this page</h2>
    <ol>
      <li>Click a label on the left (or a tile below) to list its Jira Tests. Ctrl/Shift-click selects several labels; switch <b>Any / All</b> to see overlap.</li>
      <li>The dark chip on each test is its <b>primary</b> feature; other chips are secondary features the test also asserts. Click a chip to jump to that label.</li>
      <li>Rule used: a label is added only when the test <b>asserts</b> that feature, not when it is just used to observe a result (for example WebRTC only used to grab a frame). Max 4 labels per test.</li>
      <li>Edits happen directly in Jira. Re-run the generator to refresh this page from Jira.</li>
    </ol>
    <h2>Discussion points</h2>
    <ol>
      <li><b>Coverage gaps:</b> ${gaps.length} of ${DATA.labels.length} labels have no Fenix ATS test. Which are out of scope for Fenix (hardware/app features) vs real backlog? <a data-go="gaps">See gaps</a></li>
      <li><b>Untagged tests (${untagged.length}):</b> registration, schema-only and stream-structure checks. Leave unlabelled, use FWTC_CheckIn, or ask for a new label? <a data-sel="${UNTAGGED}">Show</a></li>
      <li><b>ACK and schema tests:</b> they only verify the message, not the feature behaviour. Keep the feature label or remove it? <a data-q="ack">Show ACK tests</a></li>
      <li><b>Evidence-channel labels:</b> WebRTC / Snapshot are not added when only used to observe another feature. Agree? <a data-sel="FWTC_WebRTC">WebRTC</a> | <a data-sel="FWTC_Snapshot">Snapshot</a></li>
      <li><b>Reboot vs SettingsRetain:</b> persistence tests get both. <a data-all="FWTC_Reboot,FWTC_SettingsRetain">Show overlap</a></li>
      <li><b>Ownership:</b> who reviews which feature group, and by when?</li>
    </ol>
  </div>
  <div class="legend"><span><span class="sw" style="background:#fff;border:1px solid var(--line)"></span>covered (number = tests)</span>
    <span><span class="sw" style="background:#fdf3f2;border:1px solid #f3d3cf"></span>no test yet</span></div>`;
  for (const g of groups) {
    const labs = DATA.labels.filter(l => l.group === g);
    html += `<div class="grid-group"><h3>${esc(g)}</h3><div class="tiles">` + labs.map(l =>
      `<div class="tile ${counts[l.id] ? "" : "zero"}" data-id="${l.id}"><span class="n">${counts[l.id] || 0}</span><b>${esc(l.id.replace("FWTC_", ""))}</b><small>${esc(l.name)}</small></div>`).join("") + `</div></div>`;
  }
  html += `<div class="grid-group" id="gaps"><h3>Labels with no test (${gaps.length})</h3><div class="chips" style="display:flex;flex-wrap:wrap;gap:6px">` +
    gaps.map(l => `<span class="chip" style="background:#fdf3f2;color:var(--gap);border-color:#f3d3cf;cursor:default" title="${esc(l.group)}">${esc(l.id)} - ${esc(l.name)}</span>`).join("") + `</div></div>`;
  return html;
}

function renderMain() {
  const main = document.getElementById("main");
  const list = DATA.tests.filter(matches);
  const showOverview = !state.sel.size && !state.q && state.cls === "all";
  main.innerHTML = toolbar(list.length) + (showOverview ? overview() :
    labelHeader() + `<div class="count-line" style="margin-bottom:10px">${list.length} test(s)</div>` +
    (list.length ? list.map(card).join("") : `<div class="empty">No tests match.</div>`));

  const q = document.getElementById("q");
  q.oninput = () => { state.q = q.value.toLowerCase().trim(); renderMainKeepFocus(); };
  main.querySelectorAll("#cls button").forEach(b => b.onclick = () => { state.cls = b.dataset.v; update(); });
  document.getElementById("prim").onchange = e => { state.primaryOnly = e.target.checked; update(); };
  document.getElementById("clear")?.addEventListener("click", () => select([]));
  main.querySelectorAll("[data-rm]").forEach(c => c.onclick = () => { state.sel.delete(c.dataset.rm); update(); });
  main.querySelectorAll("[data-lab]").forEach(c => c.onclick = e => toggle(c.dataset.lab, e.ctrlKey || e.metaKey || e.shiftKey));
  main.querySelectorAll(".tile").forEach(c => c.onclick = () => select([c.dataset.id]));
  main.querySelectorAll("[data-sel]").forEach(a => a.onclick = () => select([a.dataset.sel]));
  main.querySelectorAll("[data-all]").forEach(a => a.onclick = () => { state.mode = "all"; select(a.dataset.all.split(",")); });
  main.querySelectorAll("[data-q]").forEach(a => a.onclick = () => { state.q = a.dataset.q; update(); });
  main.querySelectorAll("[data-go]").forEach(a => a.onclick = () => document.getElementById(a.dataset.go).scrollIntoView({behavior: "smooth"}));
}

function renderMainKeepFocus() {
  const pos = document.getElementById("q").selectionStart;
  renderMain();
  const q = document.getElementById("q");
  q.focus(); q.setSelectionRange(pos, pos);
}

function update() {
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === state.mode));
  history.replaceState(null, "", "#" + [...state.sel].join(","));
  renderSidebar();
  renderMain();
}

document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.v; update(); });
document.getElementById("labSearch").oninput = renderSidebar;
document.getElementById("hideZero").onchange = renderSidebar;
document.addEventListener("keydown", e => { if (e.key === "Escape") { state.q = ""; select([]); } });
const fromHash = decodeURIComponent(location.hash.slice(1)).split(",").filter(id => id === UNTAGGED || labelById[id]);
state.sel = new Set(fromHash);
renderHeader();
update();
</script>
</body>
</html>
