etectionOrigin type and probability", "cls": "automated", "labels": ["FWTC_BoundingBox_ExportedClip", "FWTC_SDCard_ClipExport"], "primary": "FWTC_BoundingBox_ExportedClip", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an SD-exported clip carries a valid 'rezp' tracker stream with timestamped bounding-box packets.", "unknown": []}, {"key": "UNI-35518", "uid": "fenix-tests/camera_system/test_video_quality_runtime_transition.py::TestVideoQualityRuntimeTransition::test_high_to_low_updates_sd_and_cloud_clip_resolution_without_reboot", "file": "camera_system/test_video_quality_runtime_transition.py", "title": "HIGH To LOW Applies 1080p To Active SD And Cloud Recording Encoders", "desc": "BDD Scenario: HIGH-to-LOW updates the active recording encoder without reboot\n\nGIVEN the persisted recording profile is HIGH 3840x2160\nWHEN legacy Set.Quality.Config changes the camera from HIGH to LOW without rebooting\nTHEN the persisted continuous and event recording profiles should be 1920x1080\nAND the new completed SD recording should be 1920x1080\nAND a new on-demand cloud clip should be 1920x1080", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_OnDemandClip", "FWTC_SDCard_Recording"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts that after HIGH->LOW without reboot both the active SD recording and a new on-demand cloud clip are 1080p.", "unknown": []}, {"key": "UNI-35470", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_advanced_video_config_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Advanced Video Configuration ACK Validation", "desc": "BDD Scenario: Advanced Video Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I apply a camera-supported advanced video configuration (Standard profile)\nTHEN the system should return a valid transaction ID\nAND the Set.AdvancedVideo.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.AdvancedVideo.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CloudEvent", "FWTC_FPS", "FWTC_VideoCodec"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the advanced video config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34471", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_audio_alert_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Audio Alert Configuration ACK Validation", "desc": "BDD Scenario: Audio Alert Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure audio alert settings with loudSound enabled and threshold 86dB\nTHEN the system should return a valid transaction ID\nAND the Set.AudioAlerts.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.AudioAlerts.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_AudioEvent"], "primary": "FWTC_AudioEvent", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the audio alert config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34472", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_audio_recording_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Audio Recording Configuration ACK Validation", "desc": "BDD Scenario: Audio Recording Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure audio recording settings to enable audio recording on channel 1\nTHEN the system should return a valid transaction ID\nAND the Set.AudioRecording.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.AudioRecording.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_Audio_Recording", "FWTC_CloudEvent"], "primary": "FWTC_Audio_Recording", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the audio recording config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34478", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_checkin_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "QoS Request / Camera CheckIn ACK Validation", "desc": "BDD Scenario: QoS Request and Camera CheckIn ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I send a QoS request to trigger device check-in\nTHEN the system should return a valid transaction ID\nAND the Qos.Request event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Camera.CheckIn message should be received as acknowledgment\nAND the CheckIn message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_CheckIn"], "primary": "FWTC_CheckIn", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a QoS request is answered by a Camera.CheckIn with the matching event ID.", "unknown": []}, {"key": "UNI-34470", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_clip_capture_start_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "ClipCapture Start ACK Message Validation", "desc": "BDD Scenario: ClipCapture Start ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I send a ClipCapture Start request with 30 seconds duration\nTHEN the system should return a valid transaction ID\nAND the ClipCapture.Start event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a ClipCapture.Start.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_OnDemandClip"], "primary": "FWTC_OnDemandClip", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts ClipCapture.Start is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34481", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_format_request_response_message", "file": "cloud/test_acknowledge_message.py", "title": "SD Card Format Request/Response ACK Validation", "desc": "BDD Scenario: SD Card Format Request and Response Message Validation\n\nGIVEN a device is online with an SD card inserted\nWHEN I trigger a QoS request to get device storage information\nAND I extract the SD card storage ID from Camera.CheckIn event\nAND I send a format storage request for the SD card\nTHEN the system should return a valid transaction ID\nAND the Storage.Format.Request event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Storage.Format.Response message should be received\nAND the response message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the format request gets a matching Storage.Format.Response, SUCCESS and SD_CARD_FORMATTED.", "unknown": []}, {"key": "UNI-34473", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_night_mode_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Night Mode Configuration ACK Validation", "desc": "BDD Scenario: Night Mode Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure night mode to AUTO_IR mode\nTHEN the system should return a valid transaction ID\nAND the Set.Mode.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.Mode.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_IR", "FWTC_CloudEvent"], "primary": "FWTC_IR", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the AUTO_IR night mode command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-35471", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_overlay_config_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Overlay Configuration ACK Validation", "desc": "BDD Scenario: Overlay Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I enable the date/time watermark in 24h format and the logo watermark\nTHEN the system should return a valid transaction ID\nAND the Set.Overlay.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.Overlay.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_CloudEvent", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the time/logo overlay config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34474", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_privacy_mode_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Privacy Mode Configuration ACK Validation", "desc": "BDD Scenario: Privacy Mode Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure privacy mode to disabled state\nTHEN the system should return a valid transaction ID\nAND the Set.PrivacyMode.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.PrivacyMode.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_PrivacyMode", "FWTC_CloudEvent"], "primary": "FWTC_PrivacyMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the privacy mode config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34477", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_sendlogs_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Send Logs Request ACK Validation", "desc": "BDD Scenario: Send Logs Request ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I send a logs request with category \"fx_ats\" and description \"AckTestLogs\"\nTHEN the system should return a valid transaction ID\nAND the Sendlogs.Request event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Sendlogs.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_RemoteLogs"], "primary": "FWTC_RemoteLogs", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the send-logs request is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34480", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_stream_config_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Stream.Config / Stream.Config.Ack Post-Reboot Validation", "desc": "BDD Scenario: Stream Configuration ACK Message Validation After Device Reboot\n\nGIVEN a device is online and responsive\nWHEN I reboot the device and wait for startup completion\nTHEN the device should automatically send Stream.Config event\nAND a Stream.Config.Ack message should be received in response\nAND the ACK flow should complete successfully without manual intervention", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the camera publishes Stream.Config and receives Stream.Config.Ack after reboot.", "unknown": []}, {"key": "UNI-34479", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_timezone_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Timezone Configuration ACK Validation", "desc": "BDD Scenario: Timezone Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure timezone to \"Pacific/Auckland\"\nTHEN the system should return a valid transaction ID\nAND the TimeZone event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a TimeZone.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_CloudEvent"], "primary": "FWTC_CloudEvent", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the timezone config command is ACKed; no FWTC label covers timezone configuration.", "unknown": []}, {"key": "UNI-34475", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_video_quality_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Video Quality Configuration ACK Validation", "desc": "BDD Scenario: Video Quality Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure video quality to LOW setting\nTHEN the system should return a valid transaction ID\nAND the Set.Quality.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.Quality.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CloudEvent"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the video quality config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-34476", "uid": "fenix-tests/cloud/test_acknowledge_message.py::TestAckMessageValidation::test_volume_ack_message", "file": "cloud/test_acknowledge_message.py", "title": "Microphone Volume Configuration ACK Validation", "desc": "BDD Scenario: Volume Configuration ACK Message Validation\n\nGIVEN a device is online and responsive\nWHEN I configure microphone volume to MEDIUM level\nTHEN the system should return a valid transaction ID\nAND the Set.Volume.Config event should be logged in ElasticSearch\nAND the transaction ID should match between request and ElasticSearch\nAND a Set.Volume.Config.Ack message should be received\nAND the ACK message should contain the correct Event ID", "cls": "automated", "labels": ["FWTC_Microphone", "FWTC_CloudEvent"], "primary": "FWTC_Microphone", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the microphone volume config command is ACKed with the matching event ID.", "unknown": []}, {"key": "UNI-35642", "uid": "fenix-tests/cloud/test_advanced_video_config.py::TestAdvancedVideoConfig::test_legacy_video_quality_reflected_in_advanced_config[high]", "file": "cloud/test_advanced_video_config.py", "title": "Legacy Video Quality API Stays Consistent With Advanced Video Configuration [high]", "desc": "BDD Scenario: Legacy Video Quality API Stays Consistent With advancedVideoConfig\n\n    GIVEN a device is online and responsive\n    WHEN I set the video quality through the legacy Set.Quality.Config API\n    THEN a Set.Quality.Config.Ack message for that request should be received\n    WHEN I request QoS to trigger a Camera.CheckIn\n    THEN CheckIn cameraSettings.qualityConfig.mode should report the quality I set\n    AND CheckIn cameraSettings.advancedVideoConfig continuous and events should use the matching recording resolution\n\n\nParameter ID: high\nParameter values: {\"quality\": \"high\"}", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts legacy quality LOW/HIGH is ACKed and CheckIn reports the matching mode and recording resolution.", "unknown": []}, {"key": "UNI-35479", "uid": "fenix-tests/cloud/test_advanced_video_config.py::TestAdvancedVideoConfig::test_legacy_video_quality_reflected_in_advanced_config[low]", "file": "cloud/test_advanced_video_config.py", "title": "Legacy Video Quality API Stays Consistent With Advanced Video Configuration [low]", "desc": "BDD Scenario: Legacy Video Quality API Stays Consistent With advancedVideoConfig\n\n    GIVEN a device is online and responsive\n    WHEN I set the video quality through the legacy Set.Quality.Config API\n    THEN a Set.Quality.Config.Ack message for that request should be received\n    WHEN I request QoS to trigger a Camera.CheckIn\n    THEN CheckIn cameraSettings.qualityConfig.mode should report the quality I set\n    AND CheckIn cameraSettings.advancedVideoConfig continuous and events should use the matching recording resolution\n\n\nParameter ID: low\nParameter values: {\"quality\": \"low\"}", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts legacy quality LOW/HIGH is ACKed and CheckIn reports the matching mode and recording resolution.", "unknown": []}, {"key": "UNI-35475", "uid": "fenix-tests/cloud/test_advanced_video_config.py::TestAdvancedVideoConfig::test_rotate_is_source_of_truth", "file": "cloud/test_advanced_video_config.py", "title": "Rotate Field Is The Source Of Truth", "desc": "BDD Scenario: Rotate On Set.AdvancedVideo.Config Is The Source Of Truth\n\nGIVEN a device is online and responsive\nWHEN I apply an advanced video profile with rotate enabled\nTHEN a Set.AdvancedVideo.Config.Ack message should be received\nWHEN I request QoS and wait for the correlated Camera.CheckIn\nTHEN CheckIn advancedVideoConfig and legacy videoConfig should report the requested rotation\nAND cameraSettings.advancedVideoConfig.rotate should report the value I sent", "cls": "automated", "labels": ["FWTC_RotateVideo", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_RotateVideo", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts rotate set via advanced video config is reported in CheckIn and camera state.", "unknown": []}, {"key": "UNI-35643", "uid": "fenix-tests/cloud/test_advanced_video_config.py::TestAdvancedVideoConfig::test_supported_profile_applied_and_read_back[high]", "file": "cloud/test_advanced_video_config.py", "title": "Supported Advanced Video Profile Is Applied And Reported Back [high]", "desc": "BDD Scenario: Supported Advanced Video Profile Is Applied And Reported Back\n\n    GIVEN a device is online and responsive\n    WHEN I apply a camera-supported advanced video profile\n    THEN a Set.AdvancedVideo.Config.Ack message should be received\n    AND GET camera/state should expose cameraSettings.advancedVideoConfig\n    AND the reported configuration should match the configuration I sent\n\n\nParameter ID: high\nParameter values: {\"builder\": \"<function>\", \"profile_name\": \"high_4k_h264\"}", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CloudEvent", "FWTC_FPS", "FWTC_VideoCodec"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a supported advanced video profile is ACKed and its resolution/codec/fps are read back from camera state.", "unknown": []}, {"key": "UNI-35472", "uid": "fenix-tests/cloud/test_advanced_video_config.py::TestAdvancedVideoConfig::test_supported_profile_applied_and_read_back[standard]", "file": "cloud/test_advanced_video_config.py", "title": "Supported Advanced Video Profile Is Applied And Reported Back [standard]", "desc": "BDD Scenario: Supported Advanced Video Profile Is Applied And Reported Back\n\n    GIVEN a device is online and responsive\n    WHEN I apply a camera-supported advanced video profile\n    THEN a Set.AdvancedVideo.Config.Ack message should be received\n    AND GET camera/state should expose cameraSettings.advancedVideoConfig\n    AND the reported configuration should match the configuration I sent\n\n\nParameter ID: standard\nParameter values: {\"builder\": \"<function>\", \"profile_name\": \"standard_1080p_h264\"}", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_CloudEvent", "FWTC_FPS", "FWTC_VideoCodec"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a supported advanced video profile is ACKed and its resolution/codec/fps are read back from camera state.", "unknown": []}, {"key": "UNI-34699", "uid": "fenix-tests/cloud/test_camera_orientation.py::TestCameraOrientation::test_camera_orientation_0_vs_180_degrees", "file": "cloud/test_camera_orientation.py", "title": "Camera Orientation: 0° vs 180° Rotation Validation", "desc": "Feature: Camera Video Orientation Control\nScenario: Validate camera orientation configuration using OpenCV feature matching\n    Given the camera is online and accessible\n    When I capture a snapshot at the current camera orientation (baseline)\n    Then set the camera orientation to 180° (inverted, rotate=True)\n    And capture a snapshot at 180° orientation\n    Then use OpenCV feature matching to detect rotation angle between images\n    And verify detected angle is approximately 180° (±10°)\n    And confirm rotation was applied successfully\n\nValidation Strategy:\nPrimary Method: OpenCV Feature Matching (ORB + Homography)\n    - Detects keypoints using ORB detector in both images\n    - Matches features and calculates homography transformation matrix\n    - Extracts rotation angle from matrix\n    - Validates angle is within 170°-190° range (180° ±10°)\n\nFallback Method: Pixel Comparison (if feature matching has low confidence)\n    - Rotates the 180° snapshot back by 180° programmatically\n    - Compares with baseline using SSIM or pixel difference\n    - Validates difference is < 20% (threshold: 20%)\n\nSuccess Criteria:\n- Feature matching detects rotation angle between 170° and 190°, OR\n- Pixel difference after rotating back is less than 20%", "cls": "automated", "labels": ["FWTC_RotateVideo", "FWTC_CloudEvent"], "primary": "FWTC_RotateVideo", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts snapshots taken before and after setting 180 degrees show a detected 180-degree image rotation.", "unknown": []}, {"key": "UNI-34700", "uid": "fenix-tests/cloud/test_camera_orientation.py::TestCameraOrientation::test_motion_zone_config_with_orientation_change", "file": "cloud/test_camera_orientation.py", "title": "Motion Zone Configuration: Verify Reset Behavior with Orientation Changes", "desc": "Feature: Motion Zone Configuration Reset Behavior During Orientation Changes\nScenario: Validate motion zone configuration resets to defaults after camera orientation change\n    Given the camera is online and accessible\n    When I set motion zone configuration with 4 areas all enabled (custom configurations)\n    Then verify the configuration via QoS request → Camera.CheckIn event\n    And validate all 4 zones match custom configuration (geometry, events, thresholds)\n    When I change camera orientation to 180°\n    Then verify the motion zone configuration resets to defaults via QoS request → Camera.CheckIn event\n    And confirm motion zones reset to: Area 1 enabled (full frame), Areas 2-4 disabled\n    And verify zone IDs reset to camera defaults (Area 1, Area 2, Area 3, Area 4)\n\nInitial Custom Configuration:\n- Zone_FullFrame_AllDetection: enabled, 3834x2160, all detection types, threshold=80\n- Zone_TopLeft_AllDetection: enabled, 1523x1571, all detection types, threshold=1000\n- Zone_Bottom_VehicleMotion: enabled, 3569x959, vehicle+motion only, threshold=250\n- Zone_LeftHalf_PersonMotion: enabled, 1911x2148, person+motion only, threshold=250\n\nExpected Default Configuration After Orientation Change:\n- Area 1: enabled=true, 3840x2160 full frame, person+animal+vehicle enabled, motion disabled\n- Area 2: enabled=false, 3840x2160 full frame, all detection disabled\n- Area 3: enabled=false, 3840x2160 full frame, all detection disabled\n- Area 4: enabled=false, 3840x2160 full frame, all detection disabled\n\nValidation Method:\n- Motion zone configuration verified via Camera.CheckIn event (triggered by QoS request)\n- Configuration path: Content.cameraSettings.zoneConfig.motionZoneConfigurations\n- All fields validated: enabled, geometry (x,y,width,height), scale, events, thresholds\n\nKnown Camera Behavior:\n- Camera firmware RESETS motion zones to factory defaults after orientation change\n- Custom zone configurations (geometry, events, thresholds, IDs) are NOT preserved\n- Only Area 1 remains enabled with default settings after orientation change\n- Applications must reconfigure motion zones after any orientation change", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent", "FWTC_RotateVideo"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts zones reported in CheckIn reset to defaults after an orientation change.", "unknown": []}, {"key": "UNI-35333", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_behavior_schedule_survives_reboot", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud Behavior: Schedule Survives Device Reboot", "desc": "Feature: Recording Schedule Cloud Behavior\nScenario: After reboot, the schedule is still present and the cloud view matches\n    Given the spec example schedule has been PUT via REST and propagated to the device\n    When I reboot the camera via the Unicorn API\n    And wait for the TimeZone event that confirms it is back online\n    Then /home/root/recording_schedule.json should still contain all three schedules\n    And a fresh Camera.CheckIn should carry the same three schedules", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CheckIn", "FWTC_CloudEvent", "FWTC_SettingsRetain"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts schedules persist in the device file and CheckIn after reboot.", "unknown": []}, {"key": "UNI-35337", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_propagation_rest_put_lands_on_device_file", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud Propagation: REST PUT Lands on Device File", "desc": "Feature: Recording Schedule Cloud Propagation\nScenario: After a REST PUT, the on-device file reflects the new schedule\n    Given the spec example is PUT via REST and returns 2xx\n    When I poll /home/root/recording_schedule.json over SSH\n    Then within the propagation SLA the file should contain the\n    three named schedules from the request", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a REST schedule PUT is persisted to the on-camera schedule file.", "unknown": []}, {"key": "UNI-35335", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_propagation_schedule_visible_in_camera_checkin", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud Propagation: Schedule Visible in Camera CheckIn", "desc": "Feature: Recording Schedule Cloud Propagation\nScenario: Schedule appears in the camera shadow / CheckIn payload\n    Given the spec example is PUT via REST\n    When I trigger a QoS request to provoke Camera.CheckIn\n    Then the CheckIn message should carry the schedule\n    And all three schedule names should appear in that list", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the propagated schedules are reported in Camera.CheckIn.", "unknown": []}, {"key": "UNI-35329", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_schema_enabled_requires_time_windows", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud Validation: Enabled Schedule Requires Time Windows", "desc": "Feature: Recording Schedule Cloud Validation\nScenario: enabled=true requires timeWindows on the wire\n    Given a raw JSON schedule with enabled=true and no timeWindows key\n    When I PUT it directly (bypassing the vendor pydantic model)\n    Then the cloud should reject with HTTP 400\n    And the error body should point at the missing TimeWindows field", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an enabled schedule without TimeWindows is rejected with HTTP 400.", "unknown": []}, {"key": "UNI-35336", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_schema_priority_bounds", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud Validation: Priority Bounds Enforced (0-100)", "desc": "Feature: Recording Schedule Cloud Validation\nScenario: The cloud enforces priority within 0 to 100\n    Given raw JSON payloads with priority=-1 and priority=101\n    And valid payloads with priority=0 and priority=100 (boundaries)\n    When I PUT each one directly (bypassing pydantic)\n    Then out-of-range values should return HTTP 400\n    And boundary values (0 and 100) should return HTTP 202", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts schedule priority outside 0-100 is rejected and boundaries are accepted.", "unknown": []}, {"key": "UNI-35330", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_wire_clear_overrides_placeholder_accepted", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud REST: Clear-Overrides Payload Accepted", "desc": "Feature: Recording Schedule Cloud REST\nScenario: Single disabled placeholder is accepted via REST\n    Given a single schedule with enabled=false and timeWindows=[]\n    When I PUT it via the cloud recording-schedule REST endpoint\n    Then the response should be a 2xx\n    And the response body should contain a TransactionId", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the cloud accepts the clear-overrides schedule payload.", "unknown": []}, {"key": "UNI-35331", "uid": "fenix-tests/cloud/test_cloud_recording_schedule.py::TestCloudRecordingSchedule::test_wire_spec_example_accepted", "file": "cloud/test_cloud_recording_schedule.py", "title": "Recording Schedule Cloud REST: Spec Example Payload Accepted", "desc": "Feature: Recording Schedule Cloud REST\nScenario: Spec example payload is accepted\n    Given the documented spec example (3 schedules)\n    When I PUT it via the cloud recording-schedule REST endpoint\n    Then the response should be a 2xx\n    And the response body should contain a TransactionId", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_CloudEvent"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the cloud accepts the spec example recording schedule payload.", "unknown": []}, {"key": "UNI-35511", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_checkin_reports_both_zone_configurations", "file": "cloud/test_detection_zones_v2.py", "title": "Camera.CheckIn: Report Legacy and V2 Zone Configurations Together", "desc": "BDD Scenario: Camera.CheckIn reports both zone configuration formats\n\nGIVEN the camera has legacy rectangular motion zones\n  AND a V2 polygon detection zone has been applied\nWHEN a QoS request triggers Camera.CheckIn\nTHEN cameraSettings.zoneConfig should contain motionZoneConfigurations\n  AND the same zoneConfig should contain detectionZones\n  AND the reported V2 polygon should match the applied configuration", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts Camera.CheckIn reports legacy and V2 zone configurations together.", "unknown": []}, {"key": "UNI-35644", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_disable_zone[1080p]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Disable Zone [1080p]", "desc": "BDD Scenario: A detection zone can be disabled through the enabled flag\n\n    GIVEN an enabled person-detection zone has been applied\n    WHEN the same zone is updated with enabled=false\n    THEN Set.Zone.Config.V2.Ack should report the disabled zone\n    AND Camera.CheckIn should persist the zone with enabled=false\n\n\nParameter ID: 1080p\nParameter values: {\"resolution\": {\"height\": 1080, \"name\": \"1080p\", \"width\": 1920}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a disabled zone is reported in the V2 Ack and Camera.CheckIn.", "unknown": []}, {"key": "UNI-35477", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_disable_zone[4K]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Disable Zone [4K]", "desc": "BDD Scenario: A detection zone can be disabled through the enabled flag\n\n    GIVEN an enabled person-detection zone has been applied\n    WHEN the same zone is updated with enabled=false\n    THEN Set.Zone.Config.V2.Ack should report the disabled zone\n    AND Camera.CheckIn should persist the zone with enabled=false\n\n\nParameter ID: 4K\nParameter values: {\"resolution\": {\"height\": 2160, \"name\": \"4K\", \"width\": 3840}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a disabled zone is reported in the V2 Ack and Camera.CheckIn.", "unknown": []}, {"key": "UNI-35520", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_legacy_rectangle_is_adapted_to_polygon", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Adapt Legacy Rectangle to Four-Point Polygon", "desc": "BDD Scenario: Legacy rectangles are adapted into V2 polygons\n\nGIVEN a non-full-frame rectangle is submitted through the legacy motion-zone API\nWHEN the camera applies the configuration and publishes Camera.CheckIn\nTHEN the legacy rectangle should be reported unchanged\n  AND detectionZones should contain the equivalent normalized four-point polygon\n  AND firmware-padded disabled zones should use four-point full-frame polygons", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a legacy rectangle zone is reported unchanged and adapted to a four-point polygon in CheckIn.", "unknown": []}, {"key": "UNI-35645", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_random_coordinates_and_polygon_shapes[1080p]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Apply Reproducible Random Polygon Shapes [1080p]", "desc": "BDD Scenario: Multiple polygon shapes and coordinates are applied consistently\n\n    GIVEN the camera is online at the selected video resolution\n    WHEN four deterministic random zones with 4, 6, or 8 vertices are submitted\n    THEN Set.Zone.Config.V2.Ack should echo every zone and threshold\n    AND Camera.CheckIn should report the same normalized polygons and event settings\n\n\nParameter ID: 1080p\nParameter values: {\"resolution\": {\"height\": 1080, \"name\": \"1080p\", \"width\": 1920}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts random 4/6/8-vertex zones and thresholds are echoed in the V2 Ack and Camera.CheckIn.", "unknown": []}, {"key": "UNI-35476", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_random_coordinates_and_polygon_shapes[4K]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Apply Reproducible Random Polygon Shapes [4K]", "desc": "BDD Scenario: Multiple polygon shapes and coordinates are applied consistently\n\n    GIVEN the camera is online at the selected video resolution\n    WHEN four deterministic random zones with 4, 6, or 8 vertices are submitted\n    THEN Set.Zone.Config.V2.Ack should echo every zone and threshold\n    AND Camera.CheckIn should report the same normalized polygons and event settings\n\n\nParameter ID: 4K\nParameter values: {\"resolution\": {\"height\": 2160, \"name\": \"4K\", \"width\": 3840}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts random 4/6/8-vertex zones and thresholds are echoed in the V2 Ack and Camera.CheckIn.", "unknown": []}, {"key": "UNI-35646", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_reject_self_intersecting_zone[1080p]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Reject Self-Intersecting Polygon [1080p]", "desc": "BDD Scenario: Self-intersecting detection-zone polygons are rejected\n\n    GIVEN the camera is online at the selected video resolution\n    WHEN a self-intersecting polygon is submitted through the V2 detection-zone API\n    THEN Set.Zone.Config.V2.Ack should reject the transaction\n    AND the Ack should expose a rejected status or non-zero error\n\n\nParameter ID: 1080p\nParameter values: {\"resolution\": {\"height\": 1080, \"name\": \"1080p\", \"width\": 1920}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a self-intersecting polygon zone is rejected in Set.Zone.Config.V2.Ack.", "unknown": []}, {"key": "UNI-35474", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_reject_self_intersecting_zone[4K]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Reject Self-Intersecting Polygon [4K]", "desc": "BDD Scenario: Self-intersecting detection-zone polygons are rejected\n\n    GIVEN the camera is online at the selected video resolution\n    WHEN a self-intersecting polygon is submitted through the V2 detection-zone API\n    THEN Set.Zone.Config.V2.Ack should reject the transaction\n    AND the Ack should expose a rejected status or non-zero error\n\n\nParameter ID: 4K\nParameter values: {\"resolution\": {\"height\": 2160, \"name\": \"4K\", \"width\": 3840}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a self-intersecting polygon zone is rejected in Set.Zone.Config.V2.Ack.", "unknown": []}, {"key": "UNI-35647", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_supported_object_detection_events[1080p]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Apply Supported Object Detection Events [1080p]", "desc": "BDD Scenario: Supported object detection events are applied\n\n    GIVEN person, vehicle, animal, and package detection are supported by Fenix\n    WHEN a V2 detection zone enables all four object event types with thresholds\n    THEN Set.Zone.Config.V2.Ack should echo every enabled event and threshold\n    AND Camera.CheckIn should persist the same object event configuration\n\n\nParameter ID: 1080p\nParameter values: {\"resolution\": {\"height\": 1080, \"name\": \"1080p\", \"width\": 1920}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts per-zone person/vehicle/animal/package event flags and thresholds are echoed in the V2 Ack and CheckIn.", "unknown": []}, {"key": "UNI-35478", "uid": "fenix-tests/cloud/test_detection_zones_v2.py::TestDetectionZonesV2::test_supported_object_detection_events[4K]", "file": "cloud/test_detection_zones_v2.py", "title": "Detection Zones V2: Apply Supported Object Detection Events [4K]", "desc": "BDD Scenario: Supported object detection events are applied\n\n    GIVEN person, vehicle, animal, and package detection are supported by Fenix\n    WHEN a V2 detection zone enables all four object event types with thresholds\n    THEN Set.Zone.Config.V2.Ack should echo every enabled event and threshold\n    AND Camera.CheckIn should persist the same object event configuration\n\n\nParameter ID: 4K\nParameter values: {\"resolution\": {\"height\": 2160, \"name\": \"4K\", \"width\": 3840}}", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_CheckIn", "FWTC_CloudEvent"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts per-zone person/vehicle/animal/package event flags and thresholds are echoed in the V2 Ack and CheckIn.", "unknown": []}, {"key": "UNI-35230", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_11_mdns_auto_discover", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 11 — mDNS Discovery for Unregistered Camera on Stable Network", "desc": "BDD Scenario: Verify mDNS discovery operates correctly for an unregistered camera on a stable network\n\nGIVEN a camera is unregistered and powered on\n  AND the camera is connected to a stable local network\n  AND mDNS service (_rezi-video-discovery._tcp) is advertised by the camera\nWHEN I discover cameras via mDNS using avahi-browse\nTHEN the camera SHALL be discoverable via mDNS\n  AND the mDNS response SHALL contain correct device information (MAC, IP, firmware version)\n  AND the registration code SHALL be present in TXT records\n  AND direct MAC address lookup SHALL successfully locate the camera\n  AND all mDNS TXT records SHALL contain required fields for registration readiness", "cls": "semi-automated", "labels": ["FWTC_mDNS", "FWTC_Registration"], "primary": "FWTC_mDNS", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts the unregistered camera is discoverable via mDNS with IP and MAC TXT data.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35220", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_12_barcode_scan_registration", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 12 — Manual Registration via Barcode Scan", "desc": "BDD Scenario: Register camera by scanning barcode\n\nGIVEN a camera is powered on and unregistered\n  AND I am logged into the TC2 App\n  AND I have access to the camera's barcode (QR/Barcode)\nWHEN I tap \"Scan Barcode\" and scan the code\nTHEN the camera details (serial, MAC) SHALL be captured\n  AND registration SHALL be initiated\n  AND the camera SHALL be registered upon confirmation\n  AND Camera.CheckIn event SHALL appear in ElasticSearch", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts barcode-scan registration completes and startup events appear; Cloud registration flow has no FWTC label; CheckIn/startup events only confirm registration completed.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35219", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_13_mac_address_registration", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 13 — Manual Registration via MAC Address and Code", "desc": "BDD Scenario: Register camera with MAC address and registration code\n\nGIVEN a camera is powered on and unregistered\n  AND I am logged into the TC2 App\n  AND I have the camera's MAC address and registration code\nWHEN I tap \"Enter Manually\" and input MAC + code\nTHEN the camera SHALL be validated against database\n  AND registration SHALL be initiated\n  AND the camera SHALL be registered upon confirmation", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts manual MAC+code registration completes; Cloud registration flow has no FWTC label; CheckIn/startup events only confirm registration completed.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35227", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_15_register_multiple_devices_same_account", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 15 — Register Multiple Devices to Same Account", "desc": "BDD Scenario: Register multiple cameras to one account\n\nGIVEN I have a valid account\nWHEN I register the target device via API\n  AND I query the registration status\nTHEN the device SHALL be registered with a unique device ID\n  AND registering a second time (idempotent) SHALL NOT create duplicates\n  AND each registration SHALL have a unique identity", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts API registration succeeds and re-registration is rejected with HTTP 403; Cloud registration flow has no FWTC label; CheckIn/startup events only confirm registration completed.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35221", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_16_registration_via_api", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 16 — Registration via API", "desc": "BDD Scenario: Register camera using API\n\nGIVEN a camera is powered on and on the network\n  AND I have valid API credentials with write permission\nWHEN I send a registration request via API\nTHEN the camera SHALL be registered\n  AND confirmation SHALL be returned with device_id\n  AND Camera.CheckIn event SHALL appear in ElasticSearch", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts API registration succeeds; Cloud registration flow has no FWTC label; CheckIn/startup events only confirm registration completed.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35228", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_18_registration_failure_invalid_code", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 18 — Registration Failure with Invalid 6-Digit Registration Code", "desc": "BDD Scenario: Attempt registration with a comprehensive set of invalid\n6-digit numeric registration codes to verify the API rejects every\nwrong code and only accepts the genuine device code.\n\nGIVEN a camera is powered on and unregistered\nWHEN I attempt to register with each of the following invalid 6-digit codes:\n  - 000000  (all zeros)\n  - 999999  (all nines)\n  - 111111  (repeated single digit)\n  - 123456  (sequential ascending)\n  - 654321  (sequential descending)\n  - 100000  (minimum 6-digit boundary)\n  - 100001  (boundary + 1)\n  - 999998  (max boundary - 1)\n  - 000001  (leading zeros, near-zero)\n  - 555555  (repeated mid-range digit)\n  - 246810  (even digits ascending)\n  - 135791  (odd digits ascending)\n  - 121212  (alternating pattern)\n  - 909090  (alternating with zeros)\n  - 010101  (binary-like pattern)\n  - 314159  (pi digits)\n  - 271828  (euler number digits)\n  - 420420  (repeated 3-digit block)\n  - 696969  (repeated 2-digit block)\n  - 000010  (sparse value)\nTHEN the system SHALL reject the registration for every invalid code\n  AND the camera SHALL NOT be registered\n  AND the device SHALL remain in unregistered state throughout\n\nWHEN I then retry registration with a valid code (from mDNS or 0)\nTHEN the registration SHALL succeed\n  AND Camera.CheckIn event SHALL appear in ElasticSearch", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts invalid 6-digit codes are rejected and a valid code then registers; Cloud registration flow has no FWTC label; CheckIn/startup events only confirm registration completed.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35224", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_19_registration_failure_offline_camera", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 19 — Registration Failure with Offline Camera (Power Off)", "desc": "BDD Scenario: Attempt to register a camera that is completely powered off\n\nGIVEN a camera is unregistered\n  AND the camera is powered off via UniFi PoE switch control\n  AND SSH confirms the camera is unreachable\nWHEN I attempt to register via the API\nTHEN the device SHALL NOT become registered\n  AND no Camera.CheckIn event SHALL appear in ElasticSearch\n\nCLEANUP: Power the camera back on via PoE and wait for SSH recovery", "cls": "semi-automated", "labels": ["FWTC_Offline", "FWTC_Registration"], "primary": "FWTC_Offline", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts a powered-off camera is not registered and sends no Camera.CheckIn.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35222", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_19b_registration_failure_network_blocked", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 19b — Registration Failure with Network Down (Device Still Powered)", "desc": "BDD Scenario: Attempt to register a camera whose network has been\ndisabled via the UniFi switch port API (port_security + block_all VLAN)\nwhile the device remains powered on via PoE.\n\nGIVEN a camera is unregistered\n  AND the camera is powered on\nWHEN I disable the camera's network via the UniFi port network API\n  AND the camera loses IP connectivity (still powered via PoE)\nTHEN the camera SHALL NOT be discoverable via mDNS\n\nCLEANUP: Restore port network via UniFi API", "cls": "semi-automated", "labels": ["FWTC_mDNS", "FWTC_Offline", "FWTC_Registration"], "primary": "FWTC_mDNS", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts the camera is not discoverable via mDNS while its network port is down.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35223", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_20_registration_confirmation_required", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 20 — Registration Confirmation Required", "desc": "BDD Scenario: Verify user must confirm auto-discovered camera\n\nGIVEN a camera is auto-discovered via mDNS in the TC2 App\nWHEN I tap the discovered camera but do NOT confirm registration\nTHEN registration SHALL NOT complete\n  AND camera SHALL NOT appear in portal\nWHEN I then confirm registration\nTHEN the camera SHALL be registered", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts registration only completes after the user confirms in the app; app/cloud flow with no FWTC label.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35225", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_24_camera_not_responding_to_reset", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 24 — Camera Not Responding to Reset", "desc": "BDD Scenario: Unregister but camera doesn't respond to camera.Reset\n\nGIVEN a camera is registered\n  AND I initiate unregistration\n  BUT the camera does not respond to camera.Reset within 10 seconds\nTHEN portal SHALL still remove device from account\n  AND device removal SHALL be reflected in API status", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts the portal removes the device even without a camera.Reset response; cloud-side behavior with no FWTC label.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35226", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_26_unregistration_timeout", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 26 — Unregistration Timeout", "desc": "BDD Scenario: Unregister times out waiting for camera.Reset\n\nGIVEN a camera is registered\nWHEN I initiate unregistration\n  AND the camera does not respond within the timeout window\nTHEN portal timeout SHALL trigger\n  AND portal SHALL attempt device removal independently\n  AND device SHALL eventually be unregistered", "cls": "semi-automated", "labels": ["FWTC_Registration"], "primary": "FWTC_Registration", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts the portal completes unregistration on timeout and the device can re-register; cloud-side behavior with no FWTC label.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35229", "uid": "fenix-tests/cloud/test_device_registration_scenarios.py::TestDeviceRegistrationScenarios::test_scenario_26b_unregistration_while_device_offline", "file": "cloud/test_device_registration_scenarios.py", "title": "Scenario 26b — Unregistration While Device Offline (No camera.Reset)", "desc": "BDD Scenario: Device is taken offline before unregistration so it cannot\nreceive camera.Reset. After network restore, user re-registers the device.\n\nGIVEN a camera is registered, online, and SSH-reachable\nWHEN the camera's port network is disabled (device stays powered)\n  AND unregistration is triggered from the cloud\n  AND the device remains offline for 30s\nTHEN the cloud SHALL mark the device as unregistered\n  AND the port network is restored\n  AND the device SHALL reconnect (SSH-reachable)\n  AND ProcessMonitor.log SHALL NOT contain camera.Reset\nWHEN user re-registers the device via TC2 App\nTHEN REGISTRATION_STARTUP_EVENTS SHALL appear in ElasticSearch", "cls": "semi-automated", "labels": ["FWTC_Offline", "FWTC_Registration"], "primary": "FWTC_Offline", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts unregistration while the camera is offline sends no camera.Reset on reconnect and re-registration works.", "unknown": ["FWTC_Registration"]}, {"key": "UNI-35341", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) — P2P", "desc": "Feature: Live Streaming Quality\nScenario: Validate video quality on the main stream (4K) over P2P (host-to-host LAN)\n    Given the device is online and camera is operational\n    When I start a WebRTC viewer session using P2P (host-to-host LAN)\n    And I switch to main stream (4K)\n    And I wait 30 seconds for the stream to stabilize\n    Then video stats should show resolution >= 2160p (4K)\n    And bitrate between 3000–8000 kbps (~4–5.5 Mbps)\n    And packets should be received successfully", "cls": "automated", "labels": ["FWTC_WebRTC", "FWTC_Bitrate", "FWTC_VideoResolution"], "primary": "FWTC_WebRTC", "other": ["Fenix_FW_TestCase", "automated"], "why": "Single P2P 4K main stream: asserts WebRTC video packets flow, video height meets the 4K minimum and bitrate stays in the expected window", "unknown": []}, {"key": "UNI-35485", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_hevc_multi_session", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) - H.265 - P2P - 3 Concurrent Sessions", "desc": "Feature: Live Streaming Quality\nScenario: Validate 3 concurrent 4K sessions while the camera encodes H.265\n    Given the device is online and camera is operational\n    And the camera has been switched to H.265 over VideoDataManager MQTT\n    When I start 3 concurrent WebRTC viewer sessions using P2P (host-to-host LAN)\n    And I switch all sessions to main stream (4K)\n    And I wait for the streams to stabilize\n    Then every session should be negotiated as H265\n    And every session should show resolution >= 2160p (4K)\n    And every session should show bitrate between 3000-8000 kbps", "cls": "automated", "labels": ["FWTC_ConcurrentStreams", "FWTC_VideoCodec", "FWTC_VideoResolution", "FWTC_WebRTC"], "primary": "FWTC_ConcurrentStreams", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts three concurrent 4K main-stream sessions negotiate H265 with decoded frames, minimum height and bitrate.", "unknown": []}, {"key": "UNI-35482", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_hevc_ramp_aware", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) — H.265 — ramp-aware — P2P", "desc": "Feature: Live Streaming Quality\nScenario: Validate main stream (4K) quality on H.265, waiting out the bandwidth ramp\n    Given the device is online and camera is operational\n    And the camera has been switched to H.265 over VideoDataManager MQTT\n    When I start a WebRTC viewer session using P2P (host-to-host LAN)\n    And I wait for the sub stream to reach its own target range first\n    And I switch to main stream (4K)\n    And I poll until the bitrate settles instead of sampling at a fixed time\n    Then the session should still be negotiated as H265\n    And video stats should show resolution >= 2160p (4K)\n    And the settled bitrate should be between 3000-8000 kbps", "cls": "automated", "labels": ["FWTC_WebRTC", "FWTC_Bitrate", "FWTC_VideoCodec", "FWTC_VideoResolution"], "primary": "FWTC_WebRTC", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the 4K main stream stays H265 after switch, with minimum height and bitrate in window after the ramp.", "unknown": []}, {"key": "UNI-35346", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_multi_session", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) — P2P — 3 Concurrent Sessions", "desc": "Feature: Live Streaming Quality\nScenario: Validate video quality with 3 concurrent sessions on the main stream (4K) over P2P (host-to-host LAN)\n    Given the device is online and camera is operational\n    When I start 3 concurrent WebRTC viewer sessions using P2P (host-to-host LAN)\n    And I switch all sessions to main stream (4K)\n    And I wait 60 seconds for streams to stabilize\n    Then all 3 sessions should show resolution >= 2160p (4K)\n    And all 3 sessions should show bitrate between 3000–8000 kbps (~4–5.5 Mbps)\n    And all sessions are stopped after validation", "cls": "automated", "labels": ["FWTC_ConcurrentStreams", "FWTC_Bitrate", "FWTC_VideoResolution", "FWTC_WebRTC"], "primary": "FWTC_ConcurrentStreams", "other": ["Fenix_FW_TestCase", "automated"], "why": "Three concurrent P2P 4K main-stream sessions: asserts WebRTC video packets flow, video height meets the 4K minimum and bitrate stays in the expected window", "unknown": []}, {"key": "UNI-35345", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_multi_session_turn", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) — TURN — 3 Concurrent Sessions", "desc": "Feature: Live Streaming Quality\nScenario: Validate video quality with 3 concurrent sessions on the main stream (4K) over TURN (relay)\n    Given the device is online and camera is operational\n    When I start 3 concurrent WebRTC viewer sessions using TURN (relay)\n    And I switch all sessions to main stream (4K)\n    And I wait 60 seconds for streams to stabilize\n    Then all 3 sessions should show resolution >= 2160p (4K)\n    And all 3 sessions should show bitrate between 3000–8000 kbps (~4–5.5 Mbps)\n    And all sessions are stopped after validation", "cls": "automated", "labels": ["FWTC_ConcurrentStreams", "FWTC_Bitrate", "FWTC_VideoResolution", "FWTC_WebRTC"], "primary": "FWTC_ConcurrentStreams", "other": ["Fenix_FW_TestCase", "automated"], "why": "Three concurrent TURN 4K main-stream sessions: asserts WebRTC video packets flow, video height meets the 4K minimum and bitrate stays in the expected window", "unknown": []}, {"key": "UNI-35480", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_ramp_aware", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (4K) — ramp-aware — P2P", "desc": "Feature: Live Streaming Quality\nScenario: Validate main stream (4K) quality, waiting out the bandwidth ramp\n    Given the device is online and camera is operational\n    When I start a WebRTC viewer session using P2P (host-to-host LAN)\n    And I wait for the sub stream to reach its own target range first\n    And I switch to main stream (4K)\n    And I ignore the first 10 seconds after the switch\n    And I poll until the bitrate settles instead of sampling at a fixed time\n    Then video stats should show resolution >= 2160p (4K)\n    And the settled bitrate should be between 3000-8000 kbps", "cls": "automated", "labels": ["FWTC_WebRTC", "FWTC_Bitrate", "FWTC_VideoResolution"], "primary": "FWTC_WebRTC", "other": ["Fenix_FW_TestCase", "automated"], "why": "After the bitrate ramp, asserts the 4K main stream has packets, the minimum height and bitrate in the expected window.", "unknown": []}, {"key": "UNI-35758", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_tar_6mp[hevc-p2p-3-sessions]", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (Taranaki 6MP, 3200x1800) [hevc-p2p-3-sessions]", "desc": "Feature: Live Streaming Quality\n    Scenario Outline: Validate the Taranaki 6MP main stream (3200x1800) for <scenario>\n        Given the device is a Taranaki 6MP camera and is online\n        When I start the WebRTC viewer session(s) for <scenario>\n        And I switch the session(s) to the main stream\n        Then video stats should show resolution >= 1800p (6MP main stream)\n        And the bitrate should be between 3000-8000 kbps\n        And packets should be received successfully\n        And H.265 scenarios should still be negotiated as H265 after the switch\n\n    Examples: p2p | p2p-3-sessions | turn | turn-3-sessions | ramp-aware-p2p |\n              hevc-ramp-aware-p2p | hevc-p2p-3-sessions\n\n\nParameter ID: hevc-p2p-3-sessions\nParameter values: {\"scenario\": \"hevc-p2p-3-sessions\"}", "cls": "automated", "labels": ["FWTC_ConcurrentStreams", "FWTC_VideoCodec", "FWTC_VideoResolution", "FWTC_WebRTC"], "primary": "FWTC_ConcurrentStreams", "other": ["Tar_FW_TestCase", "automated"], "why": "Three concurrent P2P Taranaki 6MP main-stream sessions negotiated as H265: asserts packets, H265 codec, minimum 1800p height and bitrate window", "unknown": []}, {"key": "UNI-35752", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_tar_6mp[hevc-ramp-aware-p2p]", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (Taranaki 6MP, 3200x1800) [hevc-ramp-aware-p2p]", "desc": "Feature: Live Streaming Quality\n    Scenario Outline: Validate the Taranaki 6MP main stream (3200x1800) for <scenario>\n        Given the device is a Taranaki 6MP camera and is online\n        When I start the WebRTC viewer session(s) for <scenario>\n        And I switch the session(s) to the main stream\n        Then video stats should show resolution >= 1800p (6MP main stream)\n        And the bitrate should be between 3000-8000 kbps\n        And packets should be received successfully\n        And H.265 scenarios should still be negotiated as H265 after the switch\n\n    Examples: p2p | p2p-3-sessions | turn | turn-3-sessions | ramp-aware-p2p |\n              hevc-ramp-aware-p2p | hevc-p2p-3-sessions\n\n\nParameter ID: hevc-ramp-aware-p2p\nParameter values: {\"scenario\": \"hevc-ramp-aware-p2p\"}", "cls": "automated", "labels": ["FWTC_WebRTC", "FWTC_Bitrate", "FWTC_VideoCodec", "FWTC_VideoResolution"], "primary": "FWTC_WebRTC", "other": ["Tar_FW_TestCase", "automated"], "why": "Ramp-aware P2P Taranaki 6MP main stream negotiated as H265: asserts packets, H265 codec, minimum 1800p height and bitrate window", "unknown": []}, {"key": "UNI-35751", "uid": "fenix-tests/cloud/test_live_streaming.py::TestLiveStreamingQuality::test_live_streaming_main_stream_tar_6mp[p2p-3-sessions]", "file": "cloud/test_live_streaming.py", "title": "Live Streaming: Main Stream (Taranaki 6MP, 3200x1800) [p2p-3-sessions]", "desc": "Feature: Live Streaming Quality\n    Scenario Outline: Validate the Taranaki 6MP main stream (3200x1800) for <scenario>\n        Given the device is a Taranaki 6MP camera and is online\n        When I start the WebRTC viewer session(s) for <scenario>\n        And I switch the session(s) to the main stream\n        Then video stats should show resolution >= 1800p (6MP main stream)\n        And the bitrate should be between 3000-8000 kbps\n        And packets should be received successfully\n        And H.265 scenarios should still be negotiated as H265 after the switch\n\n    Examples: p2p | p2p-3-sessions | turn | turn-3-sessions | ramp-aware-p2p |\n              hevc-ramp-aware-p2p | hevc-p2p-3-sessions\n\n\nParameter ID: p2p-3-sessions\nParameter values: {\"scenario\": \"p2p-3-sessions\"}", "cls": "automated", "labels": ["FWTC_ConcurrentStreams", "FWTC_Bitrate", "FWTC_VideoResolution", "FWTC_WebRTC"], "primary": "FWTC_ConcurrentStreams", "other": [
