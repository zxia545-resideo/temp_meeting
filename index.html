en I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And /home/root/recording_schedule.json, read over SSH, should contain those 3 schedules", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the spec example schedule list is ACKed with error=0 and persisted to recording_schedule.json.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35314", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_wire_topic_constants", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Wire: Topic and ACK Constants Are Stable", "desc": "Feature: Recording Schedule Wire Contract\nScenario: Topic constants are stable\n    Given the firmware listens on \"@/VideoDataManager/RecordingScheduleConfig\"\n    And replies on \"@/ACK/VideoDataManager/RecordingScheduleConfig\"\n    When I read the topic constants from VideoDataManagerTopics without publishing anything\n    Then VDM_RECORDING_SCHEDULE_CONFIG equals \"VideoDataManager/RecordingScheduleConfig\" (client adds \"@/\")\n    And VDM_RECORDING_SCHEDULE_CONFIG_ACK equals \"@/ACK/VideoDataManager/RecordingScheduleConfig\"\n    And the path is one segment \"RecordingScheduleConfig\" (not \"RecordingSchedule/Config\")", "cls": "automated", "labels": ["FWTC_MQTT"], "primary": "FWTC_MQTT", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Only asserts client-side MQTT topic constants; no firmware behavior is exercised, so no feature label fits.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35119", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_01_query_storage_information", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Storage Query: Retrieve SD Card and Internal Storage Information", "desc": "Feature: SDCardManager Storage Query\nScenario: Query storage information and validate response schema\n    Given the camera is accessible via MQTT\n    And I subscribe to \"@/SDCardManager\"\n    When I publish an empty payload to \"@/GET/SDCardManager\"\n    Then I receive the storage information payload on \"@/SDCardManager\"\n    And the \"storage\" list is non-empty and each entry has the expected fields (type SD_CARD or INTERNAL)\n    And the \"@/SDCardManager\" response is observed through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCardSupport", "FWTC_MQTT"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the MQTT storage query returns SD card and internal storage information.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35121", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_02_register_and_unregister_storage_user", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Storage User Lifecycle: Register and Unregister Storage User", "desc": "Feature: SDCardManager Storage User Lifecycle\nScenario: Register and unregister a storage user\n    Given the camera is accessible via MQTT\n    When I publish {\"user\": \"ATS_SD_USER_<epoch>\", \"register\": true} to \"@/SDM/RegisterUser\"\n    And I publish {\"user\": \"ATS_SD_USER_<epoch>\", \"register\": false} to \"@/SDM/RegisterUser\"\n    Then the MQTT monitor API and SQL-backed history query show both commands on \"@/SDM/RegisterUser\"\n    And no ACK topic is checked because RegisterUser is fire-and-forget", "cls": "automated", "labels": ["FWTC_SDCardSupport", "FWTC_MQTT"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a storage user can be registered and unregistered over MQTT.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35126", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_03_observe_storage_available_and_send_ack", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Storage Availability: Observe Retained Event and Send ACK", "desc": "Feature: SDCardManager Storage Availability Event Handling\nScenario: Receive storage availability event and publish ACK\n    Given the camera is accessible via MQTT\n    And I register user \"ATS_SD_ACK_<epoch>\" with \"register\": true on \"@/SDM/RegisterUser\"\n    When I subscribe to the retained topic \"@/SDM/StorageAvailable\"\n    Then I receive a payload with a boolean \"available\" field (fallback: last 600 s of MQTT history)\n    And a monitor API lookup of \"@/SDM/StorageAvailable\" is attached (non-fatal if absent)\n    When I publish {\"user\": \"ATS_SD_ACK_<epoch>\"} to \"@/ACK/SDM/StorageAvailable\"\n    Then the MQTT monitor API and SQL-backed history query show the ACK on \"@/ACK/SDM/StorageAvailable\"\n    And cleanup unregisters the user with \"register\": false on \"@/SDM/RegisterUser\"", "cls": "automated", "labels": ["FWTC_SDCardSupport", "FWTC_MQTT"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the retained storage-available event is published and can be acknowledged.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35122", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_04_format_with_invalid_storage_id_returns_error", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Request Validation: Reject Invalid Storage ID", "desc": "Feature: SDCardManager Format Request Validation\nScenario: Send format request with invalid storage ID\n    Given the camera is accessible via MQTT\n    When I publish {\"storageId\": \"INVALID-SD-ID-<epoch>\"} to \"@/SDM/Format\"\n    Then the camera publishes a format response on \"@/VXMH/FormatResponse\" or \"@/ACK/SDM/Format\"\n    And that response payload (VXMH preferred) contains \"error\" (case-insensitive)\n    And responses are looked up through MQTT monitor API and SQL-backed history query within 35 s", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a format request with an invalid storage ID is rejected with an error.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35120", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_05_format_with_valid_storage_id_success", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Success: Valid SD Card ID Completes with Success", "desc": "Feature: SDCardManager Format Happy Path\nScenario: Format SD card with valid storage ID\n    Given the camera is accessible via MQTT\n    And an SD_CARD storageId is read from \"@/SDCardManager\" after publishing to \"@/GET/SDCardManager\"\n    When I publish {\"storageId\": \"<SD card storageId>\"} to \"@/SDM/Format\"\n    Then I observe format responses on \"@/VXMH/FormatResponse\"\n    And a SUCCESS status is observed on \"@/VXMH/FormatResponse\" within 360 s\n    And \"@/ACK/SDM/Format\" messages are attached as evidence only\n    And message observation is verified through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a format request with the valid SD storage ID completes with SUCCESS.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35123", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_06_post_format_query_consistency", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Consistency: Query Storage After Format Completion", "desc": "Feature: SDCardManager Post-Format Consistency\nScenario: Verify storage status after successful format\n    Given a successful SD format operation has completed\n    When I publish an empty payload to \"@/GET/SDCardManager\"\n    Then I receive the storage information payload on \"@/SDCardManager\"\n    And the SD_CARD entry exists and reports a boolean isFormatted\n    And its status, if reported, is SUCCESS or NOP (SUCCESS requires isFormatted = true)\n    And the \"@/SDCardManager\" response is observed through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts storage query results are consistent after format completion.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35127", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_07_format_missing_storage_id_returns_error", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Validation: Missing storageId Returns Error", "desc": "Feature: SDCardManager Format Payload Validation\nScenario: Send format request JSON without storageId\n    Given the camera is accessible via MQTT\n    When I publish {\"requestId\": \"missing-storage-id\"} to \"@/SDM/Format\"\n    Then the camera publishes a payload containing \"ERROR\" on \"@/VXMH/FormatResponse\" within 40 s\n    And message observation is verified through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a format request missing storageId returns an error.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35128", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_08_format_invalid_json_payload_no_success", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Validation: Invalid JSON Payload Returns Error", "desc": "Feature: SDCardManager Format Payload Validation\nScenario: Send format request with invalid JSON payload\n    Given the camera is accessible via MQTT\n    When I publish the malformed JSON '{\"storageId\":' to \"@/SDM/Format\"\n    Then no SUCCESS status appears on \"@/VXMH/FormatResponse\" within the 40 s window (no reply also passes)\n    And \"@/ACK/SDM/Format\" messages are attached as evidence only\n    And message observation is verified through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an invalid JSON format payload never yields SUCCESS.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35124", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_09_duplicate_format_requests_single_success", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format Concurrency: Rapid Duplicate Requests Do Not Produce Multiple Success", "desc": "Feature: SDCardManager Format Concurrency Behavior\nScenario: Send duplicate format requests in rapid succession\n    Given the camera is accessible via MQTT\n    And an SD_CARD storageId is read from \"@/SDCardManager\" after publishing to \"@/GET/SDCardManager\"\n    When I publish {\"storageId\": \"<SD card storageId>\"} to \"@/SDM/Format\" twice, 1 s apart\n    Then at least one format response appears on \"@/VXMH/FormatResponse\" or \"@/ACK/SDM/Format\"\n    And exactly one SUCCESS status is counted across both topics (VXMH polled up to 420 s)\n    And message observation is verified through MQTT monitor API and SQL-backed history query", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts rapid duplicate format requests do not produce multiple SUCCESS responses.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35125", "uid": "fenix-tests/camera_system/test_mqtt_sdcardmanager_features.py::TestSDCardManagerFeatures::test_10_format_registered_user_ack_coordination", "file": "camera_system/test_mqtt_sdcardmanager_features.py", "title": "Format User Coordination: Registered User ACK Flow During Format", "desc": "Feature: SDCardManager Registered User Coordination\nScenario: Registered user publishes ACK during active format window\n    Given the camera is accessible via MQTT\n    And an SD_CARD storageId is read from \"@/SDCardManager\" after publishing to \"@/GET/SDCardManager\"\n    And I register user \"ATS_SD_COORD_<epoch>\" with \"register\": true on \"@/SDM/RegisterUser\"\n    When I publish {\"storageId\": \"<SD card storageId>\"} to \"@/SDM/Format\"\n    Then an \"available\": false event on \"@/SDM/StorageAvailable\", if emitted within 45 s, is attached\n    And I publish {\"user\": \"ATS_SD_COORD_<epoch>\"} to \"@/ACK/SDM/StorageAvailable\"\n    And the MQTT monitor API and SQL-backed history query show the ACK on \"@/ACK/SDM/StorageAvailable\"\n    And cleanup unregisters the user with \"register\": false on \"@/SDM/RegisterUser\"", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_MQTT"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts registered storage users are coordinated via ACKs during format.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35129", "uid": "fenix-tests/camera_system/test_mqtt_triggermanager_features.py::TestTriggerManagerFeatures::test_01_configure_roi_zones", "file": "camera_system/test_mqtt_triggermanager_features.py", "title": "ROI Configuration: Configure Multiple Detection Zones", "desc": "Feature: ROI Configuration\nScenario: Configure multiple ROI zones for object and motion detection\n    Given the camera is accessible via MQTT\n    When I publish 2 ROI zones with different detection classes to \"@/TriggerManager/ZoneConfig/RoI/add\"\n    Then the MQTT monitor API records an ACK on \"@/ACK/TriggerManager/ZoneConfig/RoI/add\" with error code 0\n    And querying \"@/GET/TriggerManager\" returns the configuration on \"@/TriggerManager\"\n    And its motionDetect.ROIfilter matches both zones' enabled flag, geometry, events and thresholds", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_MQTT", "FWTC_MotionDetection"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts multiple ROI zones (geometry, event flags, thresholds) are ACKed and read back from TriggerManager motionDetect config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35130", "uid": "fenix-tests/camera_system/test_mqtt_triggermanager_features.py::TestTriggerManagerFeatures::test_02_configure_single_roi", "file": "camera_system/test_mqtt_triggermanager_features.py", "title": "ROI Configuration: Configure Single Full-Frame Detection Zone", "desc": "Feature: ROI Configuration\nScenario: Configure a single ROI zone covering the entire frame\n    Given the camera is accessible via MQTT\n    When I publish 1 ROI zone covering the full frame to \"@/TriggerManager/ZoneConfig/RoI/add\"\n    And the zone enables person, vehicle, animal, package and motion events\n    Then the MQTT monitor API records an ACK on \"@/ACK/TriggerManager/ZoneConfig/RoI/add\" with error code 0\n    And querying \"@/GET/TriggerManager\" returns the configuration on \"@/TriggerManager\"\n    And its motionDetect.ROIfilter matches the full-frame zone's enabled flag, geometry, events and thresholds", "cls": "automated", "labels": ["FWTC_DetectionAreas", "FWTC_MQTT", "FWTC_MotionDetection"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a single full-frame ROI zone is ACKed and read back from TriggerManager motionDetect config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35139", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestPrivacyModeStress::test_01_privacy_mode_toggle_stress", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Privacy Mode Stress Testing: 50 Toggle Iterations (PrivacyMode topic)", "desc": "Feature: Privacy Mode Stability Under Stress (legacy PrivacyMode topic)\nScenario: Toggle privacy mode 50 times via the legacy PrivacyMode topic and monitor system health\n    Given Stream.CameraModeState is \"home\", set via \"@/VideoDataManager/Stream/CameraModeState\" if needed\n    And VideoDataManager, TriggerManager and ProcessMonitor appear in SSH \"ps aux\" output\n    When I publish \"1\" and \"0\" alternately to \"@/VideoDataManager/Stream/PrivacyMode\" 50 times\n    Then each toggle receives an ACK on \"@/ACK/VideoDataManager/Stream/PrivacyMode\" with error code 0\n    And after each toggle \"@/GET/VideoDataManager\" reports Stream.CameraModeState \"privacy\" or \"home\"\n    And the three processes still appear in SSH \"ps aux\" after every toggle and at the end", "cls": "automated", "labels": ["FWTC_PrivacyMode", "FWTC_MQTT"], "primary": "FWTC_PrivacyMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts 50 consecutive privacy mode toggles are each ACKed and applied.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35131", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_01_enable_privacy_mode", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Privacy Mode Control: Enable Privacy Mode (PrivacyMode topic)", "desc": "Feature: Privacy Mode Control (legacy PrivacyMode topic)\nScenario: Enable privacy mode via the legacy PrivacyMode topic\n    Given the camera is accessible via MQTT\n    When I publish \"1\" to \"@/VideoDataManager/Stream/PrivacyMode\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/PrivacyMode\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.CameraModeState = \"privacy\"", "cls": "automated", "labels": ["FWTC_PrivacyMode", "FWTC_MQTT"], "primary": "FWTC_PrivacyMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts enabling privacy mode via MQTT is ACKed and reflected in config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35137", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_02_disable_privacy_mode", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Privacy Mode Control: Disable Privacy Mode (PrivacyMode topic)", "desc": "Feature: Privacy Mode Control (legacy PrivacyMode topic)\nScenario: Disable privacy mode via the legacy PrivacyMode topic\n    Given the camera is accessible via MQTT\n    And Stream.CameraModeState is \"privacy\", set via \"@/VideoDataManager/Stream/CameraModeState\" if needed\n    When I publish \"0\" to \"@/VideoDataManager/Stream/PrivacyMode\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/PrivacyMode\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.CameraModeState = \"home\"", "cls": "automated", "labels": ["FWTC_PrivacyMode", "FWTC_MQTT"], "primary": "FWTC_PrivacyMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts disabling privacy mode via MQTT is ACKed and reflected in config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35138", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_03_set_audio_volume_levels", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Audio Volume Control: Set Multiple Volume Levels", "desc": "Feature: Audio Volume Control\nScenario: Set audio volume to multiple levels via the Stream/Audio/Volume topic\n    Given the camera is accessible via MQTT\n    When I publish each volume level \"40\", \"48\" and \"56\" to \"@/VideoDataManager/Stream/Audio/Volume\"\n    Then each level receives an ACK on \"@/ACK/VideoDataManager/Stream/Audio/Volume\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.Audio.Volume equal to each published level", "cls": "automated", "labels": ["FWTC_Microphone", "FWTC_MQTT"], "primary": "FWTC_Microphone", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each microphone Stream.Audio.Volume level is ACKed and reported in config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35135", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_04_set_audio_to_invalid_value", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Audio Volume Control: Set Invalid Volume Values", "desc": "Feature: Audio Volume Control - Invalid Input Handling\nScenario: Attempt to set invalid audio volume values via the Stream/Audio/Volume topic\n    Given the camera is accessible via MQTT\n    And querying \"@/GET/VideoDataManager\" records the baseline Stream.Audio.Volume\n    When I publish each invalid volume \"-10\" and \"150\" to \"@/VideoDataManager/Stream/Audio/Volume\"\n    Then each value receives an ACK on \"@/ACK/VideoDataManager/Stream/Audio/Volume\" with an integer error\n    And querying \"@/GET/VideoDataManager\" reports Stream.Audio.Volume unchanged from the baseline\n    And none of the invalid-volume ACKs reports error code 0", "cls": "automated", "labels": ["FWTC_Microphone", "FWTC_MQTT"], "primary": "FWTC_Microphone", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts invalid microphone volume values are rejected and config stays unchanged.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35134", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_05_set_stream_quality_levels", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Stream Quality Control: Set Low and High Quality", "desc": "Feature: Stream Quality Control\nScenario: Set stream quality to low and high via the StreamQuality topic\n    Given the camera is accessible via MQTT\n    When I publish \"low\" to \"@/VideoDataManager/StreamQuality\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/StreamQuality\" with error code 0\n    And querying \"@/GET/VideoDataManager\" returns advancedVideoConfig\n    And its continuous and events video geometry is 1920x1080 with quality \"medium\"\n    When I publish \"high\" to \"@/VideoDataManager/StreamQuality\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/StreamQuality\" with error code 0\n    And querying \"@/GET/VideoDataManager\" returns advancedVideoConfig\n    And its continuous and events video geometry is 3840x2160 with quality \"high\"", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_MQTT"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts low/high stream quality settings are ACKed and reflected in config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35133", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_06_set_privacy_mode", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Camera Mode Control: Set Privacy Mode (CameraModeState topic)", "desc": "Feature: Camera Mode Control (CameraModeState topic)\nScenario: Set privacy mode via the CameraModeState topic\n    Given the camera is accessible via MQTT\n    When I publish \"privacy\" to \"@/VideoDataManager/Stream/CameraModeState\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/CameraModeState\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.CameraModeState = \"privacy\"", "cls": "automated", "labels": ["FWTC_PrivacyMode", "FWTC_MQTT"], "primary": "FWTC_PrivacyMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts setting privacy via the CameraModeState topic is ACKed and applied.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35140", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_07_set_home_mode", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Camera Mode Control: Set Home Mode", "desc": "Feature: Camera Mode Control (CameraModeState topic)\nScenario: Set home mode via the CameraModeState topic\n    Given the camera is accessible via MQTT\n    When I publish \"home\" to \"@/VideoDataManager/Stream/CameraModeState\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/CameraModeState\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.CameraModeState = \"home\"", "cls": "automated", "labels": ["FWTC_ArmMode", "FWTC_MQTT"], "primary": "FWTC_ArmMode", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts setting Home camera mode is ACKed and applied.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35132", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_07_set_video_rotation", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Video Rotation Control: Enable and Disable Video Rotation", "desc": "Feature: Video Rotation Control\nScenario: Enable and disable video rotation via the Stream/Video topic\n    Given Stream.CameraModeState is \"home\", set via \"@/VideoDataManager/Stream/CameraModeState\" if needed\n    And querying \"@/GET/VideoDataManager\" provides the current Stream.Video geometry and crop\n    When I publish a video JSON payload (geometry, crop, Rotate180 true) to \"@/VideoDataManager/Stream/Video\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/Video\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.Video.Rotate180 = 1\n    When I publish the same payload with Rotate180 false to \"@/VideoDataManager/Stream/Video\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/Stream/Video\" with error code 0\n    And querying \"@/GET/VideoDataManager\" reports Stream.Video.Rotate180 = 0", "cls": "automated", "labels": ["FWTC_RotateVideo", "FWTC_MQTT"], "primary": "FWTC_RotateVideo", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts video rotation enable/disable is ACKed and reflected in config.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35136", "uid": "fenix-tests/camera_system/test_mqtt_videodatamanager_features.py::TestVideoDataManagerFeatures::test_08_request_snapshot", "file": "camera_system/test_mqtt_videodatamanager_features.py", "title": "Manual Snapshot Capture: Request Snapshot", "desc": "Feature: Manual Snapshot Capture\nScenario: Request a manual snapshot via the CaptureSnapshot topic\n    Given the camera is accessible via MQTT\n    When I publish a JSON payload with a filepath and quality 90 to \"@/VideoDataManager/CaptureSnapshot\"\n    Then the command is published successfully\n    And a message appears on \"@/UMH/ClipManager/MediaUpload\" in the MQTT history within 90 seconds", "cls": "automated", "labels": ["FWTC_Snapshot", "FWTC_MQTT"], "primary": "FWTC_Snapshot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a manual snapshot request over MQTT is ACKed and a snapshot is produced.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35465", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_clock_advances", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Clock Advances Between Snapshots", "desc": "BDD Scenario: The Overlay Clock Advances\n\nGIVEN a camera with the timestamp watermark enabled\nWHEN I capture two snapshots a few seconds apart\nTHEN both timestamps should be readable\nAND the second timestamp should be later than the first", "cls": "automated", "labels": ["FWTC_Timestamp", "FWTC_Snapshot"], "primary": "FWTC_Timestamp", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the OCR-read overlay timestamp advances between two snapshots.", "unknown": []}, {"key": "UNI-35632", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_watermarks_rendered[time_12h_logo_on]", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Watermarks Are Rendered As Configured [time_12h_logo_on]", "desc": "BDD Scenario: Overlay Watermarks Are Rendered As Configured\n\n    GIVEN a camera that is online and capturing\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    AND I capture a snapshot\n    THEN the logo watermark should be visible only when the logo is enabled\n    AND the timestamp watermark should be readable only when time is enabled\n    AND the timestamp should use the requested 12h or 24h format\n    AND the grey band behind the timestamp should appear and disappear with it\n\n\nParameter ID: time_12h_logo_on\nParameter values: {\"case_name\": \"time_12h_logo_on\", \"logo_enabled\": true, \"time_enabled\": true, \"time_format\": \"12h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_Snapshot", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts logo visibility, timestamp OCR presence/12h-24h format and grey band in a snapshot match the overlay configuration.", "unknown": []}, {"key": "UNI-35634", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_watermarks_rendered[time_24h_logo_off]", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Watermarks Are Rendered As Configured [time_24h_logo_off]", "desc": "BDD Scenario: Overlay Watermarks Are Rendered As Configured\n\n    GIVEN a camera that is online and capturing\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    AND I capture a snapshot\n    THEN the logo watermark should be visible only when the logo is enabled\n    AND the timestamp watermark should be readable only when time is enabled\n    AND the timestamp should use the requested 12h or 24h format\n    AND the grey band behind the timestamp should appear and disappear with it\n\n\nParameter ID: time_24h_logo_off\nParameter values: {\"case_name\": \"time_24h_logo_off\", \"logo_enabled\": false, \"time_enabled\": true, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Timestamp", "FWTC_Snapshot", "FWTC_Watermark"], "primary": "FWTC_Timestamp", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts logo visibility, timestamp OCR presence/12h-24h format and grey band in a snapshot match the overlay configuration.", "unknown": []}, {"key": "UNI-35461", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_watermarks_rendered[time_24h_logo_on]", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Watermarks Are Rendered As Configured [time_24h_logo_on]", "desc": "BDD Scenario: Overlay Watermarks Are Rendered As Configured\n\n    GIVEN a camera that is online and capturing\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    AND I capture a snapshot\n    THEN the logo watermark should be visible only when the logo is enabled\n    AND the timestamp watermark should be readable only when time is enabled\n    AND the timestamp should use the requested 12h or 24h format\n    AND the grey band behind the timestamp should appear and disappear with it\n\n\nParameter ID: time_24h_logo_on\nParameter values: {\"case_name\": \"time_24h_logo_on\", \"logo_enabled\": true, \"time_enabled\": true, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_Snapshot", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts logo visibility, timestamp OCR presence/12h-24h format and grey band in a snapshot match the overlay configuration.", "unknown": []}, {"key": "UNI-35635", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_watermarks_rendered[time_off_logo_off]", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Watermarks Are Rendered As Configured [time_off_logo_off]", "desc": "BDD Scenario: Overlay Watermarks Are Rendered As Configured\n\n    GIVEN a camera that is online and capturing\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    AND I capture a snapshot\n    THEN the logo watermark should be visible only when the logo is enabled\n    AND the timestamp watermark should be readable only when time is enabled\n    AND the timestamp should use the requested 12h or 24h format\n    AND the grey band behind the timestamp should appear and disappear with it\n\n\nParameter ID: time_off_logo_off\nParameter values: {\"case_name\": \"time_off_logo_off\", \"logo_enabled\": false, \"time_enabled\": false, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_Snapshot", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts logo visibility, timestamp OCR presence/12h-24h format and grey band in a snapshot match the overlay configuration.", "unknown": []}, {"key": "UNI-35633", "uid": "fenix-tests/camera_system/test_overlay_watermark_visual.py::TestOverlayWatermarkVisual::test_overlay_watermarks_rendered[time_off_logo_on]", "file": "camera_system/test_overlay_watermark_visual.py", "title": "Overlay Watermarks Are Rendered As Configured [time_off_logo_on]", "desc": "BDD Scenario: Overlay Watermarks Are Rendered As Configured\n\n    GIVEN a camera that is online and capturing\n    WHEN I apply an overlay configuration for the time and logo watermarks\n    AND I capture a snapshot\n    THEN the logo watermark should be visible only when the logo is enabled\n    AND the timestamp watermark should be readable only when time is enabled\n    AND the timestamp should use the requested 12h or 24h format\n    AND the grey band behind the timestamp should appear and disappear with it\n\n\nParameter ID: time_off_logo_on\nParameter values: {\"case_name\": \"time_off_logo_on\", \"logo_enabled\": true, \"time_enabled\": false, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_Snapshot", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts logo visibility, timestamp OCR presence/12h-24h format and grey band in a snapshot match the overlay configuration.", "unknown": []}, {"key": "UNI-34449", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_01_sd_card_insertion", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-HP-01: Card Insertion Detection and Reporting", "desc": "Feature: SD Card Hot-Plugging - Insertion Detection\nAs a camera system operator\nI want the system to detect and report SD card insertion events\nSo that the device can automatically mount and begin using the storage\n\nScenario: Detect and report SD card insertion with cloud event\n    Given the camera device is powered on and accessible\n      And the SD card MMC ID has been identified\n    When I remove the SD card from the device\n      And I wait for SD_CARD_REMOVED event confirmation\n      And I re-insert the SD card into the device\n    Then the system should detect the SD card insertion\n      And send a Storage.Event with event type SD_CARD_ADDED\n      And include correct storageId, capacity, and isFormatted status\n      And create the mount point for SD card access\n      And the mount point should be accessible for file operations", "cls": "automated", "labels": ["FWTC_SDCardSupport"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD_CARD_ADDED is reported and the mount point is created on insertion.", "unknown": []}, {"key": "UNI-34450", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_02_sd_card_removal", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-HP-02: Card Removal Detection and Reporting", "desc": "Feature: SD Card Hot-Plugging - Removal Detection\nAs a camera system operator\nI want the system to detect and report SD card removal events\nSo that the device can gracefully handle the loss of storage\n\nScenario: Detect and report SD card removal with cloud event\n    Given the SD card is currently inserted and mounted\n      And the MMC ID is available from previous operations\n    When I physically remove the SD card from the device\n      And wait for the system to detect the removal\n    Then the system should detect the SD card removal\n      And send a Storage.Event with event type SD_CARD_REMOVED\n      And the mount point should become inaccessible\n      And no media files should be accessible at the mount path\n      And the SD card is re-inserted for subsequent tests", "cls": "automated", "labels": ["FWTC_SDCardSupport"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD_CARD_REMOVED is reported and the mount point becomes inaccessible on removal.", "unknown": []}, {"key": "UNI-34451", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_03_sd_card_state_after_reboot", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-HP-03: Card State After Reboot", "desc": "Feature: SD Card State Persistence After Reboot\nAs a camera system operator\nI want the SD card to be automatically remounted after device reboot\nSo that recording functionality resumes without manual intervention\n\nScenario: Verify SD card state persistence across system reboot\n    Given the SD card is currently inserted and mounted\n      And the MMC ID has been identified\n      And media files exist on the SD card\n    When I initiate a camera device reboot\n      And wait for the reboot to complete\n      And allow time for system initialization\n    Then the SD card should be automatically remounted\n      And the mount point should be accessible\n      And existing media files should remain intact\n      And the camera should resume normal recording operations", "cls": "automated", "labels": ["FWTC_SDCardSupport", "FWTC_Reboot"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the SD card is remounted after a camera reboot.", "unknown": []}, {"key": "UNI-34452", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_04_sd_card_format_success", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-01: Successful Format (Happy Path)", "desc": "Feature: SD Card Formatting - Successful Operation\nAs a camera system operator\nI want to format the SD card to erase all data and reset the file system\nSo that I can start with a clean storage state\n\nScenario: Execute complete SD card format operation successfully\n    Given the SD card is inserted and mounted\n      And the storage ID (CID) is available\n    When I send a format request via Unicorn service\n      And wait for the format operation to complete\n    Then I should receive multiple Storage.Format.Response messages with FORMATTING status\n      And receive a final Storage.Format.Response with SUCCESS status and progress 100\n      And all Storage.Format.Response messages should contain a valid storageId\n      And the storageId should match the requested storage ID\n      And receive a Storage.Event with event type SD_CARD_FORMATTED\n      And the isFormatted field should be True\n      And the mount path should be recreated\n      And all previous files should be erased from the SD card", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_SDCardSupport"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts format SUCCESS responses, SD_CARD_FORMATTED event and recreated mount path.", "unknown": []}, {"key": "UNI-34453", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_05_sd_card_format_no_card", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-03: Format Failure (No Card)", "desc": "Feature: SD Card Formatting - Error Handling for Missing Card\nAs a camera system operator\nI want the system to gracefully handle format requests when no card is present\nSo that appropriate error messages are provided\n\nScenario: Attempt to format when SD card is not present\n    Given the SD card is inserted\n      And I read and validate its current storage ID (CID) before removal\n    When I simulate SD card removal by unbinding its block device driver\n      And I send a format request using the old storage ID\n    Then a Storage.Format.Response should be received with status ERROR\n      And progress should remain at 0\n      And an error message should indicate the card is not present or mismatched\n      And system stability (no crash) is maintained\n      And I re-insert the SD card for subsequent tests\n      And the mount path is restored and accessible", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_SDCardSupport"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a format request without a card returns an error and the card remounts after reinsertion.", "unknown": []}, {"key": "UNI-34454", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_06_sd_card_format_busy", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-02: Format Failure (Card in Use)", "desc": "Feature: SD Card Formatting - Error Handling for Busy Card\nAs a camera system operator\nI want the system to prevent formatting when the card is in use\nSo that data integrity is maintained and active operations are not interrupted\n\nScenario: Attempt to format SD card while it is busy\n    Given the SD card is inserted and mounted\n      And the storage ID is available\n    When I create a process that holds the SD card mount busy\n      And verify the mount is locked by the process\n      And send a format request via Unicorn service\n    Then the system should attempt to unmount the card and fail\n      And I should receive a Storage.Format.Response with ERROR status\n      And the error message should indicate the card is busy or in use\n      And the busy process should be cleaned up successfully\n      And the system should remain stable without crashes", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts formatting a card held busy by a process returns an error response.", "unknown": []}, {"key": "UNI-34455", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_07_rapid_format_requests", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-ST-01: Rapid Format Requests", "desc": "Feature: SD Card Formatting - Stress Testing with Rapid Requests\nAs a camera system operator\nI want the system to handle multiple rapid format requests safely\nSo that race conditions and system instability are prevented\n\nScenario: Send multiple format requests in rapid succession\n    Given the SD card is inserted and formatted\n      And the storage ID is available\n    When I send 3 format requests rapidly with 2-second intervals\n      And wait for all format operations to complete\n      And fetch all format response events from the cloud\n    Then I should receive responses for all format requests\n      And there should be multiple FORMATTING status messages\n      And there should be at most one SUCCESS status message\n      And subsequent requests may result in ERROR responses\n      And the system should remain stable without crashes\n      And the SD card should end up in a valid formatted state", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts rapid repeated format requests produce consistent status responses.", "unknown": []}, {"key": "UNI-34693", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_08_format_interruption_by_reboot", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-04: Format Interruption by Reboot and Recovery", "desc": "Feature: SD Card Formatting - Interruption and Recovery After Reboot\nAs a camera system operator\nI want the system to handle format interruption by reboot gracefully\nSo that I can resume formatting after device restart\n\nScenario: Format interrupted by reboot, verify NOP status, and resume formatting\n    Given the SD card is inserted and mounted\n      And the storage ID (CID) is available\n    When I send a format request via Unicorn service\n      And wait for format progress to reach 0%\n      And reboot the camera during formatting\n      And wait for camera to boot up and send CheckIn message\n    Then the CheckIn message should show SD card with status NOP\n      And isFormatted should be false\n    When I re-trigger the format request\n      And wait for format to complete successfully\n      And trigger QoS to get updated CheckIn message\n    Then the CheckIn message should show SD card with SUCCESS status\n      And isFormatted should be true\n      And the SD card should be in a valid formatted state", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_CheckIn", "FWTC_Interrupts"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a reboot during format leaves NOP/SUCCESS status in CheckIn and a re-issued format completes.", "unknown": []}, {"key": "UNI-34694", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_09_multiple_sd_card_format_requests[0]", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-06: Multiple Sequential Format Requests [0]", "desc": "Feature: SD Card Formatting - Multiple Sequential Format Operations\n        As a camera system operator\n        I want to format the SD card multiple times in succession\n        So that I can verify the system handles repeated format operations reliably\n\n        Scenario: Execute multiple format operations sequentially (5 iterations)\n            Given the device is online with a mounted, valid SD card\n            When I trigger QoS to get Camera.CheckIn event\n              And extract the SD card storage ID from CheckIn\n              And send a format request using the extracted storage ID\n            Then the format should complete successfully\n              And I should receive Storage.Event with SD_CARD_FORMATTED\n              And the event should contain type=SD_CARD\n              And storageId should match the request\n              And isFormatted should be true\n            When I repeat this process 5 times\n            Then each iteration should complete successfully\n              And the system should remain stable throughout all iterations\n\n\nParameter ID: 0\nParameter values: {\"iteration\": 0}", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each sequential format request completes with SUCCESS.", "unknown": []}, {"key": "UNI-35636", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_09_multiple_sd_card_format_requests[1]", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-06: Multiple Sequential Format Requests [1]", "desc": "Feature: SD Card Formatting - Multiple Sequential Format Operations\n        As a camera system operator\n        I want to format the SD card multiple times in succession\n        So that I can verify the system handles repeated format operations reliably\n\n        Scenario: Execute multiple format operations sequentially (5 iterations)\n            Given the device is online with a mounted, valid SD card\n            When I trigger QoS to get Camera.CheckIn event\n              And extract the SD card storage ID from CheckIn\n              And send a format request using the extracted storage ID\n            Then the format should complete successfully\n              And I should receive Storage.Event with SD_CARD_FORMATTED\n              And the event should contain type=SD_CARD\n              And storageId should match the request\n              And isFormatted should be true\n            When I repeat this process 5 times\n            Then each iteration should complete successfully\n              And the system should remain stable throughout all iterations\n\n\nParameter ID: 1\nParameter values: {\"iteration\": 1}", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each sequential format request completes with SUCCESS.", "unknown": []}, {"key": "UNI-35637", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_09_multiple_sd_card_format_requests[2]", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-06: Multiple Sequential Format Requests [2]", "desc": "Feature: SD Card Formatting - Multiple Sequential Format Operations\n        As a camera system operator\n        I want to format the SD card multiple times in succession\n        So that I can verify the system handles repeated format operations reliably\n\n        Scenario: Execute multiple format operations sequentially (5 iterations)\n            Given the device is online with a mounted, valid SD card\n            When I trigger QoS to get Camera.CheckIn event\n              And extract the SD card storage ID from CheckIn\n              And send a format request using the extracted storage ID\n            Then the format should complete successfully\n              And I should receive Storage.Event with SD_CARD_FORMATTED\n              And the event should contain type=SD_CARD\n              And storageId should match the request\n              And isFormatted should be true\n            When I repeat this process 5 times\n            Then each iteration should complete successfully\n              And the system should remain stable throughout all iterations\n\n\nParameter ID: 2\nParameter values: {\"iteration\": 2}", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each sequential format request completes with SUCCESS.", "unknown": []}, {"key": "UNI-35638", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_09_multiple_sd_card_format_requests[3]", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-06: Multiple Sequential Format Requests [3]", "desc": "Feature: SD Card Formatting - Multiple Sequential Format Operations\n        As a camera system operator\n        I want to format the SD card multiple times in succession\n        So that I can verify the system handles repeated format operations reliably\n\n        Scenario: Execute multiple format operations sequentially (5 iterations)\n            Given the device is online with a mounted, valid SD card\n            When I trigger QoS to get Camera.CheckIn event\n              And extract the SD card storage ID from CheckIn\n              And send a format request using the extracted storage ID\n            Then the format should complete successfully\n              And I should receive Storage.Event with SD_CARD_FORMATTED\n              And the event should contain type=SD_CARD\n              And storageId should match the request\n              And isFormatted should be true\n            When I repeat this process 5 times\n            Then each iteration should complete successfully\n              And the system should remain stable throughout all iterations\n\n\nParameter ID: 3\nParameter values: {\"iteration\": 3}", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each sequential format request completes with SUCCESS.", "unknown": []}, {"key": "UNI-35639", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_09_multiple_sd_card_format_requests[4]", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-06: Multiple Sequential Format Requests [4]", "desc": "Feature: SD Card Formatting - Multiple Sequential Format Operations\n        As a camera system operator\n        I want to format the SD card multiple times in succession\n        So that I can verify the system handles repeated format operations reliably\n\n        Scenario: Execute multiple format operations sequentially (5 iterations)\n            Given the device is online with a mounted, valid SD card\n            When I trigger QoS to get Camera.CheckIn event\n              And extract the SD card storage ID from CheckIn\n              And send a format request using the extracted storage ID\n            Then the format should complete successfully\n              And I should receive Storage.Event with SD_CARD_FORMATTED\n              And the event should contain type=SD_CARD\n              And storageId should match the request\n              And isFormatted should be true\n            When I repeat this process 5 times\n            Then each iteration should complete successfully\n              And the system should remain stable throughout all iterations\n\n\nParameter ID: 4\nParameter values: {\"iteration\": 4}", "cls": "automated", "labels": ["FWTC_SDCard_Format"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts each sequential format request completes with SUCCESS.", "unknown": []}, {"key": "UNI-34695", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_10_format_interruption_card_removal", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-07: Format Interruption (Card Removal) and Recovery", "desc": "Feature: SD Card Formatting - Interruption Handling via Card Removal\nAs a camera system operator\nI want the system to handle SD card removal during formatting gracefully\nSo that the system remains stable and the card can be recovered\n\nScenario: Format interrupted by physical card removal, verify state, and recover\n    Given the SD card is inserted and mounted\n      And the storage ID (CID) is available\n    When I send a format request via Unicorn service\n      And wait for formatting operation to begin\n      And physically remove the SD card during formatting\n    Then the system should detect the SD card removal\n      And send a Storage.Event with SD_CARD_REMOVED\n      And trigger CheckIn to verify SD card is NOT present in storage devices\n    When I re-insert the SD card\n    Then the system should detect the SD card insertion\n      And send a Storage.Event with SD_CARD_ADDED\n      And trigger CheckIn to verify SD card status is NOP\n      And verify isFormatted is False (format was interrupted)\n    When I re-trigger the format request\n    Then the format should complete successfully\n      And the SD card should be in a valid formatted state\n      And the system should remain stable", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_CheckIn", "FWTC_SDCardSupport"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts card removal during format is reported (absent, then NOP in CheckIn) and a reformat recovers.", "unknown": []}, {"key": "UNI-34860", "uid": "fenix-tests/camera_system/test_sd_card_format_reinsert.py::TestSDCardFormatReinsert::test_11_format_then_export", "file": "camera_system/test_sd_card_format_reinsert.py", "title": "SD-FMT-08: Export Cancellation After Format", "desc": "Feature: SD Card Formatting - Export Verification After Format\nAs a camera system operator\nI want to verify that requesting an export after formatting results in cancellation\nSo that I know the system correctly handles missing data\n\nScenario: Format SD card and then request export\n    Given the SD card is inserted and mounted\n      And the SD card contains footage (simulated by time)\n    When I format the SD card\n      And wait for a short duration\n    And I request an export for the last 3 minutes\n    Then the export should be accepted initially\n      And subsequent status updates should show isCanceled=True\n      And the cancellation reason should indicate missing data or remux failure\n    And the format operation should complete successfully\n      And the SD card should be in a valid formatted state", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_SDCard_ClipExport"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an export requested right after format is cancelled and the format completes.", "unknown": []}, {"key": "UNI-35016", "uid": "fenix-tests/camera_system/test_sd_card_known_issue.py::TestSDCardKnownIssue::test_01_format_retry_recovery_after_privacy_toggle[1]", "file": "camera_system/test_sd_card_known_issue.py", "title": "SD-KI-01: Format Retry Recovery After Privacy Toggle [1]", "desc": "Feature: SD Card Known Issue - Format Recovery\n        As a end user\n        I want the test to recover camera storage state even when first format fails\n        So that follow-up testcases always start from a healthy formatted state\n\n        Scenario: Toggle privacy mode and run format with recovery retry\n            Given SD card storage ID is available\n            When I enable privacy mode then disable privacy mode\n              And I request SD card format\n            Then the first format attempt may succeed or fail\n              And if first format fails, the test performs recovery by formatting again\n              And recovery format must reach SUCCESS to restore test environment\n\n\nParameter ID: 1\nParameter values: {\"iteration\": 1}", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_PrivacyMode"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD format reaches SUCCESS (first attempt or retry) after a privacy mode on/off toggle.", "unknown": []}, {"key": "UNI-35640", "uid": "fenix-tests/camera_system/test_sd_card_known_issue.py::TestSDCardKnownIssue::test_01_format_retry_recovery_after_privacy_toggle[2]", "file": "camera_system/test_sd_card_known_issue.py", "title": "SD-KI-01: Format Retry Recovery After Privacy Toggle [2]", "desc": "Feature: SD Card Known Issue - Format Recovery\n        As a end user\n        I want the test to recover camera storage state even when first format fails\n        So that follow-up testcases always start from a healthy formatted state\n\n        Scenario: Toggle privacy mode and run format with recovery retry\n            Given SD card storage ID is available\n            When I enable privacy mode then disable privacy mode\n              And I request SD card format\n            Then the first format attempt may succeed or fail\n              And if first format fails, the test performs recovery by formatting again\n              And recovery format must reach SUCCESS to restore test environment\n\n\nParameter ID: 2\nParameter values: {\"iteration\": 2}", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_PrivacyMode"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD format reaches SUCCESS (first attempt or retry) after a privacy mode on/off toggle.", "unknown": []}, {"key": "UNI-35641", "uid": "fenix-tests/camera_system/test_sd_card_known_issue.py::TestSDCardKnownIssue::test_01_format_retry_recovery_after_privacy_toggle[3]", "file": "camera_system/test_sd_card_known_issue.py", "title": "SD-KI-01: Format Retry Recovery After Privacy Toggle [3]", "desc": "Feature: SD Card Known Issue - Format Recovery\n        As a end user\n        I want the test to recover camera storage state even when first format fails\n        So that follow-up testcases always start from a healthy formatted state\n\n        Scenario: Toggle privacy mode and run format with recovery retry\n            Given SD card storage ID is available\n            When I enable privacy mode then disable privacy mode\n              And I request SD card format\n            Then the first format attempt may succeed or fail\n              And if first format fails, the test performs recovery by formatting again\n              And recovery format must reach SUCCESS to restore test environment\n\n\nParameter ID: 3\nParameter values: {\"iteration\": 3}", "cls": "automated", "labels": ["FWTC_SDCard_Format", "FWTC_PrivacyMode"], "primary": "FWTC_SDCard_Format", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD format reaches SUCCESS (first attempt or retry) after a privacy mode on/off toggle.", "unknown": []}, {"key": "UNI-34457", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_01_verify_sd_card_mount", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "SD Card Setup: Mount Point Validation", "desc": "Feature: SD Card Mount Point Validation\nScenario: Verify SD card mount point accessibility\n    Given the camera is reachable via SSH\n    And a candidate SD card mount path is configured or autodetected\n    When I check whether the mount directory exists\n    Then the SD card mount point should be present\n    And the path details are attached to the report", "cls": "automated", "labels": ["FWTC_SDCardSupport"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the SD card mount path exists on the camera.", "unknown": []}, {"key": "UNI-34458", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_02_assess_initial_space", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "SD Card Setup: Initial Space Assessment", "desc": "Feature: SD Card Baseline Space Assessment\nScenario: Capture baseline free space and media inventory\n    Given the SD card mount point is accessible\n    When I query available space\n    And I count media files and list the oldest ones\n    Then sufficient space (> reserve + 2 filler files) should be available\n    And baseline space and inventory are stored for later comparison", "cls": "automated", "labels": ["FWTC_SDCard_FIFO"], "primary": "FWTC_SDCard_FIFO", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts free SD space is readable and sufficient to set up the overwrite-oldest scenario.", "unknown": []}, {"key": "UNI-34459", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_03_fill_sd_card", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "SD Card Filling: Create Filler Files", "desc": "Feature: SD Card Capacity Saturation\nScenario: Fill SD card leaving approximately 500MB free\n    Given baseline free space and filler file size (60MB) are known\n    When I calculate the number of full filler files plus any remainder\n    And I create those filler files on the SD card\n    Then filler files are created successfully\n    And final free space is near the 500MB reserve within tolerance\n    And creation metrics are attached", "cls": "automated", "labels": ["FWTC_SDCard_FIFO", "FWTC_RWFile"], "primary": "FWTC_SDCard_FIFO", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD write permission and fills the card with filler files to force storage saturation.", "unknown": []}, {"key": "UNI-34460", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_04_monitor_oldest_file_removal", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "Out of Memory Behavior: Monitor Oldest File Removal", "desc": "Feature: Automatic Space Reclamation\nScenario: Detect removal of oldest media files under near-full conditions\n    Given the SD card is filled leaving ~500MB free\n    And baseline oldest media files and total count are recorded\n    When I poll the filesystem every 10 seconds for up to 150 seconds\n    Then at least one baseline oldest file is removed or total count decreases\n    And monitoring snapshots (time, counts, removals, free space) are attached", "cls": "automated", "labels": ["FWTC_SDCard_FIFO"], "primary": "FWTC_SDCard_FIFO", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the oldest recordings are removed while the SD card is full.", "unknown": []}, {"key": "UNI-34696", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_05_cleanup_filler_files", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "Cleanup: Remove All Filler Files", "desc": "Feature: Test Artifact Cleanup\nScenario: Remove filler files and restore SD card space\n    Given filler files were created during capacity saturation\n    When I enumerate existing filler files\n    And I remove all filler files and sync the filesystem\n    Then no filler files remain\n    And available space approximates baseline within 5% tolerance\n    And cleanup metrics are attached", "cls": "automated", "labels": ["FWTC_RWFile"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts filler files are deleted, the filesystem syncs, and free space returns to within 5% of baseline.", "unknown": []}, {"key": "UNI-34697", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_06_verify_recording_continuity", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "Out of Memory Behavior: Recording Continuity Check", "desc": "Feature: Recording Continuity Under Low Space\nScenario: Verify recording persists with constrained storage\n    Given the SD card remains near capacity and auto-removal is active\n    When I wait 30 seconds for potential new recordings\n    And I recount media files and free space\n    Then media file count should remain > 0 indicating ongoing recording\n    And continuity metrics are attached", "cls": "automated", "labels": ["FWTC_SDCard_Recording", "FWTC_SDCard_FIFO"], "primary": "FWTC_SDCard_Recording", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a new or growing recording file appears while storage stays constrained.", "unknown": []}, {"key": "UNI-34463", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_07_reboot_camera", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "System Recovery: Camera Reboot", "desc": "Feature: Post-Test System Recovery\nScenario: Reboot camera after storage stress\n    Given storage saturation tests and cleanup have completed\n    When I issue a reboot command\n    And I wait a brief offline interval\n    And I poll until the camera responds within the timeout\n    Then the camera should return online before the reboot timeout expires\n    And reboot status is attached", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the camera goes offline and comes back online after a reboot.", "unknown": []}, {"key": "UNI-34464", "uid": "fenix-tests/camera_system/test_sd_card_out_of_memory.py::TestSDCardOutOfMemory::test_08_verify_post_reboot_sd_card", "file": "camera_system/test_sd_card_out_of_memory.py", "title": "System Recovery: Post-Reboot SD Card Verification", "desc": "Feature: Post-Reboot SD Card Integrity\nScenario: Validate SD card state after system reboot\n    Given the camera has rebooted following cleanup\n    When I verify the SD card mount accessibility within 100 seconds\n    And I confirm no filler files remain\n    And I capture current free space and media file count\n    Then the mount is accessible and free of test artifacts\n    And space and file count indicate healthy state\n    And a completion summary is attached", "cls": "automated", "labels": ["FWTC_SDCardSupport", "FWTC_Reboot"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the SD card is mounted with free space and no filler files after reboot.", "unknown": []}, {"key": "UNI-34861", "uid": "fenix-tests/camera_system/test_sd_card_rapid_removal.py::TestSDCardRapidRemoval::test_rapid_sd_card_removal_reinsertion", "file": "camera_system/test_sd_card_rapid_removal.py", "title": "SD-STABILITY-01: Rapid SD Card Removal and Insertion Analysis", "desc": "Feature: SD Card System Stability - Rapid Removal/Insertion\nAs a camera system operator\nI want the system to handle rapid SD card hot-plugging events gracefully\nSo that the filesystem remains uncorrupted and events are correctly reported\n\nScenario: Rapidly cycle SD card insertion/removal and verify system response\n    Given the SD card is physically present and the MMC ID is identified\n    When I perform 3 rapid cycles of:\n        - Unbinding the SD card driver (Simulated Removal)\n        - Waiting for system kernel to register removal\n        - Binding the SD card driver (Simulated Insertion)\n        - Waiting for system kernel to register insertion\n    Then the system should generate correct Storage.Event messages:\n        - SD_CARD_REMOVED for each unbind verification\n        - SD_CARD_ADDED for each bind verification\n    And the SD card should be successfully mounted at the end\n    And the mount point should be accessible for write operations", "cls": "automated", "labels": ["FWTC_SDCardSupport"], "primary": "FWTC_SDCardSupport", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD_CARD_REMOVED/ADDED events for each rapid cycle and that the card ends mounted and writable.", "unknown": []}, {"key": "UNI-35468", "uid": "fenix-tests/camera_system/test_snapshot_schedule_race_repro.py::TestSnapshotScheduleRaceRepro::test_snapshot_pipeline_survives_schedule_off_race", "file": "camera_system/test_snapshot_schedule_race_repro.py", "title": "Snapshot pipeline survives a Schedule-OFF race (regression for stuck 'snapshot already busy')", "desc": "Regression test for the ``snapshot already busy`` firmware race.\n\nThis test is a **regression guard**, not a repro harness. It runs a\nrace that is known to trigger the bug on buggy firmware\n(1.8.9991-b1-v1.8.1) and then asserts the pipeline still works.\n\nResult matrix:\n  * Buggy firmware   → post-race snapshots never complete, this\n                       test FAILS. That's the signal the bug is\n                       present.\n  * Fixed firmware   → post-race snapshots complete normally, this\n                       test PASSES. That's the signal the fix\n                       shipped.\n\nScenario: Race a snapshot against a ``Camera mode → 0`` transition\n    Given the camera is online and the snapshot pipeline is healthy\n      And the recording schedule has snapshot+recording ENABLED\n    When we run 10 iterations of:\n         * a 30s ``@/ClipManager/Capture`` (motion clip)\n         * a burst of snapshot requests at ~1..5 ms offsets\n         * at ~10 ms, a schedule flip to a still-enabled window\n           with clipEventRecording/snapshot/continuousRecording all\n           false (fires ``Camera mode recording setting changed to 0``)\n         * at ~20 ms, one more snapshot\n         * re-enable the schedule\n    Then subsequent snapshot requests should still complete:\n         * ``NvtData.cpp Snapshot taken`` per request\n         * zero ``VideoDataManager.cpp WARN - snapshot already busy``\n      And the VideoDataManager process is still alive throughout.\n\nImpact when the bug fires (from the 2026-07-07 field log):\n  * The snapshot busy flag is stuck ``true`` in-process.\n  * Motion + object-detection events still land on ClipManager\n    but the attached snapshot never gets produced, so no\n    MediaUpload.Event reaches the cloud.\n  * Users see zero motion / OD events on their app until the\n    camera is rebooted.", "cls": "automated", "labels": ["FWTC_Snapshot", "FWTC_RecordingSchedule"], "primary": "FWTC_Snapshot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts snapshots still complete without 'snapshot already busy' after racing them against schedule-off transitions.", "unknown": []}, {"key": "UNI-35469", "uid": "fenix-tests/camera_system/test_video_metadata.py::TestVideoMetadata::test_bbox_metadata_rate_control_gates_stream", "file": "camera_system/test_video_metadata.py", "title": "Video Metadata: metadata_rate_control starts and pauses the bbox stream", "desc": "BDD Scenario: The metadata_rate_control data-channel command controls whether\nthe camera emits bounding-box tracker metadata.\n\nGIVEN a live WebRTC viewer session is active for the device\n  AND the bbox stream has been enabled with metadata_rate_control\n  AND bounding-box frames are reaching the stats monitor\nWHEN I send metadata_rate_control with pause=true\nTHEN the camera SHALL stop emitting bounding-box frames\n  AND /bbox/summary SHALL report no new frames for the observation window\nWHEN I send metadata_rate_control with pause=false again\nTHEN bounding-box frames SHALL resume\n\nThis proves the stream is genuinely command-gated: without the enable\ncommand the other bbox scenarios would silently report zero frames rather\nthan fail with a clear cause.", "cls": "automated", "labels": ["FWTC_BoundingBox_LiveStream", "FWTC_WebRTC"], "primary": "FWTC_BoundingBox_LiveStream", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts metadata_rate_control pause stops and resume restarts live bounding-box frames.", "unknown": []}, {"key": "UNI-35290", "uid": "fenix-tests/camera_system/test_video_metadata.py::TestVideoMetadata::test_live_streaming_bbox_has_tracker_metadata", "file": "camera_system/test_video_metadata.py", "title": "Video Metadata: Live streaming (WebRTC data channel) tracker metadata", "desc": "BDD Scenario: Tracker metadata available over the WebRTC data channel during\na live stream.\n\nGIVEN the device is online and the WebRTC stats monitor is running\nWHEN a live WebRTC viewer session is started for the device\n  AND the bbox stream is enabled with a metadata_rate_control data-channel\n      command (the camera emits nothing until it receives one)\nTHEN the browser viewer SHALL decode bounding-box tracker frames off the\n     data channel and POST them to the stats monitor\n  AND the decoded Objects timestamp and session identity SHALL be preserved\n  AND each detection SHALL expose label, confidence, track/zone IDs, and\n      normalized bounding-box coordinates\n        AND, when detections are present, each detection SHALL expose\n                DetectionOrigin type and probability\n\n    Heartbeat-only frames prove transport and envelope integrity but report\n    DetectionOrigin as not observed. Subject-driven manual/semi-automated\n    scenarios retain mandatory object-level verification.", "cls": "automated", "labels": ["FWTC_BoundingBox_LiveStream", "FWTC_WebRTC"], "primary": "FWTC_BoundingBox_LiveStream", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts valid bounding-box frames arrive over the WebRTC live-stream data channel.", "unknown": []}, {"key": "UNI-35287", "uid": "fenix-tests/camera_system/test_video_metadata.py::TestVideoMetadata::test_manual_clip_export_has_tracker_metadata", "file": "camera_system/test_video_metadata.py", "title": "Video Metadata: Manual on-demand clip carries 'rezp' tracker stream", "desc": "BDD Scenario: Manual on-demand clip carries the tracker metadata stream\n\nGIVEN the camera is online\nWHEN I trigger a 30-second on-demand ClipCapture via the Unicorn service\n  AND the resulting clip is uploaded and downloaded\nTHEN the downloaded clip SHALL contain a 'rezp' tracker metadata stream\n  AND ffprobe SHALL enumerate the stream\n    AND every packet SHALL decode an Objects.timestamp_ms, including empty heartbeats\n    AND, when detections are present, every detection SHALL contain\n        DetectionOrigin type and probability", "cls": "automated", "labels": ["FWTC_BoundingBox_EventClips", "FWTC_OnDemandClip"], "primary": "FWTC_BoundingBox_EventClips", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an on-demand cloud clip carries a valid 'rezp' tracker metadata stream.", "unknown": []}, {"key": "UNI-35288", "uid": "fenix-tests/camera_system/test_video_metadata.py::TestVideoMetadata::test_playback_bbox_has_tracker_metadata", "file": "camera_system/test_video_metadata.py", "title": "Video Metadata: KVS Playback (seek back) tracker metadata", "desc": "BDD Scenario: Tracker metadata is present in KVS playback (historical) video,\nnot just the live stream.\n\nGIVEN the device is online, continuously recording, and streaming live\n  AND a live WebRTC viewer session is active\n  AND the bbox stream has been enabled with metadata_rate_control\n  AND bbox frames are flowing on the live stream\nWHEN I send a `start_playback` data-channel command to seek back ~3 minutes\nTHEN the camera SHALL acknowledge the command (success=true)\n  AND bounding-box tracker frames SHALL continue to arrive during playback\n  AND the playback frames SHALL carry PAST timestamps (older than live),\n      proving the metadata belongs to the recorded footage, not the live feed\n  AND, when detections are present, each playback detection SHALL expose\n      DetectionOrigin type and probability\n\nThis exercises the same data-channel bbox pipeline as scenario 3, but for the\nplayback path: the metadata rides the recorded fragments the camera replays.", "cls": "automated", "labels": ["FWTC_BoundingBox_Playback", "FWTC_SDCardPlayback"], "primary": "FWTC_BoundingBox_Playback", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts bounding-box frames keep arriving with past timestamps after a seek-back playback request.", "unknown": []}, {"key": "UNI-35289", "uid": "fenix-tests/camera_system/test_video_metadata.py::TestVideoMetadata::test_sd_card_export_clip_has_tracker_metadata", "file": "camera_system/test_video_metadata.py", "title": "Video Metadata: SD Card Export clip carries 'rezp' tracker stream", "desc": "BDD Scenario: SD Card Export clip carries the tracker metadata stream\n\nGIVEN a device with SD card storage is online and continuously recording\nWHEN I export a 30-second clip from the SD card to the cloud\n  AND download the exported clip\nTHEN the downloaded clip SHALL contain a 'rezp' tracker metadata stream\n  AND ffprobe SHALL enumerate the stream\n    AND every packet SHALL decode an Objects.timestamp_ms, including empty heartbeats\n    AND, when detections are present, every detection SHALL contain\n        D
