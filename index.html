80 @ ~15fps, bitrate 1.0–2.0 Mbps) or HIGH (3840x2160 @ ~15fps, bitrate 3.5–4.5 Mbps) specs\n    And any audio stream present matches the camera family's audio spec (Fenix: AAC 16 kHz mono 50–70 kbps; Taranaki: Opus 48 kHz mono 8–28 kbps)\n    And the clip duration should be within expected range (~120 seconds)\n    And results and classification are attached in the test report", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_Bitrate", "FWTC_FPS", "FWTC_VideoCodec"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the downloaded SD-card recording matches the LOW quality resolution, ~15 fps, bitrate range and H.264/H.265 codec.", "unknown": []}, {"key": "UNI-34469", "uid": "fenix-tests/camera_system/test_audio_video_quality.py::TestAudioVideoQuality::test_mpeg_ts_pid_assignments", "file": "camera_system/test_audio_video_quality.py", "title": "MPEG-TS PID Assignments Validation", "desc": "Scenario: MPEG-TS PID Validation with Object Detection\n\n        GIVEN the camera is set to HIGH quality mode\n        WHEN I prompt user to trigger object detection via GUI dialog\n        AND wait for the video clip to be recorded and uploaded\n        THEN I download and analyze the transport stream structure\n        AND validate the video and audio streams have valid PID assignments\n        AND the PID numbers should be within expected ranges\n        AND each stream type should have unique PID values", "cls": "semi-automated", "labels": ["FWTC_VideoResolution"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts transport-stream PID assignments of previously downloaded media are valid and unique; container structure has no FWTC feature label.", "unknown": []}, {"key": "UNI-35284", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b01_bounding_box_webrtc_live", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B01 — Bounding Box overlay in WebRTC Live Streaming", "desc": "BDD Scenario: Verify that bounding boxes appear on the WebRTC live stream\nwhen a person or vehicle is in the camera field of view.\n\nGIVEN the camera is registered via OnePortal or ProPortal\n  AND the camera is aimed at an area where a person or vehicle is visible\n  AND the operator is logged into the bounding-box-aware live viewer\n      ([internal URL removed])\nWHEN the operator opens the live stream for the target camera\n  AND keeps a person / vehicle in frame for 5 minutes\nTHEN a bounding box overlay SHALL be drawn around the detected subject\n  AND the overlay SHALL track the subject as it moves\n  AND the overlay SHALL be labelled with the detection class\n      (e.g. Person / Vehicle)\n\nManual — no clip download is required for this scenario; the viewer\nrenders the overlay directly from the live WebRTC + rezp streams.", "cls": "manual", "labels": ["FWTC_BoundingBox_LiveStream", "FWTC_WebRTC"], "primary": "FWTC_BoundingBox_LiveStream", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "manual"], "why": "Manual check that bounding boxes are rendered on the WebRTC live stream.", "unknown": []}, {"key": "UNI-35282", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b02_bounding_box_webrtc_playback", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B02 — Bounding Box overlay in WebRTC Playback", "desc": "BDD Scenario: Verify that bounding boxes rendered on the live stream are\nalso present when the same footage is played back through WebRTC.\n\nGIVEN scenario B01 has just been completed\n  AND the operator kept a subject in frame for 5 minutes on the live stream\nWHEN the operator scrubs playback back ~5 minutes in the live-cameras viewer\n      ([internal URL removed])\nTHEN the SAME bounding-box overlay SHALL be visible in the playback video\n  AND the overlay SHALL move in sync with the (recorded) subject\n  AND the overlay SHALL remain visible for the full 5-minute window", "cls": "manual", "labels": ["FWTC_BoundingBox_Playback", "FWTC_SDCardPlayback"], "primary": "FWTC_BoundingBox_Playback", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "manual"], "why": "Manual check that bounding boxes are present when the same footage is played back and scrubbed.", "unknown": []}, {"key": "UNI-35285", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b03_bounding_box_event_clip_oneportal", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B03 — Bounding Box in event-based clip downloaded from OnePortal", "desc": "BDD Scenario: Trigger a person-detection event, download the resulting\nevent clip from OnePortal, and verify the ``rezp`` tracker metadata stream\nis embedded in the clip via ffprobe.\n\nGIVEN the camera is registered\n  AND person detection is enabled on the camera in OnePortal\nWHEN the operator walks around in front of the camera to trigger events\n  AND downloads the resulting event clip from OnePortal\n      ([internal URL removed])\nTHEN the downloaded ``.mp4`` SHALL contain a ``rezp`` tracker metadata stream\n  AND ffprobe SHALL enumerate the stream in ``-show_streams``\n  AND ``TrackerMetadataUtils`` SHALL decode at least 5\n      tracker packets, of which at least 3 contain\n      detections\n  AND every detection SHALL include ``detection_origin.type`` and\n      ``detection_origin.probability``\n  AND the detected classes SHALL include ``Person``", "cls": "semi-automated", "labels": ["FWTC_BoundingBox_EventClips", "FWTC_OD_Clip", "FWTC_OD_Person"], "primary": "FWTC_BoundingBox_EventClips", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts rezp tracker metadata is embedded in a person-detection event clip downloaded from OnePortal.", "unknown": []}, {"key": "UNI-35283", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b04_bounding_box_sd_card_export_oneportal", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B04 — Bounding Box in SD-card clip exported from OnePortal", "desc": "BDD Scenario: Export a clip from the camera's SD card that contains a\nperson or vehicle, then verify the ``rezp`` tracker metadata stream is\nembedded in the exported clip.\n\nGIVEN the camera is registered\n  AND the SD card contains continuous recordings that include a period\n      during which a person or vehicle was in frame\nWHEN the operator exports the relevant SD-card clip via OnePortal\n      ([internal URL removed])\n  AND downloads the resulting ``.mp4`` file\nTHEN the exported clip SHALL contain a ``rezp`` tracker metadata stream\n  AND ffprobe SHALL enumerate the stream in ``-show_streams``\n  AND ``TrackerMetadataUtils`` SHALL decode at least 5\n      tracker packets, of which at least 3 contain\n      detections\n  AND every detection SHALL include ``detection_origin.type`` and\n      ``detection_origin.probability``\n  AND the detected classes SHALL include ``Person`` or ``Vehicle``", "cls": "semi-automated", "labels": ["FWTC_BoundingBox_ExportedClip", "FWTC_SDCard_ClipExport"], "primary": "FWTC_BoundingBox_ExportedClip", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts rezp tracker metadata is embedded in an SD-card clip exported via OnePortal.", "unknown": []}, {"key": "UNI-35512", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b05_polygon_intersection_filters_clipping_boxes", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B05 — Polygon zone filters low-overlap bounding boxes", "desc": "BDD Scenario: Verify rectangle / polygon intersection filtering with real\ntracker metadata from a person crossing a detection-zone boundary.\n\nGIVEN a person detection polygon covers x=0.55..0.95 and y=0.05..0.95\nWHEN a person crosses from outside the left boundary into the polygon\n  AND the resulting event clip is downloaded from OnePortal\nTHEN tracker metadata SHALL contain person boxes that clip no more than\n     10% of their area against the polygon\n  AND person boxes that overlap at least 60%\n  AND low-overlap boxes SHALL NOT be associated with the polygon zone\n  AND at least one high-overlap box SHALL be associated with the polygon zone", "cls": "semi-automated", "labels": ["FWTC_DetectionAreas", "FWTC_BoundingBox_EventClips", "FWTC_OD_Person"], "primary": "FWTC_DetectionAreas", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automatable", "semi-automated"], "why": "Asserts person boxes in event-clip metadata are filtered by detection-polygon intersection.", "unknown": []}, {"key": "UNI-35547", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b06_automated_sd_card_export_metadata", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B06 — Automated bounding-box metadata in SD-card export", "desc": "BDD Scenario: Automatically validate tracker metadata in an SD-card export\n\nGIVEN the camera is online and continuously recording to its SD card\nWHEN the test exports a 30-second recording window through MediaService\n  AND waits for the clip upload\n  AND downloads the resulting clip\nTHEN the clip SHALL contain a 'rezp' tracker stream\n  AND at least one Objects packet SHALL decode\n  AND every packet SHALL contain the expected metadata envelope and timestamp\n  AND, when boxes are present, every box SHALL contain a valid DetectionOrigin", "cls": "automated", "labels": ["FWTC_BoundingBox_ExportedClip", "FWTC_SDCard_ClipExport"], "primary": "FWTC_BoundingBox_ExportedClip", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an automated SD-card export contains a decodable rezp tracker metadata stream.", "unknown": []}, {"key": "UNI-35548", "uid": "fenix-tests/camera_system/test_bounding_box_metadata_scenarios.py::TestBoundingBoxMetadataScenarios::test_scenario_b07_automated_on_demand_clip_metadata", "file": "camera_system/test_bounding_box_metadata_scenarios.py", "title": "Scenario B07 — Automated bounding-box metadata in on-demand clip", "desc": "BDD Scenario: Automatically validate tracker metadata in an on-demand clip\n\nGIVEN the camera is online\nWHEN the test triggers a 30-second ClipCapture through UnicornService\n  AND waits for the clip upload\n  AND downloads the resulting clip\nTHEN the clip SHALL contain a 'rezp' tracker stream\n  AND at least one Objects packet SHALL decode\n  AND every packet SHALL contain the expected metadata envelope and timestamp\n  AND, when boxes are present, every box SHALL contain a valid DetectionOrigin", "cls": "automated", "labels": ["FWTC_BoundingBox_EventClips", "FWTC_OnDemandClip"], "primary": "FWTC_BoundingBox_EventClips", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an on-demand clip contains a decodable rezp tracker metadata stream.", "unknown": []}, {"key": "UNI-34417", "uid": "fenix-tests/camera_system/test_camera_mdns.py::TestCameraMDNS::test_camera_device_information", "file": "camera_system/test_camera_mdns.py", "title": "Camera Discovery: Device Information Extraction", "desc": "Feature: Camera Device Information Extraction\nScenario: Extract and validate device information from mDNS TXT records\n    Given a camera is discoverable via mDNS providing TXT records and service metadata\n    And the camera is identified by its MAC address within a 5 second timeout\n    When I perform mDNS discovery and collect its service details\n    Then the MAC address is present and at least 12 characters\n    And the service type contains the identifier \"_rezi-video-discovery\"\n    And the port is within the valid range 1-65535\n    And optional fields (firmware version, registration code, model, hostname) are captured when available\n    And a summary including counts of TXT records and available info fields is attached to the test results", "cls": "automated", "labels": ["FWTC_mDNS"], "primary": "FWTC_mDNS", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts mDNS TXT/service records expose a valid MAC and the expected service type.", "unknown": []}, {"key": "UNI-34416", "uid": "fenix-tests/camera_system/test_camera_mdns.py::TestCameraMDNS::test_camera_ip_address_validation", "file": "camera_system/test_camera_mdns.py", "title": "Camera Discovery: IP Address Validation", "desc": "Feature: Camera IP Address Validation\nScenario: Validate discovered camera IP address matches configured value\n    Given a discoverable camera with known MAC address and configured IPv4 address\n    And the camera is available via mDNS within a 5 second timeout\n    When I perform mDNS discovery and obtain the camera's IP address\n    Then the discovered IP matches the expected configured IP\n    And the IP address conforms to valid IPv4 formatting\n    And the comparison details are attached to the test results", "cls": "automated", "labels": ["FWTC_mDNS"], "primary": "FWTC_mDNS", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the mDNS-discovered IPv4 address matches the configured camera IP.", "unknown": []}, {"key": "UNI-34415", "uid": "fenix-tests/camera_system/test_camera_mdns.py::TestCameraMDNS::test_target_camera_discovery", "file": "camera_system/test_camera_mdns.py", "title": "Camera Discovery: Target Camera Detection", "desc": "Feature: mDNS Camera Discovery\nScenario: Discover target camera by MAC address\n    Given a target camera device is connected to the network with a known MAC address\n    And the mDNS discovery service is available\n    And a discovery timeout of 5 seconds is configured\n    When I perform mDNS discovery filtering for the specific MAC address\n    Then the camera is discovered successfully\n    And the discovery result includes name, IP address, MAC address, port, firmware version (if available), registration code (if available), service type and TXT records", "cls": "automated", "labels": ["FWTC_mDNS"], "primary": "FWTC_mDNS", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the target camera is discovered via mDNS by MAC with name, IP, port in the result.", "unknown": []}, {"key": "UNI-34432", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_filesystem_check", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Filesystem Integrity Check", "desc": "Feature: Post-Reboot Filesystem Verification\nScenario: Validate mounts and disk health after reboot\n    Given the system has completed reboot\n    When I list mounted block device filesystems and gather disk usage\n    Then at least one filesystem is mounted\n    And disk usage information is successfully collected\n    And any kernel disk error messages (if present) are attached", "cls": "automated", "labels": ["FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts filesystems are mounted and disk usage is readable after reboot.", "unknown": []}, {"key": "UNI-34433", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_hardware_readwrite", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Hardware I/O Operations Test", "desc": "Feature: Post-Reboot Storage I/O Sanity\nScenario: Verify read and write operations on temporary storage\n    Given the system has rebooted and /tmp is writable\n    When I create, read, and delete a temporary test file\n    Then the file contents match what was written\n    And cleanup completes without error", "cls": "automated", "labels": ["FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a file can be written, read back and deleted in /tmp after reboot.", "unknown": []}, {"key": "UNI-34436", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_log_analysis", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Boot Log Analysis", "desc": "Feature: Boot Log Error Screening\nScenario: Analyze boot logs for error and warning thresholds\n    Given reboot start time is known\n    When I parse compressed or streamed boot logs after startup\n    Then total error entries do not exceed the configured threshold (<=10)\n    And total warning entries remain within acceptable limits (<=50)\n    And analysis results are stored for the final summary", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts boot-log error and warning counts are within thresholds after reboot.", "unknown": []}, {"key": "UNI-34434", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_memory_readwrite", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Memory Health Assessment", "desc": "Feature: Post-Reboot Memory Health\nScenario: Verify system memory availability after reboot\n    Given the system has completed reboot\n    When I collect memory statistics and scan kernel logs for memory-related issues\n    Then available memory exceeds a minimal threshold\n    And no critical OOM or memory panic indicators are present", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts available memory is above threshold with no OOM indicators after reboot.", "unknown": []}, {"key": "UNI-34437", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_misc_errors", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: System Error Detection", "desc": "Feature: Post-Reboot System Error Detection\nScenario: Scan system journals and kernel messages for critical issues\n    Given system boot has completed\n    When I search journalctl and dmesg for error patterns while filtering benign entries\n    Then the count of unresolved critical errors after filtering is less than or equal to 10\n    And any detected issues are attached for analysis", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts filtered journal/dmesg critical error count is within threshold after reboot.", "unknown": []}, {"key": "UNI-34435", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_network_configuration", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Network Connectivity Validation", "desc": "Feature: Post-Reboot Network Connectivity\nScenario: Validate interfaces and routing after reboot\n    Given the system has completed reboot\n    When I inspect IP addresses and default route configuration\n    Then the camera IP address is present on an interface\n    And (if available) the default gateway responds to ping", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the camera IP is configured on an interface after reboot.", "unknown": []}, {"key": "UNI-34431", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_during_bootup_service_monitoring", "file": "camera_system/test_camera_system_stability.py", "title": "During-Bootup: Service Status Monitoring", "desc": "Feature: Boot Service Initialization Monitoring\nScenario: Verify essential services reach a healthy state after reboot\n    Given the system has recently rebooted\n    When I inspect failed and active services with systemctl and fall back to process/port checks if needed\n    Then no critical services (ssh, network, system core) are in a failed state\n    And SSH availability is confirmed\n    And active service information is attached to the report", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts no critical services are failed after reboot.", "unknown": []}, {"key": "UNI-34439", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_certs_and_keys_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Security Asset Integrity Verification", "desc": "Feature: Post-Reboot Security Asset Integrity\nScenario: Verify certificates and keys persist after reboot\n    Given baseline certificate and key inventories were recorded\n    When I enumerate current certificate and key files in the same paths\n    Then every baseline category exists\n    And no baseline file is missing from the current inventory", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts all baseline certificate/key files still exist after reboot.", "unknown": []}, {"key": "UNI-34441", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_file_permissions_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Security Permissions Validation", "desc": "Feature: Post-Reboot File Permission Consistency\nScenario: Validate security-sensitive file permissions remain unchanged\n    Given baseline permission data for critical files was recorded\n    When I capture current permissions for the same file set\n    Then any deviations are reported\n    And private key files remain non world-readable", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts private key files remain non world-readable after reboot.", "unknown": []}, {"key": "UNI-34438", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_mac_address_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: MAC Address Consistency Verification", "desc": "Feature: Post-Reboot MAC Address Consistency\nScenario: Confirm MAC address remains unchanged across reboot\n    Given the baseline MAC address was captured pre-reboot\n    When I read the current MAC address from the primary interface\n    Then the MAC address matches the baseline value exactly\n    And network identity stability is confirmed", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the MAC address matches the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34440", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_md5sum_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: File Integrity Checksum Validation", "desc": "Feature: Post-Reboot File Integrity Validation\nScenario: Compare post-reboot MD5 checksums with baseline\n    Given baseline MD5 checksums were collected pre-reboot\n    When I recompute MD5 checksums for the same set of files\n    Then at least 90% of files have matching checksum values\n    And any mismatches are reported and attached\n    And the test is skipped if no baseline data exists", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts at least 90% of baseline certificate/key MD5 checksums are unchanged after reboot.", "unknown": []}, {"key": "UNI-34446", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_network_services", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Network Service Connectivity Test", "desc": "Feature: Post-Reboot Network Service Availability\nScenario: Validate essential network services are listening\n    Given the system is reachable via SSH post-reboot\n    When I list listening TCP/UDP ports and inspect interface statistics\n    Then at least one listening port is reported and SSH connectivity is verified\n    And the primary network interface shows traffic statistics\n    And the configured camera IP is bound to an interface", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts listening ports, SSH and the camera IP binding after reboot.", "unknown": []}, {"key": "UNI-34444", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_os_release_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: OS Version Consistency Verification", "desc": "Feature: Post-Reboot OS Version Consistency\nScenario: Verify OS release information matches baseline\n    Given pre-reboot OS release data was collected\n    When I read current release information\n    Then the value matches the baseline", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts OS release information matches the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34442", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_partition_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Boot Configuration Consistency", "desc": "Feature: Post-Reboot Boot Configuration Consistency\nScenario: Validate boot parameters and partition layout remain stable\n    Given pre-reboot boot command line and partition info were captured\n    When I read current /proc/cmdline and /proc/partitions\n    Then normalized boot arguments (excluding variable timestamps) match the baseline\n    And partition information is accessible", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts boot arguments and partition info match the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34443", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_process_check", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Critical Process Recovery Verification", "desc": "Feature: Post-Reboot Process Recovery\nScenario: Confirm essential processes restart after reboot\n    Given a baseline list of critical processes was stored pre-reboot\n    When I list current running processes\n    Then each baseline critical process is present\n    And at least two critical processes are running", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts baseline critical processes are running again after reboot.", "unknown": []}, {"key": "UNI-34445", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_system_resources", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: System Resource Utilization Check", "desc": "Feature: Post-Reboot Resource Utilization\nScenario: Assess CPU load and top processes after reboot\n    Given the system is stable post-reboot\n    When I read load averages and list top CPU-consuming processes\n    Then the 1-minute load does not grossly exceed twice CPU core count\n    And process utilization data is attached", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts CPU load is within bounds after reboot.", "unknown": []}, {"key": "UNI-34447", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_post_bootup_time_sync", "file": "camera_system/test_camera_system_stability.py", "title": "Post-Bootup: Time Synchronization Verification", "desc": "Feature: Post-Reboot Time & Timezone Validation\nScenario: Confirm system clock and timezone plausibility\n    Given the system has completed reboot\n    When I capture the current date, timezone, and uptime\n    Then the reported date reflects a current (non-epoch) year\n    And collected time data is attached for auditability", "cls": "automated", "labels": ["FWTC_RTC", "FWTC_Reboot"], "primary": "FWTC_RTC", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the system clock reports a current non-epoch year after reboot.", "unknown": []}, {"key": "UNI-34424", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_certs_and_keys_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: Certificate and Key Inventory", "desc": "Feature: Pre-Bootup Security Asset Inventory\nScenario: Record certificate and private key files before reboot\n    Given standard certificate and key directories are present on the device\n    When I enumerate files in the configured certificate and key paths\n    Then at least one certificate or key file is discovered\n    And the discovered file list is stored as baseline security inventory", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts certificate/key files exist and records them as the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34426", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_file_permissions_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: Security Permissions Baseline", "desc": "Feature: Pre-Bootup File Permission Baseline\nScenario: Record permissions for critical security-related files\n    Given certificate and key file paths (or fallback system files) are known\n    When I capture owner, group, and permission bits using ls -la\n    Then permission information is recorded for each evaluated file\n    And private key files are not world-readable\n    And the collected permission data is stored for post-reboot validation", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Records permissions of security files and asserts private keys are not world-readable before reboot.", "unknown": []}, {"key": "UNI-34423", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_mac_address_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: MAC Address Validation", "desc": "Feature: Pre-Bootup MAC Address Validation\nScenario: Establish baseline MAC address prior to reboot\n    Given the camera system is reachable via SSH\n    And network interface eth0 is operational\n    When I collect the MAC address using multiple commands (sysfs, ip link, ifconfig)\n    Then each source returns the same MAC address value\n    And the MAC address matches the standard hexadecimal format\n    And the value is stored as the baseline for post-reboot comparison", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Captures and cross-checks the eth0 MAC address as the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34425", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_md5sum_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: File Integrity Checksums", "desc": "Feature: Pre-Bootup File Integrity Baseline\nScenario: Capture MD5 checksums for critical files\n    Given certificate and key inventory (or fallback system files) is available\n    When I compute MD5 checksums for up to 5 files per category (or fallback list)\n    Then each computed checksum is a valid 32-character hexadecimal MD5 value\n    And the checksum mapping is stored for post-reboot comparison\n    And the test is skipped if no suitable files are present", "cls": "automated", "labels": ["FWTC_CertsKeys", "FWTC_RWFile", "FWTC_Reboot"], "primary": "FWTC_CertsKeys", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Records valid MD5 checksums of certificate/key files as the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34429", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_os_release_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: OS Version Baseline", "desc": "Feature: Pre-Bootup OS Version Baseline\nScenario: Record OS release and kernel information\n    Given /etc/os-release or uname output is available\n    When I read system release information\n    Then a non-empty OS release description is obtained\n    And the value is stored for comparison after reboot", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Records OS release information as the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34427", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_partition_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: System Partition Configuration", "desc": "Feature: Pre-Bootup Filesystem & Partition Baseline\nScenario: Capture boot parameters and partition layout before reboot\n    Given the system exposes /proc/cmdline and /proc/partitions\n    When I read current boot arguments and partition table entries\n    Then the boot command line contains a root= parameter\n    And the collected data is stored for post-reboot comparison", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Records boot cmdline and partition table as the pre-reboot baseline.", "unknown": []}, {"key": "UNI-34428", "uid": "fenix-tests/camera_system/test_camera_system_stability.py::TestCameraSystemStability::test_pre_bootup_process_check", "file": "camera_system/test_camera_system_stability.py", "title": "Pre-Bootup: Critical Process Inventory", "desc": "Feature: Pre-Bootup Process Inventory\nScenario: Identify essential running processes before reboot\n    Given the system is operational and process listing is accessible\n    When I list all running processes and search for critical names (init, sshd, kthreadd)\n    Then at least two critical processes are present\n    And their identifiers are stored for post-reboot comparison", "cls": "automated", "labels": ["FWTC_Reboot"], "primary": "FWTC_Reboot", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Records critical running processes as th  File Permissions Validation\n    Scenario: Validate file permissions across all configuration directories\n        Given configuration files exist in /home/root, rules.d, and run.d\n        When I check read and write permissions on each file\n        Then all files should be readable (test -r passes)\n        And all files should be writable (test -w passes)\n        And configuration files should NOT be executable (test -x fails)\n        And permission failures are logged with file path and issue type", "cls": "automated", "labels": ["FWTC_RWFile"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts config files are readable, writable and not executable.", "unknown": []}, {"key": "UNI-34853", "uid": "fenix-tests/camera_system/test_default_configuration.py::TestDefaultConfiguration::test_04_initd_validate_file_permissions", "file": "camera_system/test_default_configuration.py", "title": "DEF-CFG-03: File Read/Write/Execute Permissions Validation on init.d", "desc": "Feature: Init.d File Permissions Validation\n    Scenario: Validate file permissions for init.d scripts\n        Given init scripts exist in /etc/init.d directory\n        When I check read, write, and execute permissions on each file\n        Then all files should be readable (test -r passes)\n        And all files should be writable (test -w passes)\n        And all init scripts should be executable (test -x passes)\n        And permission failures are logged with file path and issue type", "cls": "automated", "labels": ["FWTC_RWFile"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts init.d scripts are readable, writable and executable.", "unknown": []}, {"key": "UNI-34854", "uid": "fenix-tests/camera_system/test_default_configuration.py::TestDefaultConfiguration::test_05_validate_ownership_and_group", "file": "camera_system/test_default_configuration.py", "title": "DEF-CFG-04: File Owner est_default_configuration.py", "title": "DEF-CFG-07: Symlink regeneration for rules.d and run.d", "desc": "Feature: Symlink Regeneration Validation\n    Scenario: Validate symlink regeneration after deletion\n        Given symlinks exist at /home/root/rules.d and /home/root/run.d\n        When I capture original symlink targets using readlink -f\n        And I remove the symlinks from /home/root\n        And I reboot the camera using soft_reboot\n        Then symlinks should be regenerated pointing to original targets\n        And target directories should exist and be accessible\n        And symlinks should have proper read/write permissions", "cls": "automated", "labels": ["FWTC_RWFile", "FWTC_Defaults", "FWTC_Reboot"], "primary": "FWTC_RWFile", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts deleted rules.d/run.d symlinks are regenerated to their original targets after reboot.", "unknown": []}, {"key": "UNI-35626", "uid": "fenix-tests/camera_system/test_default_configuration.py::TestDefaultConfiguration::test_13_recording_schedule_no_regen_after_delete[api_reboot]", "file": "camera_system/test_default_configuration.py", "title": "DEF-CFG-13: recording_schedule.json is NOT regenerated after delete + reboot - {reboot_method} [api_reboot]", "desc": "Feature: Recording Schedule File Non-Regeneration After Deletion\n    Scenario: Verify recording_schedule.json does not regenerate on reboot\n        Given /home/root/recording_schedule.json exists on the camera\n        When I remove that file\n        And I reboot the camera using soft_reboot or api_reboot\n        Then the file should NOT be present after the camera comes back online\n        And this confirms recording_schedule.json is user-published state\n        (via the RecordingScheduleConfig MQTT command) and is intentionally\n        NOT recreated as a firmware default — contrast with the six .jsn\n        configs (DEF-CFG-01 / DEF-CFG-11) which DO auto-regenerate.\n\n\nParameter ID: api_reboot\nParameter values: {\"reboot_method\": \"api_reboot\"}", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_Reboot"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a deleted recording_schedule.json is not regenerated after reboot.", "unknown": []}, {"key": "UNI-35491", "uid": "fenix-tests/camera_system/test_default_configuration.py::TestDefaultConfiguration::test_13_recording_schedule_no_regen_after_delete[soft_reboot]", "file": "camera_system/test_default_configuration.py", "title": "DEF-CFG-13: recording_schedule.json is NOT regenerated after delete + reboot - {reboot_method} [soft_reboot]", "desc": "Feature: Recording Schedule File Non-Regeneration After Deletion\n    Scenario: Verify recording_schedule.json does not regenerate on reboot\n        Given /home/root/recording_schedule.json exists on the camera\n        When I remove that file\n        And I reboot the camera using soft_reboot or api_reboot\n        Then the file should NOT be present after the camera comes back online\n        And this confirms recording_schedule.json is user-published state\n        (via the RecordingScheduleConfig MQTT command) and is intentionally\n        NOT recreated as a firmware default — contrast with the six .jsn\n        configs (DEF-CFG-01 / DEF-CFG-11) which DO auto-regenerate.\n\n\nParameter ID: soft_reboot\nParameter values: {\"reboot_method\": \"soft_reboot\"}", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_Reboot"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a deleted recording_schedule.json is not regenerated after reboot.", "unknown": []}, {"key": "UNI-35881", "uid": "fenix-tests/camera_system/test_mp4_moov_atom_placement.py::TestMp4MoovAtomPlacement::test_cloud_clip_moov_before_mdat", "file": "camera_system/test_mp4_moov_atom_placement.py", "title": "On-Demand Cloud Clip Has The moov Atom Before mdat", "desc": "BDD Scenario: On-Demand Cloud Clip Has The moov Atom Before mdat\n\nGIVEN a camera that is online\nWHEN I request a 30-second on-demand clip through the cloud clipCaptureStart API\nAND the clip is uploaded (MediaUpload.Event with uploadType \"clip\" and eventType \"Manual\")\nAND I download the clip by its mediaId\nTHEN the clip should contain a top-level moov box\nAND the moov box should come before the first mdat box", "cls": "automated", "labels": ["FWTC_OnDemandClip"], "primary": "FWTC_OnDemandClip", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the downloaded on-demand cloud clip has a top-level moov box before the first mdat box.", "unknown": []}, {"key": "UNI-35880", "uid": "fenix-tests/camera_system/test_mp4_moov_atom_placement.py::TestMp4MoovAtomPlacement::test_sd_recording_moov_before_mdat", "file": "camera_system/test_mp4_moov_atom_placement.py", "title": "SD Card Recording Has The moov Atom Before mdat", "desc": "BDD Scenario: SD Card Recording Has The moov Atom Before mdat\n\nGIVEN a camera with an SD card that is recording continuously\nWHEN I take the newest completed recording under /mnt/sdcard/sub/ on the camera\nAND I read its top-level MP4 box headers over SSH\nTHEN the recording should contain a top-level moov box\nAND the moov box should come before the first mdat box\n\nKnown: FW 1.10.1 still writes moov last on SD recordings, so this case is a strict xfail.", "cls": "automated", "labels": ["FWTC_SDCard_Recording"], "primary": "FWTC_SDCard_Recording", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts the newest continuous SD-card recording has its moov box before the first mdat box.", "unknown": []}, {"key": "UNI-35627", "uid": "fenix-tests/camera_system/test_mqtt_overlay_and_advanced_video.py::TestMqttOverlayAndAdvancedVideo::test_advanced_video_profile_applied_over_mqtt[high]", "file": "camera_system/test_mqtt_overlay_and_advanced_video.py", "title": "MQTT Advanced Video Profile A alue match the published profile\n\n\nParameter ID: standard\nParameter values: {\"builder\": \"<function>\", \"profile_name\": \"standard_1080p_h264\"}", "cls": "automated", "labels": ["FWTC_VideoResolution", "FWTC_FPS", "FWTC_MQTT", "FWTC_RotateVideo", "FWTC_VideoCodec"], "primary": "FWTC_VideoResolution", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the published advanced video profile (streams, resolution, codec, fps, rotate) is persisted.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35507", "uid": "fenix-tests/camera_system/test_mqtt_overlay_and_advanced_video.py::TestMqttOverlayAndAdvancedVideo::test_advanced_video_rotate_matches_cloud_snapshot", "file": "camera_system/test_mqtt_overlay_and_advanced_video.py", "title": "Advanced Video rotate Produces A 180 Degree Cloud Snapshot", "desc": "BDD Scenario: Advanced Video Rotate Changes The Captured Image\n\nGIVEN I publish the standard profile JSON with rotate=false to \"@/VideoDataManager/AdvancedVideoConfig\"\nAND I receive an ACK on \"@/ACK/VideoDataManager/AdvancedVideoConfig\" with error code 0\nAND I request a 1-second capture through the cloud clipCaptureStart API\nAND I download the baseline snapshot whose mediaId is reported on \"@/UMH/ClipManager/MediaUpload\"\nWHEN I publish the standard profile JSON with rotate=true to \"@/VideoDataManager/AdvancedVideoConfig\"\nAND I receive an ACK on \"@/ACK/VideoDataManager/AdvancedVideoConfig\" with error code 0\nAND I capture and download a second cloud snapshot the same way\nTHEN image comparison shows the second snapshot rotated by 180 degrees relative to the baseline", "cls": "automated", "labels": ["FWTC_RotateVideo", "FWTC_MQTT", "FWTC_Snapshot"], "primary": "FWTC_RotateVideo", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a cloud snapshot taken with rotate=true is rotated 180 degrees relative to the baseline.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35509", "uid": "fenix-tests/camera_system/t esc": "BDD Scenario: Overlay Configuration Applied Over MQTT\n\n    GIVEN a camera reachable on its MQTT broker\n    WHEN I publish the parametrized overlay configuration JSON to \"@/VideoDataManager/OverlayConfig\"\n    THEN I receive an ACK on \"@/ACK/VideoDataManager/OverlayConfig\" with error code 0\n    AND overlayConfig is read over SSH from /home/root/VideoDataManager.jsn\n    AND its time.enabled and logo.enabled match the published values\n    AND its time.format matches the published value when time is enabled\n\n\nParameter ID: time_off_logo_on\nParameter values: {\"case_name\": \"time_off_logo_on\", \"logo_enabled\": true, \"time_enabled\": false, \"time_format\": \"24h\"}", "cls": "automated", "labels": ["FWTC_Watermark", "FWTC_MQTT", "FWTC_Timestamp"], "primary": "FWTC_Watermark", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the published time/logo overlay settings are ACKed and persisted in VideoDataManager.jsn.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35508", "uid": "fenix-tests/camera_system/test_mqtt_overlay_and_advanced_video.py::TestMqttOverlayAndAdvancedVideo::test_standard_advanced_video_profile_produces_h264_media", "file": "camera_system/test_mqtt_overlay_and_advanced_video.py", "title": "Advanced Video Standard Profile Produces H.264 Cloud And SD Media", "desc": "BDD Scenario: Standard Advanced Video Profile Produces H.264 Media\n\nGIVEN I publish the standard (H.264) advanced video profile JSON to \"@/VideoDataManager/AdvancedVideoConfig\"\nAND I receive an ACK on \"@/ACK/VideoDataManager/AdvancedVideoConfig\" with error code 0\nAND advancedVideoConfig read over SSH from /home/root/VideoDataManager.jsn equals the published profile\nWHEN I request a 30-second on-demand clip through the cloud clipCaptureStart API\nAND \"@/UMH/ClipManager/MediaUpload\" reports a snapshot and then a clip upload with the same mediaId\nAND a new completed continuous SD clip appears under /mnt/sdcard/sub/ on the camera\nTHEN ffprobe reports H.264 for both the cloud clip (downloaded by mediaId) and the SD clip (downloaded via SCP)\nAND persisted JSON alone must not make the test pass", "cls": "automated", "labels": ["FWTC_VideoCodec", "FWTC_MQTT", "FWTC_OnDemandClip", "FWTC_SDCard_Recording"], "primary": "FWTC_VideoCodec", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the standard profile yields H.264 in both an on-demand cloud clip and an SD recording.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35873", "uid": "fenix-tests/camera_system/test_mqtt_privacy_zones.py::TestMqttPrivacyZones::test_mqtt_disable_all_privacy_zones", "file": "camera_system/test_mqtt_privacy_zones.py", "title": "MQTT privacy zones: disabling all zones removes every mask", "desc": "Feature: Privacy zones over direct MQTT\nScenario: Disable all privacy zones\n    Given the camera is connected over MQTT\n    And two seeded enabled zones are published and rendered as two masks\n    When I publish the same two zones with \"enabled\": false\n    Then the ACK on \"@/ACK/VideoDataManager/PrivacyZones\" reports error 0\n    And the video frame shows no masks in that colour on two consecutive frames", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_MQTT"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts disabling both zones over MQTT removes every mask from the WebRTC frame.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35870", "uid": "fenix-tests/camera_system/test_mqtt_privacy_zones.py::TestMqttPrivacyZones::test_mqtt_enable_privacy_zones_incrementally", "file": "camera_system/test_mqtt_privacy_zones.py", "title": "MQTT privacy zones: enable one then two zones incrementally", "desc": "Feature: Privacy zones over direct MQTT\nScenario: Enable privacy zones one by one up to the product maximum of two\n    Given the camera is connected over MQTT\n    And two seeded non-overlapping zones with 4 and 5 vertices outside the OSD band\n    When I publish the first N zones with one mask colour to \"@/VideoDataManager/PrivacyZones\" for N = 1..2\n    Then each ACK on \"@/ACK/VideoDataManager/PrivacyZones\" reports error 0\n    And the video frame shows exactly N masks at the configured positions after each step", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_MQTT"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts 1 then 2 MQTT-published privacy zones are ACKed and rendered as masks on a WebRTC frame.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35871", "uid": "fenix-tests/camera_system/test_mqtt_privacy_zones.py::TestMqttPrivacyZones::test_mqtt_invalid_json_rejected", "file": "camera_system/test_mqtt_privacy_zones.py", "title": "MQTT privacy zones: invalid JSON is rejected and existing masks are kept", "desc": "Feature: Privacy zones over direct MQTT\nScenario: Reject a malformed JSON request\n    Given the camera is connected over MQTT\n    And one seeded baseline zone is published and rendered\n    When I publish \"{not json\" to \"@/VideoDataManager/PrivacyZones\"\n    Then the ACK on \"@/ACK/VideoDataManager/PrivacyZones\" reports error 1\n    And its description is \"Invalid JSON\" or \"Missing required field privacyZones\" (fw 1.10.1 parses leniently)\n    And the baseline mask is still rendered at the configured position", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_MQTT"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts malformed JSON is rejected with ACK error 1 and the existing mask stays rendered.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35874", "uid": "fenix-tests/camera_system/test_mqtt_privacy_zones.py::TestMqttPrivacyZones::test_mqtt_two_eight_vertex_zones_rendered", "file": "camera_system/test_mqtt_privacy_zones.py", "title": "MQTT privacy zones: two zones with the spec maximum of 8 vertices are fully rendered", "desc": "Feature: Privacy zones over direct MQTT\nScenario: Enable the largest product configuration\n    Given the camera is connected over MQTT\n    And two seeded non-overlapping zones with 8 vertices each outside the OSD band\n    When I publish the first N zones with one mask colour for N = 1..2\n    Then each ACK reports error 0\n    And the video frame shows exactly N complete masks at the configured positions after each step\n\nEach 8-vertex zone needs 3 hardware masks, so two zones use 6 of the 7 available.", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_MQTT"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts two 8-vertex zones are fully rendered as masks on the WebRTC frame.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35875", "uid": "fenix-tests/camera_system/test_mqtt_privacy_zones.py::TestMqttPrivacyZones::test_mqtt_zone_level_enable_disable_two_zones", "file": "camera_system/test_mqtt_privacy_zones.py", "title": "MQTT privacy zones: zone-level enable/disable controls which of two zones render", "desc": "Feature: Privacy zones over direct MQTT\nScenario: Disable one of two configured zones\n    Given the camera is connected over MQTT\n    And two seeded enabled zones are published and rendered as two masks\n    When I publish them again with a seeded one of them set to \"enabled\": false\n    Then the ACK reports error 0\n    And only the still-enabled zone is rendered", "cls": "automated", "labels": ["FWTC_PrivacyZone", "FWTC_MQTT"], "primary": "FWTC_PrivacyZone", "other": ["Fenix_FW_TestCase", "automated"], "why": "Asserts only the still-enabled zone renders after disabling one of two zones.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35312", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_continuous_produces_clips", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Behavior: Continuous Recording Grows SD-Card File", "desc": "Feature: Recording Schedule Behavior\nScenario: SD-card file size grows during a continuous-recording window\n    Given the camera's local clock is read via SSH\n    And a schedule covering [now+1min, now+2min] with continuousRecording=true\n    When I publish that schedule to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And wait until the camera is 5s past the window's startTime\n    Then the newest /mnt/sdcard/sub mp4, polled over SSH, should grow beyond the minimum threshold", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the SD-card recording file grows during a scheduled continuous-recording window.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35315", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_days_of_week_excludes_today", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Behavior: Future-Only Days Do Not Record Today", "desc": "Feature: Recording Schedule Behavior\nScenario: A schedule scoped to other days does not record today\n    Given a continuous=true schedule scoped to all days except today\n    And a high-priority continuous=false schedule scoped to today\n    And both cover the same 2-min window starting next minute\n    When I publish both to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And wait 5s past window start\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH\n    Then the camera should not be recording (today's schedule is OFF)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts no SD recording occurs today when the ON schedule is scoped to other days.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35308", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_disable_mid_recording_stops", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Behavior: Disabling Recording Mid-Window Stops Growth", "desc": "Feature: Recording Schedule Behavior\nScenario: Turning continuous recording OFF mid-window stops file growth\n    Given a continuous=true schedule published to \"@/VideoDataManager/RecordingScheduleConfig\" is active\n    And the newest /mnt/sdcard/sub mp4, polled over SSH, is growing\n    When I publish a new list with only a priority=100 continuous=false + snapshot=true window to that topic\n    And each publish is ACKed on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And wait for the firmware to apply the override\n    Then the mp4 file should stop growing", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD-card file growth stops after a higher-priority OFF schedule is published mid-window.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35309", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_higher_priority_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Priority: Higher-Priority Schedule Wins on Overlap", "desc": "Feature: Recording Schedule Priority\nScenario: High-priority OFF beats low-priority ON\n    Given a low-priority (20) continuous=true schedule\n    And a high-priority (90) continuous=false + snapshot=true schedule\n    And both covering the same 2-min window starting at next minute\n    When I publish both to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And wait until 5s past the window's startTime\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH\n    Then the camera should not be recording (high-priority OFF wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a higher-priority OFF schedule suppresses SD recording from a lower-priority ON schedule.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35327", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_intra_schedule_overlap_first_off_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Intra-Schedule First-Off Wins (Skipped)", "desc": "Feature: Recording Schedule Overlap\nScenario: timeWindows[0]=OFF beats timeWindows[1]=ON in one schedule\n    Given a single schedule with two overlapping timeWindows\n    And timeWindows[0] is continuousRecording=false (+snapshot=true to avoid the no-op rule)\n    And timeWindows[1] is continuousRecording=true\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\" (planned; skipped today, sends nothing)\n    Then the camera should not be recording (first window wins; OFF wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Skipped intra-schedule overlap case (OFF first); labelled by intended feature only.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35320", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_intra_schedule_overlap_first_on_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Intra-Schedule First-On Wins (Skipped)", "desc": "Feature: Recording Schedule Overlap\nScenario: timeWindows[0]=ON beats timeWindows[1]=OFF in one schedule\n    Given a single schedule with two overlapping timeWindows\n    And timeWindows[0] is continuousRecording=true\n    And timeWindows[1] is continuousRecording=false\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\" (planned; skipped today, sends nothing)\n    Then the camera should be recording (first window wins; ON wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Skipped intra-schedule overlap case (ON first); labelled by intended feature only.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35318", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_partial_overlap_first_off_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Partial Overlap First-Off Wins", "desc": "Feature: Recording Schedule Overlap\nScenario: In a partial overlap with the OFF schedule first, the overlap minute is off\n    Given schedule A (list index 0, continuous=OFF) covering minutes T..T+1\n    And schedule B (list index 1, continuous=ON) covering minutes T+1..T+2\n    When I publish both at the same priority to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH in each phase\n    Then phase 1 (only A) is stopped\n    And phase 2 (A and B overlap) is stopped (first-in-list A wins, A is OFF)\n    And phase 3 (only B) is recording", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts per-minute SD recording state for a partial overlap where the first-listed OFF schedule wins.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35322", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_partial_overlap_first_on_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Partial Overlap First-On Wins", "desc": "Feature: Recording Schedule Overlap\nScenario: In a partial overlap, the first-in-list schedule wins the overlap minute\n    Given schedule A (list index 0, continuous=ON) covering minutes T..T+1\n    And schedule B (list index 1, continuous=OFF) covering minutes T+1..T+2\n    When I publish both at the same priority to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH in each phase\n    Then phase 1 (only A) is recording\n    And phase 2 (A and B overlap) is recording (first-in-list A wins)\n    And phase 3 (only B) is stopped", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts per-minute SD recording state for a partial overlap where the first-listed ON schedule wins.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35321", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_same_priority_full_overlap_first_off_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Same-Priority First-Off Wins (No Clips)", "desc": "Feature: Recording Schedule Overlap\nScenario: schedule[0]=OFF beats schedule[1]=ON at same priority\n    Given two enabled schedules at priority=50 covering the same window\n    And schedule[0] is continuousRecording=false (+snapshot=true to avoid the no-op rule)\n    And schedule[1] is continuousRecording=true\n    When I publish both to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH 5s past window start\n    Then the camera should not be recording (first in list wins; OFF wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the first-listed OFF schedule wins a same-priority full overlap (no SD growth).", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35324", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_same_priority_full_overlap_first_on_wins", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Same-Priority First-On Wins (Clips Appear)", "desc": "Feature: Recording Schedule Overlap\nScenario: schedule[0]=ON beats schedule[1]=OFF at same priority\n    Given two enabled schedules at priority=50 covering the same window starting next minute\n    And schedule[0] is continuousRecording=true\n    And schedule[1] is continuousRecording=false (+snapshot=true)\n    When I publish both to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH 5s past window start\n    Then the camera should be recording (first in list wins; ON wins)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts the first-listed ON schedule wins a same-priority full overlap (SD file grows).", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35323", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_same_priority_non_overlap_control", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Non-Overlap Control (Independent Windows)", "desc": "Feature: Recording Schedule Overlap\nScenario: When two same-priority schedules do not touch, each drives its own mode\n    Given schedule A (continuous=ON) covering minutes T..T+1\n    And a high-priority OFF gap covering minutes T+2..T+3\n    And schedule B (continuous=ON) covering minutes T+4..T+5\n    When I publish all three to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And I poll the newest /mnt/sdcard/sub mp4 size over SSH in each section\n    Then phase A is recording\n    And the gap phase is stopped\n    And phase B is recording", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts independent same-priority windows each drive SD recording on and off.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35319", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_behavior_state_machine_cycle", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Behavior: Enable-Disable-Re-Enable Cycle", "desc": "Feature: Recording Schedule Behavior\nScenario: Enable, disable, then re-enable recording across schedule swaps\n    Given an ON schedule covering [now+1min, now+long]\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\" and wait\n    Then I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And the camera should be recording (phase 1: enable)\n    When I republish it plus a higher-priority OFF schedule over the remainder to the same topic\n    Then the ACK has error=0 and the camera should stop recording (phase 2: disable)\n    When I republish both plus a higher-priority ON schedule over the remainder\n    Then the ACK has error=0 and the camera should be recording again (phase 3: re-enable)\n    And each phase is judged by polling the newest /mnt/sdcard/sub mp4 size over SSH", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT", "FWTC_SDCard_Recording"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts SD recording enables, disables and re-enables across schedule swaps.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35325", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_firmware_accepts_edge_valid", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Firmware Validation: Edge Valid Values Accepted", "desc": "Feature: Recording Schedule Firmware Validation\nScenario: Firmware accepts edge-but-valid values\n    Given raw payloads with edge values the firmware is expected to accept\n    And they cover long or unicode names, omitted priority, boundary priorities, relaxed time formats\n    When I publish each to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then each ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" should have error=0 within 5s", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts firmware ACKs edge-but-valid schedule payloads with error=0.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35328", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_firmware_bounds_combinatorial", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Firmware Validation: Combinatorial Counts Within Bounds Accepted", "desc": "Feature: Recording Schedule Firmware Validation\nScenario: Combinations of schedule and window counts within bounds are accepted\n    Given schedule/window count combinations within the allowed bounds\n    And each combination is uniquely namespaced (non-overlapping minute ranges)\n    When I publish each combination to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then every combination should ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts schedule/window count combinations within bounds are all ACKed with error=0.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35326", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_firmware_rejects_field_level_invalid", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Firmware Validation: Field-Level Invalid Values Rejected", "desc": "Feature: Recording Schedule Firmware Validation\nScenario: Firmware rejects field-level invalid values\n    Given raw payloads that bypass client pydantic, each with one obviously bad field\n    And the bad fields cover name, day names, times, priority, schedules type, or a missing field\n    When I publish each to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then each ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" has a non-zero error (or none in 5s)", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts firmware rejects payloads with one invalid field each via non-zero ACK error.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35305", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_firmware_rejects_malformed_payloads", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Firmware Validation: Malformed Payloads Rejected", "desc": "Feature: Recording Schedule Firmware Validation\nScenario: Firmware rejects malformed payloads independently of client pydantic\n    Given raw JSON payloads that bypass the client pydantic gate\n    And the payloads are 21 time windows, priority=500, a window missing continuousRecording, and non-JSON\n    When I publish each payload to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then each ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" has a non-zero error (or none in 10s)\n    And it should never reply error=0 for any of them", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts firmware returns non-zero ACK errors for malformed recording-schedule payloads.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35306", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_persistence_all_modes_off_window_accepted_as_noop", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Persistence: All-Modes-Off Window Accepted as No-Op", "desc": "Feature: Recording Schedule Persistence\nScenario: All-modes-off window is accepted but produces no effect\n    Given a schedule with one window where all three modes are false\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And /home/root/recording_schedule.json, read over SSH, should keep all three modes false", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an all-modes-off window is ACKed and persisted with all modes false.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35310", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_persistence_days_of_week_empty_preserved", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Persistence: Empty daysOfWeek Persisted Verbatim", "desc": "Feature: Recording Schedule Persistence\nScenario: Empty daysOfWeek persists as empty (camera expands locally)\n    Given a schedule with one time window whose daysOfWeek=[]\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    Then /home/root/recording_schedule.json, read over SSH, should still have daysOfWeek=[] for that window", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts an empty daysOfWeek list is persisted verbatim in recording_schedule.json.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35316", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_persistence_multi_window_round_trip", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Persistence: Multiple Time Windows Round-Trip in Order", "desc": "Feature: Recording Schedule Persistence\nScenario: Two non-overlapping windows in one schedule\n    Given a schedule with two back-to-back time windows (00:00-12:00, 12:00-23:59) on sat/sun\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\"\n    And I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    Then both windows should be present in /home/root/recording_schedule.json, read over SSH\n    And the order and start/end times should match what we sent", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts two time windows round-trip in order into recording_schedule.json.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35317", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_placeholder_intra_schedule_window_overlap", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Intra-Schedule Window Overlap Placeholder", "desc": "Feature: Recording Schedule Overlap\nScenario: Overlapping time windows inside one schedule (placeholder, skipped)\n    Given a single schedule whose timeWindows[] contains two overlapping windows\n    When the firmware defines explicit intra-schedule overlap semantics\n    Then this placeholder is replaced with the agreed behaviour (first-in-list wins, or reject)\n    And while skipped, nothing is published to \"@/VideoDataManager/RecordingScheduleConfig\"", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Skipped placeholder for intra-schedule window overlap; labelled by intended feature only.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35307", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_placeholder_same_priority_overlap_may_reject", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Overlap: Same-Priority Reject Placeholder", "desc": "Feature: Recording Schedule Overlap\nScenario: Same-priority overlap handling (placeholder, skipped)\n    Given two enabled schedules at the same priority whose windows overlap\n    When the firmware defines explicit same-priority overlap handling\n    Then this placeholder is replaced with the agreed behaviour (first-in-list wins, or reject)\n    And while skipped, nothing is published to \"@/VideoDataManager/RecordingScheduleConfig\"", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Skipped placeholder for same-priority overlap handling; labelled by intended feature only.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35313", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_wire_disable_all_placeholder_accepted", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Wire: Disable-All Placeholder Accepted", "desc": "Feature: Recording Schedule Wire Contract\nScenario: Single disabled placeholder is accepted\n    Given a single schedule {\"name\": \"All Off\", \"enabled\": false, \"priority\": 80} with no timeWindows\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Then I receive an ACK on \"@/ACK/VideoDataManager/RecordingScheduleConfig\" with error=0\n    And /home/root/recording_schedule.json, read over SSH, should contain only that disabled entry", "cls": "automated", "labels": ["FWTC_RecordingSchedule", "FWTC_MQTT"], "primary": "FWTC_RecordingSchedule", "other": ["Fenix_FW_TestCase", "Tar_FW_TestCase", "automated"], "why": "Asserts a single disabled schedule is ACKed and persisted as the only entry.", "unknown": ["FWTC_MQTT"]}, {"key": "UNI-35311", "uid": "fenix-tests/camera_system/test_mqtt_recording_schedule.py::TestMqttRecordingSchedule::test_wire_spec_example_accepted", "file": "camera_system/test_mqtt_recording_schedule.py", "title": "Recording Schedule Wire: Spec Example Payload Accepted", "desc": "Feature: Recording Schedule Wire Contract\nScenario: Multi-schedule payload accepted with ACK error=0\n    Given the spec example (3 schedules: overnight, business hours, after hours)\n    When I publish it to \"@/VideoDataManager/RecordingScheduleConfig\"\n    Th
